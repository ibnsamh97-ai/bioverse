LABS.twins={title:'اصنع توأم',ch:4,desc:'اختار من وين يجي التوأم: بيضتين لو بيضة وحدة؟ ومتى ينفصل؟ وشوف شكل المشيمة والأغشية، وجنس التوأم.',mount(root){
  const K=[
   {b:'بيضتان',ty:'أخوي',pl:2,ch:2,am:2,t:'<b>توائم أخوية:</b> بيضتان منفصلتان تنطلقان من المبيض بنفس الوقت، وكل وحدة تخصب بحيوان منوي. ما تتشابه، وجنسها <b>ممكن يتشابه أو يختلف</b>. كل جنين إله سخد وغشاء مشيمي منفصل.'},
   {b:'فلجتين',ty:'متماثل',pl:2,ch:2,am:2,t:'<b>متماثل، انفصال بمرحلة الفلجتين:</b> بيضة وحدة بحيوان منوي واحد انقسمت لخليتين، وكل خلية كوّنت جنين كامل. يمتلك الجنينان <b>مشيمتين وتجويفين للسلي والمشيمي</b>.'},
   {b:'مبكر',ty:'متماثل',pl:1,ch:1,am:2,t:'<b>متماثل، انفصال الكتلة الخلوية الداخلية مبكراً:</b> جنينان <b>بمشيمة مشتركة وتجويف مشيمي مشترك</b>، ولكل منهما <b>تجويف سلي منفصل</b>.'},
   {b:'متأخر',ty:'متماثل',pl:1,ch:1,am:1,t:'<b>متماثل، انفصال الكتلة الخلوية الداخلية متأخراً:</b> الجنينان يمتلكان <b>مشيمة مشتركة وتجويفاً مشيمياً وتجويفاً سلياً مشتركاً</b>.'},
   {b:'غير تام',ty:'سيامي',pl:1,ch:1,am:1,cj:1,t:'<b>توائم سيامية:</b> انفصال البيضة المخصبة <b>غير تام</b> فيلتحم التوأم من منطقة القحف أو الصدر أو العجز. وإذا كان أحدهما صغيراً ومتطفلاً على الآخر تسمى <b>توائم طفيلية</b>.'}];
  let k=0,sx=['♂','♀'];
  const fet=(x,y,s,c)=>`<g transform="translate(${x} ${y})"><circle cx="0" cy="-16" r="13" fill="${c}"/><ellipse cx="2" cy="10" rx="13" ry="18" fill="${c}"/><path d="M-6 22q-10 4-6 14M10 22q8 8 2 14" stroke="${c}" stroke-width="6" fill="none" stroke-linecap="round"/><text x="0" y="-12" text-anchor="middle" font-size="12" font-weight="700" fill="#3a1630">${s}</text></g>`;
  const draw=()=>{const c=K[k],L=[140,260],sk='#ffb3a7';
    let g=`<path d="M40 40Q40 220 200 226Q360 220 360 40" fill="#ff6fb5" fill-opacity=".06" stroke="${C4.pink}" stroke-width="2.5"/>`+stx(366,232,'الرحم',C4.pink,13);
    g+=c.pl===2?L.map(x=>`<path d="M${x-46} 62Q${x} 34 ${x+46} 62" stroke="#c2185b" stroke-width="11" fill="none" stroke-linecap="round"/>`).join(''):`<path d="M96 62Q200 22 304 62" stroke="#c2185b" stroke-width="11" fill="none" stroke-linecap="round"/>`;
    g+=c.ch===2?L.map(x=>`<ellipse cx="${x}" cy="128" rx="56" ry="64" fill="none" stroke="${C4.red}" stroke-width="2"/>`).join(''):`<ellipse cx="200" cy="130" rx="122" ry="70" fill="none" stroke="${C4.red}" stroke-width="2"/>`;
    g+=c.am===2?L.map(x=>`<ellipse cx="${x}" cy="132" rx="42" ry="50" fill="#7fd8fb" fill-opacity=".08" stroke="${C4.blue}" stroke-width="2"/>`).join(''):`<ellipse cx="200" cy="134" rx="${c.cj?64:100}" ry="54" fill="#7fd8fb" fill-opacity=".08" stroke="${C4.blue}" stroke-width="2"/>`;
    g+=c.cj?fet(186,132,sx[0],sk)+fet(214,132,sx[0],sk)+'<ellipse cx="200" cy="140" rx="9" ry="13" fill="#ffb3a7"/>':fet(L[0],132,sx[0],sk)+fet(L[1],132,sx[1],sk);
    $('#tw-st',root).innerHTML=svgEl(400,240,g);
    $('#tw-t',root).innerHTML=c.t;
    $('#tw-k',root).innerHTML=`<span class="tag">${c.ty==='أخوي'?'بيضتان + حيوانان منويان':'بيضة واحدة + حيوان منوي واحد'}</span><span class="tag">${sx[0]===sx[1]?'نفس الجنس':'جنس مختلف'}</span>`;
    $$('[data-k]',root).forEach(b=>b.classList.toggle('on',+b.dataset.k===k))};
  const roll=()=>{const a=Math.random()<.5?'♂':'♀';sx=K[k].ty==='أخوي'?[a,Math.random()<.5?'♂':'♀']:[a,a];draw()};
  root.innerHTML=`<div class="row" style="flex-wrap:wrap;gap:8px;margin-bottom:10px"><span class="mut" style="font-size:.84rem">أصل التوأم ووقت الانفصال:</span><span class="seg" role="group" aria-label="نوع التوأم">${K.map((c,i)=>`<button data-k="${i}">${c.b}</button>`).join('')}</span></div>
   <div class="stage" id="tw-st"></div>
   <p class="legend">الخط الأحمر الغامق السخد (المشيمة)، الأحمر الفاتح الغشاء المشيمي، والأزرق الغشاء السلي.</p>
   <div class="row" style="margin-top:10px;gap:8px;flex-wrap:wrap"><button class="btn sm pri" data-roll>${ic('play')} ولّد توأم جديد</button><span id="tw-k" class="row" style="gap:6px"></span></div><div class="info" id="tw-t"></div>`;
  root.addEventListener('click',e=>{const b=e.target.closest('[data-k]');if(b){k=+b.dataset.k;roll();return}if(e.target.closest('[data-roll]'))roll()});
  roll();
}};

LABS.stem={title:'الخلية الجذعية تختار',ch:4,desc:'خلية غير متخصصة تقدر تصير عصبية أو عضلية أو دم. اختار وشوفها تتمايز، وبعدها اختبر نفسك: هاي الصفة لأي نوع من الخلايا الجذعية؟',mount(root){

   ['توجد مع الخلايا المتخصصة في الجسم','البالغة'],['توجد بكمية قليلة مما يؤدي إلى صعوبة عزلها','البالغة'],['يقل عددها مع تقدم العمر','البالغة'],['قد تكون غير سليمة','البالغة'],
   ['تؤخذ من دم الحبل السري','الحبل السري'],['تقاوم ظروف التجميد (−196 °م) في النتروجين السائل لسنين عديدة','الحبل السري'],['تصنف كنوع آخر من الخلايا الجذعية البالغة','الحبل السري']],'هاي الصفة للخلايا الجذعية');

/* ---------- home ---------- */

/* ---------- chapter ---------- */
function vChapter(C){
  setAc(C.n);app.className='wrap narrow';
  const labs=Object.entries(LABS).filter(([k,l])=>l.ch===C.n),dn=C.lessons.filter(L=>S.done[L.id]).length,nxt=C.lessons.find(L=>!S.done[L.id]),p=chProgress(C)*100;
  app.innerHTML=`<a class="back" href="#home">${ic('right')} الرئيسية</a>
  <header class="chead" style="margin-top:12px">${spec(C.n,p,true)}<div><p class="k">الفصل ${C.n}، الصفحات ${C.pages} من الكتاب</p><h1>${C.name}</h1></div>
    <p class="story">${C.story}</p>${C.lessons.length?`<div class="prog"><div class="bar"><i style="width:${p}%"></i></div><span>${dn} من ${C.lessons.length} درس</span></div>`:''}</header>
  ${nxt?`<div class="row" style="margin-top:18px"><a class="btn pri" href="#${nxt.id}">${ic('play')} ${dn?'كمّل من':'ابدأ من'} الدرس ${nxt.i+1}</a></div>`:''}
  <section class="sec"><h2>الدروس</h2>${C.lessons.length?`<div class="path">${C.lessons.map((L,i)=>{const n=(LQ.get(L.id)||{size:0}).size;return `<a class="ln${S.done[L.id]?' done':L===nxt?' next':''}" href="#${L.id}"><span class="d num">${S.done[L.id]?ic('check'):i+1}</span><span><span class="t">${esc(L.title)}</span><span class="m"><span>ص ${L.pages}</span><span>${L.mins} دقائق</span>${n?`<span class="x">${n} سؤال وزاري</span>`:''}</span></span>${ic('left')}</a>`}).join('')}</div>`
    :`<p class="mut">دروس هذا الفصل تُضاف الآن. أسئلته الوزارية موجودة في <a class="ac" href="#bank">بنك الوزاريات</a>.</p>`}</section>
  ${labs.length?`<section class="sec"><h2>مختبر الفصل</h2><div class="labs">${labs.map(([k,l])=>labCard(k,l)).join('')}</div></section>`:''}
  ${C.lessons.length?`<section class="sec"><h2>وحش الفصل</h2><div class="boss"><b>عشرة أسئلة وزارية حقيقية من هذا الفصل</b><span class="mut">إذا جبت 70% أو أكثر تاخذ وسام الفصل و100 نقطة.${S.boss[C.n]?` أفضل نتيجة إلك: <b class="num">${S.boss[C.n]}%</b>`:''}</span><a class="btn pri" href="#boss-${C.key}">${ic('target')} واجه الوحش</a></div></section>`:''}`;
}
const labCard=(k,l)=>`<a class="labc" data-c="${l.ch}" href="#lab-${k}"><span class="ib">${ic('flask')}</span><b>${l.title}</b><small>${l.desc}</small></a>`;

/* ---------- lesson ---------- */
const BOX={key:['الخلاصة','star'],tip:['حيلة حفظ','bulb'],warn:['انتبه','warn'],iq:['بالعراقي','chat'],exam:['ملاحظة وزارية','doc'],like:['تشبيه','link']};
function blockHtml(b,L,i){
  switch(b.t){
    case 'p':return `<p>${fmt(b.x)}</p>`;
    case 'h':return `<h3>${fmt(b.x)}</h3>`;
    case 'h4':return `<h4>${fmt(b.x)}</h4>`;
    case 'ul':return `<ul>${b.items.map(x=>`<li>${fmt(x)}</li>`).join('')}</ul>`;
    case 'ol':return `<ol>${b.items.map(x=>`<li>${fmt(x)}</li>`).join('')}</ol>`;
    case 'hook':return `<p class="hook">${fmt(b.x)}</p>`;
    case 'def':return `<div class="defc"><div class="lb"><span class="nm">${fmt(b.a)}</span><span class="row" style="gap:6px">${freqTag(b.card.freq)}<span class="tag">تعريف</span></span></div><div>${fmt(b.b)}</div></div>`;
    case 'why':return `<div class="whyc"><div class="lb"><span class="tag a">علل</span>${freqTag(TOPIC.get(norm(b.a))||0)}</div><div class="nm">${fmt(b.a)}</div><div class="an">${fmt(b.b)}</div></div>`;
    case 'tbl':return `<div class="tblw"><table><thead><tr>${b.head.map(c=>`<th>${fmt(c)}</th>`).join('')}</tr></thead><tbody>${b.rows.map(r=>`<tr>${r.map(c=>`<td>${fmt(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    case 'cross':return `<div class="cross"><div class="ct">${fmt(b.title)}</div>${b.rows.map(r=>`<div class="cr"><span class="k">${fmt(r[0])}</span>${(r.length<3||!r[2])?`<span class="w">${fmt(r[1]||'')}</span>`:`<span>${fmt(r[1])}</span><span>${fmt(r[2])}</span>`}</div>`).join('')}</div>`;
    case 'id':return `<div class="idc"><div class="hd"><b>${fmt(b.name)}</b><span class="row" style="gap:6px">${freqTag(b.card.freq)}<span class="tag a">بطاقة هوية</span></span></div><dl>${b.rows.map(r=>`<div><dt>${fmt(r[0])}</dt><dd>${fmt(r.slice(1).join(' | '))}</dd></div>`).join('')}</dl></div>`;
    case 'prob':case 'case':return `<div class="prob" data-prob><span class="lbl">${b.t==='case'?'أنت الدكتور':'مسألة'}</span><div class="q">${fmt(b.q)}</div><ol>${b.steps.map(s=>`<li hidden><span>${fmt(s)}</span></li>`).join('')}</ol>
      <div class="row"><button class="btn sm pri" data-act="step">اكشف الخطوة التالية</button><button class="btn sm" data-act="allsteps">اكشف الحل كله</button></div></div>`;
    case 'quiz':{const id=L.id+'-q'+i;const os=shuffle(b.o);return `<div class="quiz" data-quiz="${id}"><span class="lbl">اختبر نفسك</span><div class="q">${fmt(b.q)}</div><div class="os">${os.map(o=>`<button class="o" data-ok="${o[0]==='*'?1:0}">${fmt(o.replace(/^\*/,''))}</button>`).join('')}</div></div>`}
    case 'lab':{const l=LABS[b.name];return `<div class="labbox dk" data-lab="${b.name}" data-arg="${esc(b.arg)}"><div class="lt"><span>${l?l.title:'مختبر'}</span><small>جرّب بإيدك</small></div><div class="lb"></div></div>`}
    default:{const m=BOX[b.t];if(m)return `<div class="box ${b.t}"><span class="lb">${ic(m[1])}${m[0]}</span><div>${fmt(b.x)}</div></div>`;return ''}
  }
}
function vLesson(L){
  const C=L.C;setAc(C.n);app.className='wrap narrow';
  const qs=[...(LQ.get(L.id)||[])].map(k=>GROUPS.get(k)).sort((a,b)=>b.occ.length-a.occ.length);
  const prev=C.lessons[L.i-1],next=C.lessons[L.i+1]||((CHS[C.n]||{}).lessons||[])[0];
  app.innerHTML=`<div class="lhead"><div class="meta"><a class="back" href="#${C.key}">${ic('right')} ${C.name}</a><span class="tag">الدرس ${L.i+1} من ${C.lessons.length}</span></div><h1>${esc(L.title)}</h1>
    <div class="row" style="gap:6px"><span class="tag a">ص ${L.pages} من الكتاب</span><span class="tag">${L.mins} دقائق</span>${S.done[L.id]?`<span class="tag k">مكتمل</span>`:''}</div></div>
  <article class="lesson">${L.blocks.map((b,i)=>blockHtml(b,L,i)).join('')}</article>
  ${qs.length?`<section class="sec"><h2>تحدي الوزاري<small>${qs.length} سؤال من هذا الدرس</small></h2><p class="mut" style="margin-bottom:12px">أسئلة إجت فعلاً بالامتحان الوزاري. جاوب بقلبك أول، وبعدها اكشف الجواب.</p><div class="list">${qs.map(g=>mq(g)).join('')}</div></section>`:''}
  <div class="fin">${S.done[L.id]?`<b>أكملت هذا الدرس</b>`:`<b>خلّصت القراءة؟</b><span class="mut">سجّل الدرس كمكتمل حتى تنفتح بطاقاته بألبومك ويتقدم معدلك.</span><button class="btn pri" data-act="done" data-id="${L.id}">${ic('check')} أكملت الدرس</button>`}</div>
  <nav class="pager">${prev?`<a href="#${prev.id}"><small>الدرس السابق</small><span>${esc(prev.title)}</span></a>`:'<span></span>'}${next?`<a class="nx" href="#${next.id}"><small>الدرس التالي</small><span>${esc(next.title)}</span></a>`:`<a class="nx" href="#boss-${C.key}"><small>نهاية الفصل</small><span>واجه وحش الفصل</span></a>`}</nav>`;
  $$('[data-lab]',app).forEach(n=>mountLab($('.lb',n),n.dataset.lab,n.dataset.arg));
  const rp=$('#rp'),bar=$('i',rp),f=()=>{const max=document.documentElement.scrollHeight-innerHeight;bar.style.width=(max>0?Math.min(100,scrollY/max*100):0)+'%'};
  rp.hidden=false;f();addEventListener('scroll',f,{passive:true});cleanups.push(()=>{removeEventListener('scroll',f);rp.hidden=true});
}

/* ---------- ministerial question card ---------- */
const stripTags=s=>s.replace(/<[^>]+>/g,' ');
function mq(g,compact){
  const a=ANS.get(g.k);let body;
  if(g.ty==='mcq'){const p=g.x.split('::');body=`${fmt(p[0].trim())}<div class="chips" style="margin-top:8px">${p[1].split(';').map(o=>`<button class="chipb" data-act="opt">${fmt(o.trim())}</button>`).join('')}</div>`}
  else if(g.ty==='cmp')body=fmt(g.x.replace('↔','و'));else body=fmt(g.x);
  const yrs=[...new Set(g.occ.map(o=>o.e.short))];
  return `<div class="mq" data-k="${esc(g.k)}"><div class="h"><span class="tag a">${TYPES[g.ty]}</span>${g.occ.length>1?`<span class="tag g">تكرر ${g.occ.length} مرات</span>`:''}${S.kn[g.k]===1?`<span class="tag k">عرفته</span>`:''}${compact?'':`<span class="y">${yrs.slice(0,3).join('، ')}${yrs.length>3?' وغيرها':''}</span>`}</div>
    <div class="x">${body}</div><div class="f"><button class="btn sm" data-act="show">${ic('eye')} اكشف الجواب</button></div>
    <div class="a" hidden>${a?a.html:`<span class="none">جواب هذا السؤال يُضاف مع درسه في فصل «${CHS[g.ch-1].name}».</span>`}
      <div class="f" style="margin-top:10px">${a&&a.lid&&LESSONS.has(a.lid)?`<a class="btn sm" href="#${a.lid}">${ic('book')} افتح الدرس</a>`:''}<button class="btn sm" data-act="kn" data-v="1">${ic('check')} عرفته</button><button class="btn sm" data-act="kn" data-v="0">ما عرفته</button></div></div></div>`;
}

/* ---------- bank ---------- */
const BK={tab:'top',ty:'',ch:0,q:'',n:40};
function vBank(){
  setAc(0);app.className='wrap narrow';
  const tabs=[['top','الأكثر تكراراً'],['year','حسب السنة'],['type','حسب النوع'],['ch','حسب الفصل']];
  let body='';const all=[...GROUPS.values()];
  if(BK.tab==='year'&&!BK.q){body=`<div class="path">${EXAMS.map(e=>`<a class="ln" href="#paper-${e.id}"><span class="d num">${/^\d/.test(e.y)?e.y.slice(2):'؟'}</span><span><span class="t">${e.t}</span><span class="m"><span>${e.items.length} فقرة</span></span></span>${ic('left')}</a>`).join('')}</div>`}
  else{
    let ls=all;
    if(BK.q){const q=norm(BK.q);ls=ls.filter(g=>g.tk.includes(q))}
    else if(BK.tab==='top')ls=ls.filter(g=>g.occ.length>1);
    else if(BK.tab==='type'){if(!BK.ty)BK.ty='def';ls=ls.filter(g=>g.ty===BK.ty)}
    else if(BK.tab==='ch'){if(!BK.ch)BK.ch=1;ls=ls.filter(g=>g.ch===BK.ch)}
    ls.sort((a,b)=>b.occ.length-a.occ.length);
    const chips=BK.q?'':BK.tab==='type'?`<div class="tabs" style="margin-bottom:12px">${Object.keys(TYPES).filter(t=>all.some(g=>g.ty===t)).map(t=>`<button data-act="bk" data-f="ty" data-v="${t}"${BK.ty===t?' class="on"':''}>${TYPES[t]}</button>`).join('')}</div>`
      :BK.tab==='ch'?`<div class="tabs" style="margin-bottom:12px">${CHS.map(c=>`<button data-act="bk" data-f="ch" data-v="${c.n}"${BK.ch===c.n?' class="on"':''}>${c.name}</button>`).join('')}</div>`:'';
    body=chips+`<p class="mut" style="margin-bottom:10px;font-size:.875rem">${ls.length?`<span class="num">${ls.length}</span> سؤال`:'ما لگينا سؤال بهذي الكلمة. جرّب كلمة أقصر.'}</p><div class="list">${ls.slice(0,BK.n).map(g=>mq(g)).join('')}</div>${ls.length>BK.n?`<div class="row" style="margin-top:14px"><button class="btn" data-act="bk" data-f="n" data-v="${BK.n+40}">اعرض 40 سؤال آخر</button></div>`:''}`;
  }
  app.innerHTML=`<div class="phead"><h1>بنك الوزاريات</h1><p>${EXAMS.length} نموذج وزاري من 2021 إلى 2025. بيها ${ITEMS.length} فقرة، ومنها ${GROUPS.size} سؤال غير مكرر. أسئلة التكوين الجنيني والوراثة بدت تجي من 2024.</p></div>
  <div style="display:grid;gap:12px;margin-top:16px"><input class="inp" id="bk-q" type="search" placeholder="ابحث بكلمة: الجسيم الطرفي، التناضح، Rh" value="${esc(BK.q)}" aria-label="ابحث في الأسئلة">
  ${BK.q?'':`<div class="tabs">${tabs.map(t=>`<button data-act="bk" data-f="tab" data-v="${t[0]}"${BK.tab===t[0]?' class="on"':''}>${t[1]}</button>`).join('')}</div>`}<div>${body}</div>
  <a class="tile" href="#night" style="grid-template-columns:38px 1fr;align-items:center"><span class="ib">${ic('moon')}</span><span>ليلة الامتحان<small>بس الأسئلة اللي تكررت 3 مرات أو أكثر، وكل الرسوم والمقارنات</small></span></a></div>`;
  const q=$('#bk-q');q.addEventListener('input',()=>{BK.q=q.value;BK.n=40;clearTimeout(vBank.t);vBank.t=setTimeout(()=>{const p=q.selectionStart;vBank();const n=$('#bk-q');n.focus();try{n.setSelectionRange(p,p)}catch(e){}},350)});
}
function vPaper(id){
  const e=EXAMS.find(x=>x.id===id);if(!e)return vBank();setAc(0);app.className='wrap narrow';

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const o=e.target.closest('.quiz .o');
  if(o){const q=o.closest('.quiz');if(q.dataset.done)return;q.dataset.done=1;const ok=o.dataset.ok==='1';o.classList.add(ok?'ok':'no');$$('.o',q).forEach(b=>{b.disabled=true;if(b.dataset.ok==='1')b.classList.add('ok')});
    if(ok&&!S.qz[q.dataset.quiz]){S.qz[q.dataset.quiz]=1;gain(5,'جواب صحيح')}return}
  const t=e.target.closest('[data-act]');if(!t)return;const act=t.dataset.act;
  if(act==='close'){if(e.target===t||t.tagName==='BUTTON')$$('.modal').forEach(x=>x.remove());return}
  if(act==='step'||act==='allsteps'){const p=t.closest('[data-prob]');const hid=$$('li[hidden]',p);(act==='step'?hid.slice(0,1):hid).forEach(li=>li.hidden=false);if($$('li[hidden]',p).length===0)$$('[data-act=step],[data-act=allsteps]',p).forEach(b=>b.disabled=true)}
  else if(act==='show'){const m=t.closest('.mq');$(':scope>.a',m).hidden=false;t.hidden=true}
  else if(act==='opt'){const m=t.closest('.mq'),a=ANS.get(m.dataset.k);if(!a){$(':scope>.a',m).hidden=false;return}const ok=norm(t.textContent)===norm(stripTags(a.html));t.classList.add(ok?'ok':'no');$(':scope>.a',m).hidden=false;const sb=$('[data-act=show]',m);if(sb)sb.hidden=true}
  else if(act==='kn'){const m=t.closest('.mq'),k=m.dataset.k,v=+t.dataset.v,first=S.kn[k]===undefined;S.kn[k]=v;save();m.dataset.res=v;$$('[data-act=kn]',m).forEach(b=>b.classList.toggle('pri',b===t));if(v&&first)gain(3,'سؤال وزاري');else toast(v?'ممتاز، انحسبت إلك':'ولا يهمك، راجع درسه وارجع له')}
  else if(act==='done'){const id=t.dataset.id;if(!S.done[id]){S.done[id]=Date.now();gain(40,'أكملت الدرس');const n=[...CARDS.values()].filter(c=>c.lid===id).length;if(n)setTimeout(()=>toast('انفتحت '+n+' بطاقة جديدة بألبومك'),1600)}route(true)}

  else if(act==='alb'){ALB=+t.dataset.v;vAlbum()}
  else if(act==='card'){cardModal(CARDS.get(t.dataset.id))}
  else if(act==='review'){const cs=[...CARDS.values()].filter(c=>S.done[c.lid]);if(!cs.length){toast('أكمل درساً أول حتى تنفتح إلك بطاقات');return}cardModal(cs[Math.random()*cs.length|0],true)}
  else if(act==='flip'){$('#cf').hidden=false;t.hidden=true}
  else if(act==='saveprof'){S.prof={name:$('#pf-name').value.trim(),school:$('#pf-school').value.trim(),gov:$('#pf-gov').value.trim()};save();toast('انحفظت بياناتك');vMe()}
  else if(act==='theme'){toggleTheme();vMe()}
  else if(act==='reset'){if(t.dataset.sure){S={xp:0,done:{},qz:{},kn:{},streak:0,last:'',prof:S.prof,theme:S.theme,boss:{},seenCards:{}};save();toast('انمسح تقدمك');route()}else{t.dataset.sure=1;t.textContent='متأكد؟ اضغط مرة ثانية حتى ينمسح'}}
  else if(act==='bossdone'){const ms=$$('#boss .mq'),un=ms.filter(m=>m.dataset.res===undefined).length;if(un){toast('باقي '+un+' سؤال ما قيّمته');return}
    const sc=Math.round(ms.filter(m=>m.dataset.res==='1').length/ms.length*100),ch=+t.dataset.ch,was=S.boss[ch]||0;S.boss[ch]=Math.max(was,sc);save();
    $('#bossres').innerHTML=`<div style="font:800 2.25rem var(--f-d)" class="num">${sc}%</div><div>${sc>=70?'عبرت الوحش، ووسام الفصل صار إلك.':'قريب. راجع الأسئلة اللي ما عرفتها وجرّب مرة ثانية.'}</div>`;if(sc>=70&&was<70)gain(100,'وسام الفصل')}
  else if(act==='timer'){t.disabled=true;const tm=$('#tm');tm.hidden=false;let s=3*3600;const iv=setInterval(()=>{s--;if(s<=0||!tm.isConnected){clearInterval(iv);return}tm.textContent=(s/3600|0)+':'+String(s/60%60|0).padStart(2,'0')+':'+String(s%60).padStart(2,'0')},1000);cleanups.push(()=>clearInterval(iv))}
});
function toggleTheme(){S.theme=isDark()?'light':'dark';save();applyTheme();paintTop()}
$('#b-theme').addEventListener('click',()=>{toggleTheme();if(paintTop.h==='me')vMe()});
if(S.lite&&!S.theme){S.theme='light';delete S.lite}
applyTheme();

/* ---------- router ---------- */
function route(keep){
  const h=(location.hash||'').replace(/^#/,'')||'home',y=keep===true?scrollY:0;
  cleanups.forEach(f=>{try{f()}catch(e){}});cleanups=[];$$('.modal').forEach(x=>x.remove());
  let C;
  if((C=CHS.find(c=>c.key===h)))vChapter(C);
  else if(LESSONS.has(h))vLesson(LESSONS.get(h));
  else if(h==='labs')vLabs();
  else if(h.startsWith('lab-'))vLab(h.slice(4));
  else if(h==='bank')vBank();
  else if(h.startsWith('paper-'))vPaper(h.slice(6));
  else if(h.startsWith('boss-'))vBoss(h.slice(5));
  else if(h==='album')vAlbum();
  else if(h==='me')vMe();
  else if(h==='night')vNight();
  else if(h==='admin'&&window.BVG&&BVG.route(h,app)){}
  else vHome();
  paintTop(h);window.scrollTo(0,y);
}
window.addEventListener('hashchange',()=>route());
route();

};

/* ---- stage: animated DNA helix behind every gate screen ---- */
function helix(cv){
  const ctx=cv.getContext('2d');let w=0,h=0,dpr=1,t=0,raf=0,last=0;
  const N=30,BP=[['#ff7ab8','#6fd2ff'],['#7be3a4','#ffb36b']],seq=Array.from({length:N},(_,i)=>(i*5+i*i)%4);
  const rn=(i,q)=>{const x=Math.sin(i*127.1+q*311.7)*43758.5453;return x-Math.floor(x)};
  const dust=Array.from({length:46},(_,i)=>({x:rn(i,1),y:rn(i,2),r:.5+rn(i,3)*1.5,v:.004+rn(i,4)*.012,a:.15+rn(i,5)*.35}));
  const size=()=>{dpr=Math.min(2,devicePixelRatio||1);w=cv.clientWidth;h=cv.clientHeight;cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr)};
  function draw(){
    ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);
    for(const d of dust){const y=((d.y-t*d.v)%1+1)%1;ctx.fillStyle=`rgba(201,184,255,${d.a})`;ctx.beginPath();ctx.arc(d.x*w,y*h,d.r,0,7);ctx.fill()}
    const wide=w>=900,cx=wide?w*.3:w*.5,cy=wide?h*.5:h*.36,len=wide?h*1.25:Math.hypot(w,h)*.95,A=wide?Math.min(w*.1,120):Math.min(w*.2,92);
    ctx.save();ctx.translate(cx,cy);ctx.rotate(wide?-1.32:-1.05);
    const step=len/(N-1),pts=[];
    for(let i=0;i<N;i++){const x=-len/2+i*step,p=t*.9+i*.46,s=Math.sin(p),c=Math.cos(p);pts.push({x,y1:A*s,z1:c,y2:-A*s,z2:-c,b:seq[i]})}
    const strand=(k,col)=>{for(let i=0;i<N-1;i++){const a=pts[i],b=pts[i+1],za=k?a.z2:a.z1,zb=k?b.z2:b.z1,z=(za+zb)/2;
      ctx.strokeStyle=col.replace('A',(.18+.5*(z+1)/2).toFixed(3));ctx.lineWidth=1.4+1.6*(z+1)/2;ctx.beginPath();ctx.moveTo(a.x,k?a.y2:a.y1);ctx.lineTo(b.x,k?b.y2:b.y1);ctx.stroke()}};
    strand(1,'rgba(159,196,255,A)');
    for(const p of pts){const f=(Math.abs(p.z1)<.15)?.5:1,cp=BP[p.b%2],[c1,c2]=p.b>1?[cp[1],cp[0]]:cp,al=.22+.55*(1-Math.abs(p.z1))*f;
      const m=(p.y1+p.y2)/2;ctx.lineWidth=2.2;ctx.globalAlpha=al;ctx.strokeStyle=c1;ctx.beginPath();ctx.moveTo(p.x,p.y1);ctx.lineTo(p.x,m);ctx.stroke();ctx.strokeStyle=c2;ctx.beginPath();ctx.moveTo(p.x,m);ctx.lineTo(p.x,p.y2);ctx.stroke();ctx.globalAlpha=1}
    strand(0,'rgba(201,184,255,A)');
    for(const p of pts)for(const [y,z,c] of [[p.y1,p.z1,'#e6dcff'],[p.y2,p.z2,'#cfe2ff']]){const r=1.6+2.6*(z+1)/2;ctx.globalAlpha=.25+.75*(z+1)/2;ctx.fillStyle=c;ctx.shadowColor=c;ctx.shadowBlur=z>.3?10:0;ctx.beginPath();ctx.arc(p.x,y,r,0,7);ctx.fill()}
    ctx.globalAlpha=1;ctx.shadowBlur=0;ctx.restore();
  }
  function loop(ts){raf=requestAnimationFrame(loop);if(G.hidden){cancelAnimationFrame(raf);return}const dt=Math.min(.05,(ts-(last||ts))/1000);last=ts;t+=dt*.55;draw()}
  size();addEventListener('resize',()=>{size();draw()});
  if(RM){t=1.2;draw()}else raf=requestAnimationFrame(loop);
  document.addEventListener('visibilitychange',()=>{if(RM)return;cancelAnimationFrame(raf);last=0;if(!document.hidden&&!G.hidden)raf=requestAnimationFrame(loop)});
}

/* ---- decryption ---- */
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const loadScript=src=>new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=no;document.head.appendChild(s)});
async function unlock(k){
  const key=await crypto.subtle.importKey('raw',b64(k),'AES-GCM',false,['decrypt']);
  const b=b64(document.getElementById('bv-blob').textContent.trim());
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b.slice(0,12)},key,b.slice(12));
  let txt;
  if('DecompressionStream' in window)txt=await new Response(new Blob([pt]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  else{await loadScript(PAKO);txt=pako.ungzip(new Uint8Array(pt),{to:'string'})}
  return JSON.parse(txt);
}

async function enter(u){
  vLoading('نجهّز حسابك…');
  const ref=db.collection('users').doc(u.uid);const TS=firebase.firestore.FieldValue.serverTimestamp;
  try{
    let s=await ref.get();
    if(!s.exists){await ref.set({name:u.displayName||'',email:u.email||'',photo:u.photoURL||'',created:TS(),until:null,blocked:false,last:TS(),dev:devId()});s=await ref.get()}
    else ref.update({last:TS(),name:u.displayName||'',photo:u.photoURL||''}).catch(()=>{});
    const d=s.data();const created=d.created?d.created.toDate():new Date(),until=d.until?d.until.toDate():null,now=Date.now();
    let k=null;try{const ks=await db.collection('keys').doc('main').get();k=ks.exists?ks.data().k:null}catch(e){if(e.code!=='permission-denied')throw e}
    let admin=false;if(k){try{await db.collection('users').limit(1).get();admin=true}catch(e){}}
    if(!k){let adm=false;try{await db.collection('users').limit(1).get();adm=true}catch(e){}
      if(adm){vKeySetup();return}
      const why=d.blocked?'blocked':until?'ended':'trial';vLocked(u,d,why);return}
    const trialEnd=created.getTime()+TRIAL_MS;
    ACC={u,admin,mode:admin?'admin':(until&&until>now?'paid':'trial'),ends:admin?null:new Date(Math.max(trialEnd,until?until.getTime():0)),trialEnd:new Date(trialEnd),until};
    vLoading('نفتح الدروس…');
    const T=await unlock(k);
    for(const id in T){const n=document.createElement('script');n.type='text/plain';n.id='src-'+id;n.textContent=T[id];document.body.appendChild(n)}
    booted=true;G.hidden=true;G.innerHTML='';document.body.classList.remove('gated');
    window.__boot();chip();
    if(ACC.mode!=='admin'){clearInterval(timer);timer=setInterval(()=>{if(ACC.ends&&Date.now()>ACC.ends.getTime())location.reload()},60e3)}
  }catch(e){console.error(e);vError()}
}

async function adminAct(b){
  const card=b.closest('[data-uid]'),id=card.dataset.uid,x=AD.list.find(y=>y.id===id),act=b.dataset.g,TSf=firebase.firestore.Timestamp.fromDate;let patch;
  const base=Math.max(Date.now(),x.until?x.until.toDate().getTime():0);
  if(act==='add')patch={until:TSf(new Date(base+ +b.dataset.v*864e5)),blocked:false};
  else if(act==='year')patch={until:TSf(YEAR_END),blocked:false};
  else if(act==='unpay')patch={until:null};
  else if(act==='block')patch={blocked:true};
  else if(act==='unblock')patch={blocked:false};
  b.disabled=true;
  try{await db.collection('users').doc(id).update(patch);Object.assign(x,patch);adminView(document.getElementById('app'))}catch(e){b.disabled=false;alertBar('ما انحفظ التغيير، جرّب مرة ثانية.')}
}
function alertBar(t){let n=document.getElementById('g-toast');if(!n){n=document.createElement('div');n.id='g-toast';n.className='g-toast';n.setAttribute('role','status');document.body.appendChild(n)}n.textContent=t;n.classList.add('on');clearTimeout(n.t);n.t=setTimeout(()=>n.classList.remove('on'),2600)}

document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-g]');if(!b)return;const g=b.dataset.g;
  if(g==='login'){b.disabled=true;const p=new firebase.auth.GoogleAuthProvider();p.setCustomParameters({prompt:'select_account'});
    try{await auth.signInWithPopup(p)}catch(err){console.error('[gate]',err&&err.code);b.disabled=false;const m=authMsg(err);if(m)vLogin(m)}}
  else if(g==='out'){await auth.signOut();location.hash='';location.reload()}
  else if(g==='recheck')location.reload();
  else if(g==='retry')location.reload();
  else if(g==='copy'){try{await navigator.clipboard.writeText(b.dataset.v);b.textContent='انسخ ✓'}catch(_){prompt('انسخ:',b.dataset.v)}}
  else if(g==='f'){AD.f=b.dataset.v;adminView(document.getElementById('app'))}
  else if(['add','year','unpay','block','unblock'].includes(g))adminAct(b);
});
init();
})();

</script>
