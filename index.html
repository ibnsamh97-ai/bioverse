<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta property="og:title" content="بايوڤيرس: أحياء السادس العلمي">
<meta property="og:description" content="الكتاب كله درس درس، مختبرات تفاعلية، وأسئلة الوزاري 2021–2026 مع أجوبتها.">
<title>بايوڤيرس BioVerse</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="منصة دراسة تفاعلية لكتاب علم الأحياء للصف السادس العلمي — إعداد: مؤمن العبيدي">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;700;800&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">

<style>
/* BioVerse design system
   Layout: reading is paper (light, quiet, start-aligned, one column); experimenting is an instrument screen (.dk dark panels).
   Colour is information: every chapter owns one microscope-stain hue (--c1..--c5) and --ac always means "the chapter you are in".
   Global screens use ink (--c0). Signature element: chapter cards built as labelled microscope slides.
   Radius by role: 8 controls-in-controls, 14 cards and buttons, 20 panels. No decorative shadows; buttons have a pressed edge. */
:root{
  --bg:#F4F5F9; --bg2:#ECEEF4; --solid:#FFFFFF; --glass:#F0F1F6; --glass2:#E5E7F0; --line:#D9DCE8;
  --fg:#161A33; --mut:#50556E; --dim:#8086A0;
  --c0:#161A33; --c1:#1D62D8; --c2:#C92B6B; --c3:#16824A; --c4:#B8500F; --c5:#6540D9;
  --ac:var(--c0); --ink:#FFFFFF;
  --ok:#14804A; --bad:#D22F4A; --gold:#946500; --silver:#5F6884; --bronze:#A0582A;
  --panel:#12152A; --stage:#0A0C16;
  --f-d:'Alexandria','IBM Plex Sans Arabic',system-ui,sans-serif;
  --f-b:'IBM Plex Sans Arabic','Segoe UI',Tahoma,system-ui,sans-serif;
  --f-m:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --r-s:8px; --r-m:14px; --r-l:20px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]):not(.t-light){
    --bg:#0E1018; --bg2:#090B11; --solid:#171A26; --glass:#1C2030; --glass2:#262B3F; --line:#2F354B;
    --fg:#ECEEF6; --mut:#A7ADC4; --dim:#727993;
    --c0:#ECEEF6; --c1:#6CA6FF; --c2:#FF7AA8; --c3:#4FD494; --c4:#FFA05C; --c5:#A990FF;
    --ink:#0E1018; --ok:#4FD494; --bad:#FF7088; --gold:#F2C14E; --silver:#C4CBE0; --bronze:#E3A06D;
    --panel:#171A26; color-scheme:dark;
  }
}
:root[data-theme="dark"]:not(.t-light), :root.t-dark, .dk{
  --bg:#0E1018; --bg2:#090B11; --solid:#171A26; --glass:#1C2030; --glass2:#262B3F; --line:#2F354B;
  --fg:#ECEEF6; --mut:#A7ADC4; --dim:#727993;
  --c0:#ECEEF6; --c1:#6CA6FF; --c2:#FF7AA8; --c3:#4FD494; --c4:#FFA05C; --c5:#A990FF;
  --ink:#0E1018; --ok:#4FD494; --bad:#FF7088; --gold:#F2C14E; --silver:#C4CBE0; --bronze:#E3A06D;
  color-scheme:dark;
}
:root[data-theme="dark"]:not(.t-light), :root.t-dark{--panel:#171A26}
.dk{--ac:var(--c0);color:var(--fg)}
[data-c="1"],:root[data-ch="1"],:root[data-ch="1"] .dk{--ac:var(--c1)}
[data-c="2"],:root[data-ch="2"],:root[data-ch="2"] .dk{--ac:var(--c2)}
[data-c="3"],:root[data-ch="3"],:root[data-ch="3"] .dk{--ac:var(--c3)}
[data-c="4"],:root[data-ch="4"],:root[data-ch="4"] .dk{--ac:var(--c4)}
[data-c="5"],:root[data-ch="5"],:root[data-ch="5"] .dk{--ac:var(--c5)}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:400 1rem/1.8 var(--f-b);direction:rtl;min-height:100%;overflow-x:hidden;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--solid)}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2.5px solid var(--ac);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--f-d);font-weight:700;line-height:1.4;margin:0;text-wrap:balance}
p{margin:0}
.wrap{max-width:1080px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 112px}
.narrow{max-width:720px}
.mut{color:var(--mut)} .dim{color:var(--dim)} .ac{color:var(--ac)}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
svg.i{width:1.25em;height:1.25em;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.24em}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

/* ---- app chrome ---- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--solid);border-bottom:1px solid var(--line)}
.top .in{max-width:1080px;margin-inline:auto;height:56px;display:flex;align-items:center;gap:14px;padding-inline:max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-left,0px))}
.logo{display:flex;align-items:center;gap:9px;font:800 1.1875rem var(--f-d)}
.logo svg{width:28px;height:28px}
.nav{display:none;gap:2px;margin-inline-start:14px}
.nav a{padding:6px 14px;border-radius:10px;color:var(--mut);font-weight:500;font-size:.9375rem}
.nav a:hover{color:var(--fg)}
.nav a.on{background:var(--glass2);color:var(--fg);font-weight:600}
.top .sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:5px;font-weight:600;font-size:.875rem;color:var(--mut)}
.pill.hot{color:var(--c4)}
.icb{width:40px;height:40px;border-radius:12px;border:0;background:transparent;display:grid;place-items:center;color:var(--mut)}
.icb:hover{background:var(--glass)}
.rp{position:fixed;inset:calc(57px + env(safe-area-inset-top,0px)) 0 auto;z-index:51;height:3px;pointer-events:none}
.nu{fill:var(--ac)}
:root[data-ch="0"] .nu,.cert .nu{fill:var(--c2)}
.rp i{display:block;height:100%;width:0;background:var(--ac)}
.dock{position:fixed;inset:auto 0 0;z-index:55;display:flex;padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px));background:var(--solid);border-top:1px solid var(--line)}
.dock a{flex:1;display:grid;justify-items:center;gap:2px;font-size:.6875rem;font-weight:500;color:var(--dim);line-height:1.5}
.dock a span.ic{width:52px;height:30px;border-radius:15px;display:grid;place-items:center}
.dock a svg{width:22px;height:22px}
.dock a.on{color:var(--fg);font-weight:700}
.dock a.on span.ic{background:var(--glass2)}
@media (min-width:900px){.nav{display:flex}.dock{display:none}.wrap{padding-bottom:64px}}

/* ---- primitives ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;border-radius:var(--r-m);font:600 1rem var(--f-b);background:var(--solid);color:var(--fg);border:1.5px solid var(--line);box-shadow:0 2px 0 var(--line);transition:transform .08s,box-shadow .08s}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:none}
.btn.pri{background:var(--ac);color:var(--ink);border-color:transparent;box-shadow:0 3px 0 color-mix(in srgb,var(--ac) 68%,#000)}
.btn.pri:active:not(:disabled){transform:translateY(3px);box-shadow:none}
.btn.sm{min-height:36px;padding:0 13px;font-size:.875rem;border-radius:10px}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.sec{margin-top:36px}
.sec>h2{font-size:1.25rem;margin-bottom:14px}
.sec>h2 small{font:400 .875rem var(--f-b);color:var(--dim);margin-inline-start:8px}
.tag{display:inline-block;font-size:.75rem;font-weight:500;line-height:1.7;padding:0 8px;border-radius:6px;background:var(--glass2);color:var(--mut);white-space:nowrap}
.tag.a{background:color-mix(in srgb,var(--ac) 13%,var(--solid));color:color-mix(in srgb,var(--ac) 82%,var(--fg))}
.tag.g{background:color-mix(in srgb,var(--gold) 16%,var(--solid));color:var(--gold);font-weight:600}
.tag.k{background:color-mix(in srgb,var(--ok) 14%,var(--solid));color:var(--ok)}
.bar{height:6px;border-radius:3px;background:var(--glass2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ac);border-radius:3px;transition:width .5s}
.glass{background:var(--solid);border:1.5px solid var(--line);border-radius:var(--r-m)}
.toast{position:fixed;inset:auto 0 calc(86px + env(safe-area-inset-bottom,0px));margin:auto;width:max-content;max-width:90vw;z-index:90;padding:10px 18px;border-radius:12px;background:var(--fg);color:var(--bg);font-weight:600;box-shadow:0 8px 28px rgba(10,12,30,.28);animation:pop .22s}
@keyframes pop{from{transform:translateY(10px);opacity:0}}
.phead{display:grid;gap:6px;margin-bottom:8px}
.phead h1{font-size:clamp(1.625rem,5.4vw,2.125rem);font-weight:800}
.phead p{color:var(--mut);max-width:62ch}
.back{display:inline-flex;align-items:center;gap:4px;font-weight:600;font-size:.9375rem;color:var(--ac)}

/* ---- specimen (chapter illustration + progress ring) ---- */
.spec{width:60px;height:60px;flex:none}
.spec.big{width:84px;height:84px}
.spec .tr{fill:none;stroke:var(--glass2);stroke-width:3.5}
.spec .pr{fill:none;stroke:var(--ac);stroke-width:3.5;stroke-linecap:round;transition:stroke-dasharray .6s}
.a-f{fill:var(--ac)} .a-w{fill:var(--solid)} .a-t{fill:color-mix(in srgb,var(--ac) 16%,var(--solid))}
.a-s{fill:none;stroke:var(--ac);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.a-s.th{stroke-width:2.2;opacity:.6}

/* ---- home ---- */
.home{display:grid;gap:28px}
@media (min-width:900px){.home{grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);align-items:start}.home>.resume{grid-column:1/-1}}
.col{display:grid;gap:28px;min-width:0}
.col>section>h2{font-size:1.125rem;margin-bottom:12px}
.resume{position:relative;overflow:hidden;border-radius:var(--r-l);background:var(--panel);padding:24px 20px;min-height:236px;display:grid;align-content:end}
.resume canvas{position:absolute;inset:0;width:100%;height:100%}
.resume::after{content:"";position:absolute;inset:0;background:linear-gradient(to left,var(--panel) 30%,color-mix(in srgb,var(--panel) 50%,transparent) 62%,transparent 92%)}
.resume .tx{position:relative;z-index:1;max-width:34rem;display:grid;gap:10px;justify-items:start}
.resume .k{font-size:.875rem;color:var(--mut)}
.resume h1{font-size:clamp(1.5rem,5.8vw,2.25rem);font-weight:800;line-height:1.4}
.resume .sub{color:var(--mut);max-width:42ch}
.resume .bar{width:min(100%,280px);background:var(--glass2)}
.resume .by{font-size:.8125rem;color:var(--dim)}
@media (min-width:900px){.resume{padding:36px 36px;min-height:280px}}
.slides{display:grid;gap:10px}
.slide{display:grid;grid-template-columns:58px minmax(0,1fr) auto;background:var(--solid);border:1.5px solid var(--line);border-radius:var(--r-m);overflow:hidden;box-shadow:0 2px 0 var(--line);transition:transform .08s,box-shadow .08s}
.slide:hover{border-color:var(--ac)}
.slide:active{transform:translateY(2px);box-shadow:none}
.slide .lab{background:var(--ac);color:var(--ink);display:grid;place-content:center;justify-items:center;font-family:var(--f-d);line-height:1.2}
.slide .lab small{font-size:.6875rem;font-weight:500;opacity:.9}
.slide .lab b{font-size:1.75rem;font-weight:800}
.slide .tx{padding:12px 14px;display:grid;align-content:center;gap:1px}
.slide h3{font-size:1.1875rem}
.slide .q{font-size:.875rem;color:var(--mut);line-height:1.65}
.slide .m{font-size:.75rem;color:var(--dim);margin-top:2px}
.slide .spec{align-self:center;margin-inline-end:12px}
.status{display:grid;grid-template-columns:repeat(3,1fr);background:var(--solid);border:1.5px solid var(--line);border-radius:var(--r-m)}
.status>div{padding:12px 14px;display:grid;gap:0;min-width:0}
.status>div+div{border-inline-start:1.5px solid var(--line)}
.status span{font-size:.75rem;color:var(--dim)}
.status b{font:700 1.125rem var(--f-d);white-space:nowrap}
.status b small{font-size:.75rem;font-weight:500;color:var(--dim)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{display:grid;gap:8px;padding:14px;background:var(--solid);border:1.5px solid var(--line);border-radius:var(--r-m);font-weight:600;line-height:1.5}
.tile:hover{border-color:var(--fg)}
.tile .ib{width:38px;height:38px;border-radius:11px;background:var(--glass2);display:grid;place-items:center}
.tile .ib svg{width:21px;height:21px}
.tile small{display:block;font-weight:400;color:var(--mut);font-size:.8125rem}
.credit{margin-top:36px;padding-top:16px;border-top:1px solid var(--line);font-size:.875rem;color:var(--dim);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.credit b{color:var(--fg)}

/* ---- chapter ---- */
.chead{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center}
.chead .k{font-size:.875rem;color:var(--mut)}
.chead h1{font-size:clamp(1.875rem,7vw,2.5rem);font-weight:800;line-height:1.25}
.chead .story{grid-column:1/-1;color:var(--mut);max-width:60ch}
.chead .prog{grid-column:1/-1;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;font-size:.8125rem;color:var(--mut)}
.path{display:grid;gap:8px}
.ln{display:grid;grid-template-columns:40px minmax(0,1fr) 20px;gap:12px;align-items:center;padding:11px 14px;background:var(--solid);border:1.5px solid var(--line);border-radius:var(--r-m)}
.ln:hover{border-color:var(--ac)}
.ln .d{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font:700 .9375rem var(--f-d);background:var(--glass);color:var(--mut)}
.ln.done .d{background:var(--ac);color:var(--ink)}
.ln.next{border-color:var(--ac);box-shadow:0 2px 0 var(--ac)}
.ln.next .d{background:color-mix(in srgb,var(--ac) 14%,var(--solid));color:var(--ac)}
.ln .t{display:block;font-weight:600;line-height:1.6}
.ln .m{display:flex;gap:12px;flex-wrap:wrap;font-size:.75rem;color:var(--dim)}
.ln .m .x{color:var(--gold);font-weight:600}
.ln>svg{color:var(--dim)}
.boss{display:grid;gap:10px;padding:18px;border-radius:var(--r-m);background:var(--solid);border:1.5px solid var(--line);justify-items:start}
.boss b{font:700 1.0625rem var(--f-d)}

/* ---- lesson ---- */
.lhead{display:grid;gap:8px;margin-bottom:22px}
.lhead .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.lhead h1{font-size:clamp(1.5rem,5.6vw,2rem);font-weight:800;line-height:1.45}
.lesson{display:grid;gap:16px;font-size:1.0625rem;line-height:1.95}
.lesson h3{font-size:1.1875rem;margin-top:14px}
.lesson h4{font:700 1.0625rem var(--f-d);margin:6px 0 0}
.lesson ul,.lesson ol{margin:0;padding-inline-start:1.35em;display:grid;gap:6px}
.lesson li::marker{color:var(--ac);font-weight:700}
.lesson b{font-weight:700}
.hook{font-size:1.1875rem;font-weight:500;line-height:1.85;color:var(--fg);padding-bottom:16px;border-bottom:1.5px solid var(--line)}
.box{padding:13px 16px;border-radius:var(--r-m);background:var(--glass);display:grid;gap:2px;font-size:1rem;line-height:1.85}
.box .lb{font:700 .8125rem var(--f-d);color:var(--bc,var(--mut));display:flex;align-items:center;gap:6px}
.box .lb svg{width:16px;height:16px}
.box.key{background:color-mix(in srgb,var(--ac) 9%,var(--solid));--bc:color-mix(in srgb,var(--ac) 85%,var(--fg))}
.box.tip{background:color-mix(in srgb,var(--ok) 9%,var(--solid));--bc:var(--ok)}
.box.warn{background:color-mix(in srgb,var(--bad) 9%,var(--solid));--bc:var(--bad)}
.box.exam{background:transparent;border:1.5px dashed color-mix(in srgb,var(--gold) 55%,var(--line));--bc:var(--gold)}
.box.iq{background:var(--glass2);border-radius:var(--r-l) 4px var(--r-l) var(--r-l);margin-inline-end:8%;--bc:var(--fg)}
.defc,.whyc,.idc{background:var(--solid);border:1.5px solid var(--line);border-radius:var(--r-m);padding:14px 16px;display:grid;gap:6px;font-size:1rem;line-height:1.85}
.defc .lb,.whyc .lb,.idc .hd{display:flex;gap:6px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.defc .nm,.whyc .nm,.idc .hd b{font:700 1.0625rem/1.6 var(--f-d)}
.whyc .an{padding-top:8px;border-top:1.5px solid var(--glass2)}
.idc{padding:0;gap:0;border-color:color-mix(in srgb,var(--ac) 45%,var(--line))}
.idc .hd{padding:11px 16px;background:color-mix(in srgb,var(--ac) 9%,var(--solid));border-radius:calc(var(--r-m) - 2px) calc(var(--r-m) - 2px) 0 0}
.idc dl{margin:0;padding:12px 16px;display:grid;gap:10px}
.idc dt{font:700 .8125rem var(--f-d);color:color-mix(in srgb,var(--ac) 85%,var(--fg))}
.idc dd{margin:0}
.tblw{overflow-x:auto;border-radius:var(--r-m);border:1.5px solid var(--line);background:var(--solid)}
.tblw table{border-collapse:collapse;width:100%;min-width:440px;font-size:.9375rem;line-height:1.75}
.tblw th{background:var(--glass);font:700 .875rem var(--f-d);text-align:start;padding:10px 13px;white-space:nowrap}
.tblw td{padding:10px 13px;border-top:1px solid var(--line);vertical-align:top}
.tblw td:first-child{font-weight:600}
.cross{border-radius:var(--r-m);border:1.5px solid var(--line);background:var(--solid);overflow:hidden;font-size:.9375rem}
.cross .ct{padding:9px 14px;font:700 .9375rem var(--f-d);background:var(--glass)}
.cross .cr{display:grid;grid-template-columns:40px 1fr 1fr;gap:8px;padding:9px 12px;border-top:1px solid var(--line);align-items:center;text-align:center}
.cross .cr .k{font:600 .875rem var(--f-m);color:var(--ac);direction:ltr}
.cross .cr .w{grid-column:2/4}
.gt{font:600 .9em var(--f-m);padding:1px .35em;border-radius:5px;background:var(--glass2);color:var(--fg);white-space:nowrap}
.gt sup{font-size:.68em}
.prob{border-radius:var(--r-m);border:1.5px solid var(--line);background:var(--solid);padding:14px 16px;display:grid;gap:10px;font-size:1rem;line-height:1.85}
.prob .q{font-weight:600}
.prob ol{counter-reset:s;list-style:none;padding:0;display:grid;gap:8px}
.prob ol li{counter-increment:s;display:grid;grid-template-columns:26px minmax(0,1fr);gap:10px;padding:9px 11px;border-radius:10px;background:var(--glass)}
.prob ol li::before{content:counter(s);width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--ac);color:var(--ink);font:700 .8125rem var(--f-d)}
.quiz{border-radius:var(--r-m);background:var(--glass);padding:14px 16px;display:grid;gap:10px;font-size:1rem;line-height:1.8}
.quiz .q{font-weight:600}
.quiz .os{display:grid;gap:8px}
.quiz .o{text-align:start;padding:10px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--solid);min-height:46px;box-shadow:0 2px 0 var(--line)}
.quiz .o:hover:not(:disabled){border-color:var(--ac)}
.quiz .o:disabled{box-shadow:none;cursor:default}
.quiz .o.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,var(--solid))}
.quiz .o.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 11%,var(--solid))}
.lbl{font:700 .8125rem var(--f-d);color:var(--mut)}
.labbox{border-radius:var(--r-l);background:var(--panel);overflow:hidden;font-size:1rem;line-height:1.8}
.labbox>.lt{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line);font:700 .9375rem var(--f-d)}
.labbox>.lt small{font:500 .75rem var(--f-b);color:var(--ac)}
.labbox>.lb{padding:16px}
.fin{margin-top:32px;padding:20px;display:grid;gap:12px;justify-items:start;background:var(--solid);border:1.5px solid var(--line);border-radius:var(--r-m)}
.fin b{font:700 1.0625rem var(--f-d)}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.pager a{display:grid;gap:0;padding:12px 14px;border:1.5px solid var(--line);border-radius:var(--r-m);background:var(--solid);min-width:0}
.pager a:hover{border-color:var(--ac)}
.pager a small{font-size:.75rem;color:var(--dim)}
.pager a span{font-weight:600;line-height:1.6;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pager a.nx{text-align:end}

/* ---- ministerial question ---- */
.mq{background:var(--solid);border:1.5px solid var(--line);border-radius:var(--r-m);padding:13px 15px;display:grid;gap:8px;line-height:1.8}
.mq .h{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.mq .h .y{font-size:.75rem;color:var(--dim);margin-inline-start:auto}
.mq .x{font-weight:600}
.mq>.a{padding:11px 13px;border-radius:10px;background:color-mix(in srgb,var(--ok) 8%,var(--solid))}
.mq>.a .none{color:var(--mut)}
.mq .f{display:flex;gap:8px;flex-wrap:wrap}
.list{display:grid;gap:10px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{white-space:nowrap;padding:7px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--solid);color:var(--mut);font-weight:500;font-size:.9375rem}
.tabs button.on{background:var(--fg);color:var(--bg);border-color:var(--fg);font-weight:600}
.inp{width:100%;padding:10px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--solid);min-height:46px}
.inp:focus{border-color:var(--ac);outline:none}
.paper{display:grid;gap:8px}
.paper .br{font:700 .9375rem var(--f-d);margin-top:14px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}

/* ---- album ---- */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px}
.card{--rc:var(--line);aspect-ratio:5/6;border-radius:var(--r-m);border:1.5px solid var(--rc);background:var(--solid);padding:11px;display:flex;flex-direction:column;justify-content:space-between;text-align:start;overflow:hidden;box-shadow:0 2px 0 var(--rc)}
.card.gold{--rc:var(--gold)} .card.silver{--rc:var(--silver)} .card.bronze{--rc:var(--bronze)}
.card .r{font:700 .6875rem var(--f-d);color:var(--rc);display:flex;align-items:center;gap:5px}
.card:not(.gold):not(.silver):not(.bronze) .r{color:var(--dim)}
.card .r::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.card .nm{font:700 .9375rem/1.55 var(--f-d)}
.card .fc{font-size:.6875rem;color:var(--dim);line-height:1.5}
.card.locked{background:var(--glass);box-shadow:none;--rc:var(--line)}
.card.locked .nm{color:transparent;background:var(--glass2);border-radius:6px}
.modal{position:fixed;inset:0;z-index:80;background:rgba(8,10,22,.6);display:grid;place-items:center;padding:16px}
.modal .mc{width:min(540px,100%);max-height:86vh;overflow:auto;border-radius:var(--r-l);background:var(--solid);padding:20px;display:grid;gap:12px;box-shadow:0 20px 60px rgba(8,10,22,.35)}
.modal h2{font-size:1.25rem}

/* ---- labs ---- */
.labs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:10px}
.labc{padding:14px;display:grid;grid-template-columns:38px minmax(0,1fr);gap:4px 12px;align-items:start;border-radius:var(--r-m);border:1.5px solid var(--line);background:var(--solid)}
.labc:hover{border-color:var(--ac)}
.labc .ib{grid-row:1/3;width:38px;height:38px;border-radius:11px;background:var(--ac);color:var(--ink);display:grid;place-items:center}
.labc .ib svg{width:20px;height:20px}
.labc b{font:700 1rem/1.5 var(--f-d)} .labc small{color:var(--mut);line-height:1.6;font-size:.8125rem;grid-column:2}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.ctl label{font-size:.875rem;color:var(--mut);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ctl select,.ctl input[type=text]{padding:7px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--solid);min-height:40px;max-width:100%}
input[type=range]{accent-color:var(--ac);width:100%}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:11px;overflow:hidden;background:var(--solid)}
.seg button{padding:6px 13px;background:transparent;border:0;color:var(--mut);min-height:38px;font-weight:500}
.seg button.on{background:var(--ac);color:var(--ink);font-weight:700}
.pn{display:grid;gap:5px;direction:ltr;overflow-x:auto;padding-bottom:4px}
.pn .c{min-width:54px;min-height:50px;border-radius:10px;display:grid;place-items:center;padding:4px 6px;background:var(--glass2);font:600 .9rem var(--f-m);text-align:center;line-height:1.3;border:1.5px solid transparent}
.pn .c small{display:block;font:500 .6875rem var(--f-b);direction:rtl}
.pn .c.g{background:transparent;border-color:var(--ac);border-radius:50px}
.pn .c.hd{background:transparent;color:var(--dim);font-size:.8rem}
.pn .c.dead{opacity:.45;text-decoration:line-through}
.res{display:grid;gap:6px;margin-top:14px}
.res .rw{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:7px 12px;border-radius:10px;background:var(--glass)}
.res .rw i{font-style:normal;width:13px;height:13px;border-radius:50%;display:inline-block;margin-inline-end:8px;vertical-align:-1px;border:1px solid var(--line)}
.stage{position:relative;width:100%;border-radius:var(--r-m);overflow:hidden;background:var(--stage);border:1px solid var(--line)}
.stage canvas{display:block;width:100%;height:auto;touch-action:none}
.stage .hint{position:absolute;inset:auto 8px 8px auto;font-size:.6875rem;color:#C3C9E0;background:rgba(10,12,22,.72);padding:1px 9px;border-radius:6px}
.info{margin-top:10px;padding:12px 14px;border-radius:12px;background:var(--glass);min-height:64px;line-height:1.85}
.info b{font-weight:700;color:var(--fg)}
.legend{font-size:.75rem;color:var(--dim);margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chipb{padding:5px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--solid);font-size:.875rem;min-height:36px}
.chipb.on{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 16%,var(--solid))}
.chipb.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,var(--solid))} .chipb.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--solid))}
.seq{font:600 1rem var(--f-m);direction:ltr;text-align:left;letter-spacing:.08em;word-break:break-all;line-height:2}
.seq span{display:inline-block;padding:0 .12em;border-radius:5px}
.seq .A{color:var(--c3)} .seq .T,.seq .U{color:var(--c2)} .seq .C{color:var(--c1)} .seq .G{color:var(--c4)}
.seq .ch{background:color-mix(in srgb,var(--bad) 30%,transparent)}
.sl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;align-items:center;padding:9px 12px;border-radius:12px;background:var(--glass);margin-top:8px}
.sl .k{font:600 .8125rem var(--f-b);color:var(--mut)}

/* ---- profile + certificate ---- */
.form{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.form label{display:grid;gap:4px;font-size:.875rem;color:var(--mut)}
.cert{position:relative;padding:30px 22px;text-align:center;background:var(--solid);border:2px solid var(--fg);border-radius:6px;outline:1px solid var(--fg);outline-offset:-8px;display:grid;gap:4px;justify-items:center}
.cert .wm{font:800 1.0625rem var(--f-d);display:flex;gap:8px;align-items:center}
.cert .wm svg{width:24px;height:24px}
.cert .nm{font:800 1.625rem/1.5 var(--f-d)}
.cert .sc{font:800 3.25rem/1.1 var(--f-d);color:var(--ac)}
.cert .sc small{font-size:.35em;color:var(--dim)}
.cert .ln2{width:120px;height:1.5px;background:var(--fg);margin:6px 0}
.cert .seal{margin-top:10px;width:76px;height:76px;color:var(--gold)}

/* timeline strip (ch4 lab) */
.tl{display:flex;gap:8px;overflow-x:auto;max-width:100%;padding:2px 2px 10px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
.tl-i{flex:0 0 auto;display:grid;gap:1px;justify-items:start;padding:8px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--solid);color:var(--fg);min-width:88px;text-align:start;scroll-snap-align:start}
.tl-i .num{font-size:.72rem;color:var(--dim)}
.tl-i.on{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 18%,var(--solid))}
.lt{white-space:nowrap;font-size:.86em;font-weight:500;opacity:.8}
.nw{white-space:nowrap}
/* ===== smart exam ===== */
.ax-note{display:flex;gap:8px;align-items:center;padding:10px 14px;border-radius:12px;background:color-mix(in srgb,var(--c4) 12%,var(--solid));color:var(--c4);font-weight:600;margin-top:14px}
.ax-chs{display:flex;flex-wrap:wrap;gap:8px}
.ax-ch{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px 0 16px;border-radius:12px;border:1.5px solid var(--line);background:var(--solid);font-weight:600;color:var(--fg)}
.ax-ch .num{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;background:var(--glass2);font-size:.8125rem}
.ax-ch.on{border-color:var(--cc,var(--ac));background:color-mix(in srgb,var(--cc,var(--ac)) 10%,var(--solid))}
.ax-ch.on .num{background:var(--cc,var(--ac));color:#fff}
.ax-ch[data-c="1"]{--cc:var(--c1)}.ax-ch[data-c="2"]{--cc:var(--c2)}.ax-ch[data-c="3"]{--cc:var(--c3)}.ax-ch[data-c="4"]{--cc:var(--c4)}.ax-ch[data-c="5"]{--cc:var(--c5)}
.ax-ch.all{border-style:dashed}
.ax-len{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.ax-op{display:grid;gap:2px;text-align:start;padding:12px 14px;border-radius:var(--r-m);border:1.5px solid var(--line);background:var(--solid);color:var(--fg)}
.ax-op small{color:var(--mut);font-size:.8125rem}
.ax-op.on{border-color:var(--ac);box-shadow:inset 0 0 0 1px var(--ac)}
.ax-go{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:24px}
.ax-go .btn{min-width:220px}
.ax-hist{display:grid;gap:8px}
.ax-h{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:6px 12px;align-items:center;padding:12px 14px;background:var(--solid);border:1.5px solid var(--line);border-radius:var(--r-m)}
.ax-h b{display:block;line-height:1.5}.ax-h small{color:var(--mut);font-size:.8125rem}
.ax-h .row{grid-column:1/-1}
.ax-sc{font:800 1.375rem var(--f-d)}.ax-sc small{font-size:.8125rem;color:var(--mut)}
.ax-load{min-height:60vh;display:grid;place-content:center;justify-items:center;text-align:center;gap:10px;padding:24px 0}
.ax-load h1{font-size:clamp(1.375rem,5vw,1.75rem)}
.ax-orb{position:relative;width:84px;height:84px;margin-bottom:8px}
.ax-orb i{position:absolute;inset:0;border-radius:50%;border:3px solid transparent;border-top-color:var(--c5);animation:ax-spin 1.4s linear infinite}
.ax-orb i:nth-child(2){inset:12px;border-top-color:var(--c1);animation-duration:1.9s;animation-direction:reverse}
.ax-orb i:nth-child(3){inset:26px;border-top-color:var(--c2);animation-duration:1.1s}
@keyframes ax-spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.ax-orb i{animation-duration:6s}}
.ax-tm{font-size:.9375rem!important;padding:2px 10px!important}.ax-tm.bad{color:var(--bad)}
.ax-paper{gap:10px}
.ax-q{display:grid;gap:10px;padding-top:6px}
.ax-q>h2{font:800 1.25rem var(--f-d);margin-top:10px}
.ax-it{display:grid;gap:8px;padding:12px 14px;background:var(--solid);border:1.5px solid var(--line);border-radius:var(--r-m)}
.ax-x{line-height:1.8;font-weight:500}.ax-x .num{font-weight:700;color:var(--mut)}
.ax-ta{min-height:56px;resize:vertical;line-height:1.8;font:inherit}
.ax-opts{display:grid;gap:6px}
.ax-o{display:flex;gap:10px;align-items:center;padding:8px 12px;border-radius:10px;border:1.5px solid var(--line);cursor:pointer}
.ax-o:has(input:checked){border-color:var(--ac);background:color-mix(in srgb,var(--ac) 8%,var(--solid))}
.ax-o input{accent-color:var(--ac);width:18px;height:18px}
.ax-photo p{margin:6px 0 12px}
.ax-thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center}
.ax-thumbs img{width:84px;height:110px;object-fit:cover;border-radius:10px;border:1.5px solid var(--line)}
.ax-res{display:grid;justify-items:center;text-align:center;gap:8px;padding:24px 0 8px;position:relative}
.ax-ring{width:168px;height:168px;transform:rotate(-90deg)}
.ax-ring circle{fill:none;stroke:var(--glass2);stroke-width:9}
.ax-ring .v{stroke:var(--c5);stroke-linecap:round;transition:stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1)}
.ax-big{position:absolute;top:24px;height:168px;display:grid;place-content:center;justify-items:center}
.ax-big b{font:800 2.75rem/1 var(--f-d)}.ax-big span{color:var(--mut);font-size:.875rem}
.ax-res h1{font-size:1.75rem;margin-top:4px}
.ax-tip{max-width:52ch;padding:10px 14px;border-radius:12px;background:var(--glass2);line-height:1.8}
.ax-it.r{border-inline-start-width:5px}
.ax-it.r.ok{border-inline-start-color:var(--ok)}.ax-it.r.mid{border-inline-start-color:var(--c4)}.ax-it.r.no{border-inline-start-color:var(--bad)}
.ax-rh{display:flex;justify-content:space-between;gap:10px;align-items:start}
.ax-pt{font:800 1.125rem var(--f-d);white-space:nowrap}.ax-pt small{color:var(--mut);font-size:.75rem}
.ax-you{display:grid;gap:2px;padding:8px 12px;border-radius:10px;background:var(--glass2);line-height:1.8;white-space:pre-wrap}
.ax-you span{font-size:.75rem;color:var(--mut);font-weight:600}.ax-you i{color:var(--mut)}
.ax-nt{font-weight:600;line-height:1.7}
.ax-miss{display:flex;flex-wrap:wrap;gap:6px}
.ax-model summary{cursor:pointer;font-weight:600;color:var(--ac);min-height:36px;display:flex;align-items:center}
.ax-model>div{line-height:1.9;margin:6px 0 10px}
.ax-whyb{margin-top:10px;padding:10px 12px;border-radius:10px;background:color-mix(in srgb,var(--c5) 8%,var(--solid));line-height:1.9;display:grid;gap:6px}
.ax-fix b{color:var(--c5)}
.ax-cm{width:min(720px,100%)}
.ax-lab{display:grid;gap:6px;font-weight:600}
.ax-cimg{width:100%;border-radius:12px;box-shadow:0 10px 30px rgba(8,10,22,.3)}
.ax-cbtns .btn{flex:1 1 140px}
.cert-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
/* ===== daily study ===== */
.ring circle{fill:none;stroke:var(--glass2);stroke-width:9}
.ring .v{stroke:var(--c5);stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dashoffset .8s cubic-bezier(.2,.8,.2,1)}
.ring.g .v{stroke:var(--c3)}
.today{display:grid;gap:12px}
.td-grid{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;gap:10px;align-items:stretch}
.td-goal{grid-row:span 2;display:grid;justify-items:center;align-content:center;gap:4px;padding:12px 14px;background:var(--solid);border:1.5px solid var(--line);border-radius:var(--r-m);position:relative;color:var(--fg)}
.td-rw{position:relative;display:grid;place-items:center}
.td-rw b{position:absolute;font:800 1.25rem/1 var(--f-d)}.td-rw b small{font-size:.75rem;color:var(--mut)}
.td-goal>span:last-child{font-size:.8125rem;color:var(--mut);white-space:nowrap}
.td-s{display:flex;gap:10px;align-items:center;padding:10px 12px;background:var(--solid);border:1.5px solid var(--line);border-radius:var(--r-m);color:var(--fg)}
.td-s .ib{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--glass2);flex:none}
.td-s b{display:block;font:800 1.125rem/1.3 var(--f-d)}.td-s span{font-size:.8125rem;color:var(--mut)}
.td-tasks{display:grid;gap:6px}
.td-t{display:grid;grid-template-columns:22px minmax(0,1fr) 18px;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--glass2);color:var(--fg);font-weight:500}
.td-t.ok{opacity:.6}.td-t.ok span{text-decoration:line-through}
.rv-bar{display:grid;grid-template-columns:repeat(3,1fr);background:var(--solid);border:1.5px solid var(--line);border-radius:var(--r-m);margin-top:12px}
.rv-bar>div{padding:12px;text-align:center;display:grid;gap:2px}.rv-bar>div+div{border-inline-start:1.5px solid var(--line)}
.rv-bar b{font:800 1.5rem var(--f-d)}.rv-bar span{font-size:.8125rem;color:var(--mut)}
.tag.bad{background:color-mix(in srgb,var(--bad) 14%,var(--solid));color:var(--bad);font-weight:600}
.pl-form{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.pl-form label{display:grid;gap:6px;font-weight:600;font-size:.9375rem}
.pl-days{display:grid;gap:8px;margin-top:14px}
.pl-d{display:grid;gap:4px;padding:12px 14px;background:var(--solid);border:1.5px solid var(--line);border-radius:var(--r-m)}
.pl-d a{color:var(--ac);font-weight:500}
.mp-key{display:flex;flex-wrap:wrap;gap:14px;margin-top:10px;font-size:.875rem;color:var(--mut)}
.mp-key i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-inline-end:6px;vertical-align:-1px}
.mp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:6px}
.mp-t{aspect-ratio:1;border-radius:12px;display:grid;place-content:center;text-align:center;gap:0;font-weight:700;border:1.5px solid transparent}
.mp-t small{font-size:.6875rem;font-weight:500;opacity:.85}
.mp-t.g,.mp-key i.g{background:color-mix(in srgb,var(--c3) 22%,var(--solid));color:var(--c3)}
.mp-t.y,.mp-key i.y{background:color-mix(in srgb,var(--c4) 22%,var(--solid));color:var(--c4)}
.mp-t.r,.mp-key i.r{background:color-mix(in srgb,var(--bad) 20%,var(--solid));color:var(--bad)}
.mp-t.n,.mp-key i.n{background:var(--glass2);color:var(--mut);border-color:var(--line)}
.fo{position:relative;display:grid;place-items:center;margin:18px auto 14px;width:min(260px,72vw)}
.fo-ring{width:100%;height:auto}
.fo-ring circle{fill:none;stroke:var(--glass2);stroke-width:12}
.fo-ring .v{stroke:var(--c5);stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dashoffset 1s linear}
.fo-ring.b .v{stroke:var(--c3)}
.fo-in{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.fo-in span{color:var(--mut);font-weight:600}.fo-in b{font:800 3rem/1.1 var(--f-d)}
.fo-week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:150px;padding:10px;background:var(--solid);border:1.5px solid var(--line);border-radius:var(--r-m)}
.fo-week>div{display:grid;grid-template-rows:1fr auto auto;height:100%;align-items:end;justify-items:center;gap:2px}
.fo-week i{width:70%;min-height:3px;border-radius:6px 6px 2px 2px;background:var(--c5)}
.fo-week b{font-size:.75rem}.fo-week span{font-size:.6875rem;color:var(--mut)}
.pc{width:100%;max-width:520px;height:auto;background:var(--solid);border:1.5px solid var(--line);border-radius:var(--r-m)}
.pc .g{stroke:var(--line);stroke-dasharray:4 4;fill:none}.pc .l{stroke:var(--c5);stroke-width:3;fill:none;stroke-linejoin:round;stroke-linecap:round}
.pc circle{fill:var(--c5)}.pc text{font:700 12px var(--f-b);fill:var(--fg)}.pc text.s{font-weight:500;fill:var(--mut);font-size:10px}
.bd-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.bd{display:grid;gap:4px;justify-items:start;text-align:start;padding:12px;border-radius:var(--r-m);border:1.5px dashed var(--line);background:transparent;color:var(--mut)}
.bd .bd-i{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--glass2)}
.bd b{font-size:.9375rem;color:var(--fg);opacity:.6}.bd small{font-size:.75rem;line-height:1.5}
.bd.on{border-style:solid;border-color:color-mix(in srgb,var(--gold) 45%,var(--line));background:color-mix(in srgb,var(--gold) 8%,var(--solid))}
.bd.on .bd-i{background:var(--gold);color:#fff}.bd.on b{opacity:1}
/* instagram card */
.ig-sec{margin-top:44px}
.ig2{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:16px;border-radius:20px;background:linear-gradient(var(--solid),var(--solid)) padding-box,linear-gradient(120deg,var(--c5),var(--c1) 55%,var(--c2)) border-box;border:2px solid transparent;color:var(--fg);text-decoration:none;box-shadow:0 10px 30px color-mix(in srgb,var(--c5) 14%,transparent)}
.ig2-av{width:56px;height:56px;border-radius:50%;padding:3px;background:conic-gradient(from 200deg,var(--c5),var(--c1),var(--c2),var(--c5))}
.ig2-av span{width:100%;height:100%;border-radius:50%;display:grid;place-items:center;background:var(--solid);font:800 1.375rem var(--f-d);color:var(--c5)}
.ig2-tx{display:grid;gap:0;min-width:0}
.ig2-tx small{font-size:.75rem;color:var(--mut);font-weight:600}
.ig2-tx b{font:800 1.1875rem/1.4 var(--f-d)}
.ig2-h{font:600 .9375rem var(--f-m);color:var(--c5);text-align:end;justify-self:start}
.ig2-btn{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:999px;background:var(--fg);color:var(--bg);font-weight:700;font-size:.9375rem;white-space:nowrap}
.ig2-btn svg{width:18px;height:18px}
.ig2-note{margin-top:10px;font-size:.875rem;color:var(--mut);text-align:center}
@media (max-width:380px){.ig2{grid-template-columns:auto minmax(0,1fr)}.ig2-btn{grid-column:1/-1;justify-content:center}}
@media (min-width:900px){.home{grid-auto-flow:dense}.home>.chc{grid-column:1;grid-row:span 2}.home>.tdc,.home>.tlc{grid-column:2}.home>.lgc,.home>.ann{grid-column:1/-1}}

/* ===== announcement + home question ===== */
.ann{display:flex;gap:10px;align-items:flex-start;padding:12px 16px;border-radius:var(--r-m);background:color-mix(in srgb,var(--c5) 10%,var(--solid));border:1.5px solid color-mix(in srgb,var(--c5) 30%,var(--line));font-weight:600;line-height:1.7}
.ann svg{width:20px;height:20px;flex:none;margin-top:3px;color:var(--c5)}
.hq-h{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.hq-h .btn svg{width:16px;height:16px}

/* ===== تحدي الأسبوع ===== */
.lg-card{position:relative;padding:20px;border-radius:var(--r-l);background:var(--solid);border:1.5px solid var(--line);overflow:hidden}
.lg-card::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:linear-gradient(90deg,var(--gold),var(--c5),var(--c1))}
.lg-hd{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
.lg-hd .k{font-size:.8125rem;color:var(--dim);font-weight:600;margin:0}
.lg-hd h2{font-size:1.3125rem}
.lg-end{flex:none;font-size:.8125rem;font-weight:600;padding:3px 10px;border-radius:999px;background:color-mix(in srgb,var(--gold) 15%,var(--solid));color:var(--gold);white-space:nowrap}
.lg-body{display:grid;gap:16px}
@media (min-width:760px){.lg-body{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);align-items:start}}
.lg-list{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.lg-r{display:grid;grid-template-columns:34px minmax(0,1fr) auto;align-items:center;gap:10px;padding:8px 12px 8px 10px;border-radius:12px;background:var(--glass)}
.lg-n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:800 .9375rem var(--f-d);background:var(--glass2);color:var(--mut)}
.lg-r.gold .lg-n{background:color-mix(in srgb,var(--gold) 22%,var(--solid));color:var(--gold)}
.lg-r.silver .lg-n{background:color-mix(in srgb,var(--silver) 22%,var(--solid));color:var(--silver)}
.lg-r.bronze .lg-n{background:color-mix(in srgb,var(--bronze) 22%,var(--solid));color:var(--bronze)}
.lg-r.gold{background:color-mix(in srgb,var(--gold) 8%,var(--glass))}
.lg-r.me{box-shadow:inset 0 0 0 2px var(--c5);background:color-mix(in srgb,var(--c5) 10%,var(--solid))}
.lg-nm{display:grid;min-width:0;line-height:1.45}
.lg-nm b{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lg-nm small,.lg-sc small{font-size:.75rem;color:var(--dim)}
.lg-sc{display:grid;justify-items:end;line-height:1.35}
.lg-sc b{font:800 1.0625rem var(--f-d)}
.lg-sc b small{font-weight:500}
.lg-r.sk{height:46px;background:linear-gradient(90deg,var(--glass) 0%,var(--glass2) 50%,var(--glass) 100%);background-size:200% 100%;animation:sk 1.2s linear infinite}
@keyframes sk{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.lg-r.sk{animation:none}}
.lg-empty{padding:12px;border-radius:12px;background:var(--glass);color:var(--mut);font-size:.9375rem}
.lg-gap{text-align:center;color:var(--dim);line-height:1}
.lg-side{display:grid;gap:12px;align-content:start}
.lg-me{margin:0;color:var(--mut);font-size:.9375rem}
.lg-me b{color:var(--fg)}
.lg-champ{margin:0;font-size:.875rem;color:var(--mut);line-height:1.8}
.lg-champ svg{width:16px;height:16px;color:var(--gold);vertical-align:-3px;margin-inline-end:4px}
.lg-best{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-top:16px;padding:14px 16px;border-radius:var(--r-m);background:color-mix(in srgb,var(--gold) 10%,var(--solid));border:1.5px solid color-mix(in srgb,var(--gold) 30%,var(--line))}
.lg-best b{font:800 1.5rem var(--f-d)}
.lg-best small{color:var(--dim)}
.lg-run{display:grid;gap:18px;padding-top:8px}
.lg-bar{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;font-weight:600;color:var(--mut)}
.lg-t{font:800 1.25rem var(--f-d);color:var(--fg);min-width:3.2em;text-align:center}
.lg-t.low{color:var(--bad)}
.lg-q{display:grid;gap:10px;justify-items:start}
.lg-q p{margin:0;font:700 1.25rem/1.7 var(--f-d)}
.lg-os{display:grid;gap:10px}
.lg-o{min-height:58px;padding:12px 16px;border-radius:var(--r-m);border:1.5px solid var(--line);background:var(--solid);color:var(--fg);font:500 1.0625rem var(--f-b);text-align:start;box-shadow:0 2px 0 var(--line)}
.lg-o:hover:not(:disabled){border-color:var(--ac)}
.lg-o.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--solid))}
.lg-o.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--solid))}
.lg-o:disabled{cursor:default}
.lg-quit{justify-self:start;margin-top:6px}
.lg-res{text-align:center;display:grid;gap:8px;justify-items:center;padding-top:16px}
.lg-res .k{margin:0;font:700 1.125rem var(--f-d);color:var(--gold)}
.lg-big{font:800 4.5rem/1 var(--f-d)}
.lg-big small{font-size:1.5rem;color:var(--dim)}
.lg-rank{min-height:1.6em;margin:0;font-weight:600}
.lg-rank b{font:800 1.25rem var(--f-d);color:var(--c5)}
.lg-wr{display:grid;gap:10px}
.lg-w{display:grid;gap:6px;padding:14px;border-radius:var(--r-m);background:var(--solid);border:1.5px solid var(--line)}
.lg-w p{margin:0;font-weight:600}
.lg-w .ok,.lg-w .no{display:flex;gap:6px;align-items:flex-start;font-size:.9375rem}
.lg-w .ok{color:var(--ok)} .lg-w .no{color:var(--bad)}
.lg-w svg{width:16px;height:16px;flex:none;margin-top:5px}
.lg-w a{font-size:.875rem;justify-self:start}
.lg-hof+.lg-hof{margin-top:22px}
.lg-hof h3{font-size:1rem;margin-bottom:10px;color:var(--mut)}

/* ===== أسئلة الكتاب ===== */
.bq-hub{display:grid;gap:10px;margin-top:18px}
.bq-ch{display:grid;grid-template-columns:44px 1fr;align-items:center;gap:12px;padding:14px;border-radius:var(--r-m);background:var(--solid);border:1.5px solid var(--line)}
.bq-ch:hover{border-color:var(--ac)}
.bq-ch>.num{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font:800 1.125rem var(--f-d);background:color-mix(in srgb,var(--ac) 14%,var(--solid));color:var(--ac)}
.bq-ch b{display:block;font-weight:700}
.bq-ch small{color:var(--mut);font-size:.8125rem}
.bq-list{display:grid;gap:12px}
.bq-it{display:grid;gap:10px;padding:16px;border-radius:var(--r-m);background:var(--solid);border:1.5px solid var(--line);border-inline-start-width:4px}
.bq-it[data-res="1"]{border-inline-start-color:var(--ok)}
.bq-it[data-res="0"]{border-inline-start-color:var(--bad)}
.bq-h{display:flex;align-items:center;gap:8px}
.bq-i{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--glass2);font:700 .8125rem var(--f-d);color:var(--mut)}
.bq-q{font-weight:600;line-height:1.85}
.bq-os{display:grid;gap:8px}
.bq-o{min-height:46px;padding:8px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--fg);font:500 1rem var(--f-b);text-align:start}
.bq-o.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--solid))}
.bq-o.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--solid))}
.bq-a{display:grid;gap:10px}
.bq-ans,.bq-iq{padding:12px 14px;border-radius:12px}
.bq-ans{background:var(--glass)}
.bq-iq{background:color-mix(in srgb,var(--c3) 11%,var(--solid));border:1.5px dashed color-mix(in srgb,var(--c3) 40%,var(--line))}
.bq-ans p,.bq-iq p{margin:0;line-height:1.9}
.bq-ans p+p{margin-top:6px}
.bq-lb{display:block;font:700 .75rem var(--f-d);color:var(--dim);margin-bottom:4px}
.bq-iq .bq-lb{color:var(--c3)}
.bq-me{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:.875rem;color:var(--mut)}
.bq-show{justify-self:start}

/* ===== وين واصل ===== */
.sc-opts{display:grid;gap:10px;margin-top:18px}
@media (min-width:640px){.sc-opts{grid-template-columns:repeat(3,1fr)}}
.sc-op{display:grid;gap:4px;padding:14px;text-align:start;border-radius:var(--r-m);border:1.5px solid var(--line);background:var(--solid);color:var(--fg);font:inherit}
.sc-op b{font:700 1rem var(--f-d)}
.sc-op small{color:var(--mut);font-size:.8125rem;line-height:1.6}
.sc-op.on{border-color:var(--c5);box-shadow:inset 0 0 0 1px var(--c5);background:color-mix(in srgb,var(--c5) 8%,var(--solid))}
.sc-ls{display:grid;gap:6px;margin-top:14px}
.sc-l{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--solid);color:var(--fg);font:500 .9375rem var(--f-b);text-align:start}
.sc-l .num{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--glass2);font-weight:700;font-size:.8125rem}
.sc-l small{display:block;color:var(--dim);font-size:.75rem}
.sc-l.on{border-color:var(--c5);background:color-mix(in srgb,var(--c5) 10%,var(--solid))}
.sc-l.on .num{background:var(--c5);color:#fff}
.sc-note{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:14px 0 0;padding:10px 14px;border-radius:12px;background:var(--glass);font-size:.875rem;color:var(--mut)}
.sc-note.on{background:color-mix(in srgb,var(--c5) 9%,var(--solid));color:var(--fg)}
.sc-note svg{width:16px;height:16px;color:var(--c5);flex:none}
.lnk{background:none;border:0;padding:0;font:inherit;color:var(--c5);font-weight:600;text-decoration:underline;text-underline-offset:3px}

/* ===== badges fold ===== */
.bd-det>summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-radius:var(--r-m);background:var(--solid);border:1.5px solid var(--line);cursor:pointer}
.bd-det>summary::-webkit-details-marker{display:none}
.bd-det>summary h2{font-size:1.125rem;margin:0}
.bd-det>summary h2 small{font:400 .875rem var(--f-b);color:var(--dim);margin-inline-start:8px}
.bd-tg{display:flex;align-items:center;gap:6px;font-size:.875rem;font-weight:600;color:var(--mut)}
.bd-tg svg{width:18px;height:18px;transition:transform .2s}
.bd-det[open] .bd-tg svg{transform:rotate(-90deg)}
.bd-c,.bd-det[open] .bd-o{display:none}
.bd-det[open] .bd-c{display:inline}
.bd-det[open]>.bd-grid{margin-top:12px}

/* ===== admin settings ===== */
.adm-cfg{margin:16px 0;padding:12px 16px;border-radius:var(--r-m);border:1.5px solid var(--line);background:var(--solid)}
.adm-cfg>summary{cursor:pointer;font-weight:700}
.adm-cfgb{display:grid;gap:12px;margin-top:12px}
.adm-cfgb label{display:grid;gap:6px;font-weight:600;font-size:.9375rem}
.adm-cfgb .btn{justify-self:start}
.bq-a[hidden],.bq-show[hidden],.bq-it[hidden],.bq-sec[hidden],.lg-champ[hidden],.lg-wd[hidden]{display:none}
.lg-wd>summary{cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-radius:var(--r-m);background:var(--solid);border:1.5px solid var(--line);font:700 1.0625rem var(--f-d)}
.lg-wd>summary::-webkit-details-marker{display:none}
.lg-wd>summary small{font:500 .875rem var(--f-b);color:var(--dim)}
.lg-wd[open]>summary{margin-bottom:12px}

/* ===== گروب الدرس ===== */
.ch-card{display:grid;grid-template-columns:44px 1fr 20px;align-items:center;gap:12px;margin-top:16px;padding:12px 14px;border-radius:var(--r-m);background:color-mix(in srgb,var(--ok) 9%,var(--solid));border:1.5px solid color-mix(in srgb,var(--ok) 32%,var(--line))}
.ch-card b{display:block;font-weight:700}
.ch-card small{display:block;color:var(--mut);font-size:.8125rem;line-height:1.6}
.ch-card>svg{width:18px;height:18px;color:var(--mut)}
.ch-gav{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--ok);color:#fff;flex:none}
.ch-gav svg{width:22px;height:22px}
.ch-wrap{padding-top:0}
.ch-app{display:grid;grid-template-rows:auto 1fr auto;min-height:calc(100vh - 140px)}
.ch-top{position:sticky;top:calc(57px + env(safe-area-inset-top,0px));z-index:5;display:flex;align-items:center;gap:10px;padding:10px 0;background:var(--bg);border-bottom:1px solid var(--line)}
.ch-gt{display:grid;min-width:0;line-height:1.4}
.ch-gt b{font:700 1.0625rem var(--f-d)}
.ch-gt small{color:var(--dim);font-size:.75rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch-body{display:grid;gap:4px;align-content:start;padding:16px 4px 24px;background-image:radial-gradient(color-mix(in srgb,var(--line) 70%,transparent) 1px,transparent 1px);background-size:18px 18px}
.ch-m,.ch-typ{display:grid;grid-template-columns:32px minmax(0,1fr);gap:8px;align-items:end;max-width:min(88%,560px);margin-top:8px}
.ch-m.cont{margin-top:0}
.ch-av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font:700 .875rem var(--f-d);color:#fff;background:var(--mc)}
.ch-m.cont .ch-av{visibility:hidden}
.ch-bb{justify-self:start;padding:8px 12px;border-radius:16px 16px 16px 4px;background:var(--solid);border:1px solid var(--line);box-shadow:0 1px 0 var(--line)}
.ch-m.cont .ch-bb{border-radius:16px 4px 16px 4px}
.ch-n{display:block;font:700 .8125rem var(--f-d);color:var(--mc)}
.ch-bb p{margin:0;line-height:1.75}
.ch-me{justify-self:end;max-width:min(80%,520px);margin-top:10px}
.ch-me .ch-bb{background:color-mix(in srgb,var(--ok) 16%,var(--solid));border-color:color-mix(in srgb,var(--ok) 30%,var(--line));border-radius:16px 16px 4px 16px}
.ch-sys{justify-self:center;margin:10px 0;padding:3px 12px;border-radius:999px;background:var(--glass2);color:var(--mut);font-size:.8125rem;text-align:center}
.ch-dots{display:inline-flex;gap:4px;padding:12px 14px;border-radius:16px 16px 16px 4px;background:var(--solid);border:1px solid var(--line);justify-self:start}
.ch-dots i{width:7px;height:7px;border-radius:50%;background:var(--dim);animation:chd 1s infinite}
.ch-dots i:nth-child(2){animation-delay:.15s}.ch-dots i:nth-child(3){animation-delay:.3s}
@keyframes chd{0%,60%,100%{opacity:.3;transform:none}30%{opacity:1;transform:translateY(-3px)}}
@media (prefers-reduced-motion:reduce){.ch-dots i{animation:none;opacity:.6}}
.ch-poll{justify-self:center;width:min(100%,460px);margin:14px 0 4px;padding:14px;border-radius:var(--r-m);background:var(--solid);border:1.5px solid var(--line);display:grid;gap:10px}
.ch-pl{display:flex;align-items:center;gap:6px;font:700 .75rem var(--f-d);color:var(--c5)}
.ch-pl svg{width:15px;height:15px}
.ch-po{display:grid;gap:8px}
.ch-o{min-height:44px;padding:8px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--fg);font:500 .9375rem var(--f-b);text-align:start}
.ch-poll.live .ch-o:hover{border-color:var(--c5)}
.ch-o.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--solid))}
.ch-o.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--solid))}
.ch-fin{justify-self:center;display:grid;gap:12px;justify-items:center;text-align:center;margin-top:16px;padding:18px;border-radius:var(--r-m);background:var(--solid);border:1.5px solid var(--line)}
.ch-fin b{font:700 1.0625rem var(--f-d)}
.ch-ft{position:sticky;bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:5;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;background:linear-gradient(transparent,var(--bg) 30%)}
.ch-ft .btn svg{width:18px;height:18px}
@media (min-width:900px){.ch-ft{bottom:12px}}
.ch-ft [hidden]{display:none}
.ch-empty{display:grid;gap:12px;justify-items:center;text-align:center;padding:40px 8px}
.ch-big{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--ok);color:#fff}
.ch-big svg{width:30px;height:30px}

/* ===== علّم حمودي ===== */
.lx-cards{display:grid;gap:10px;margin:16px 0 10px}
@media (min-width:700px){.lx-cards{grid-template-columns:1fr 1fr}.lx-cards>:last-child:nth-child(odd){grid-column:1/-1}}
.lx-cards .ch-card{margin-top:0}
.tb-card{background:color-mix(in srgb,var(--c4) 9%,var(--solid));border-color:color-mix(in srgb,var(--c4) 32%,var(--line))}
.tb-av{background:var(--c4);font:800 1.125rem var(--f-d)}
.tb-cs{display:grid;gap:8px}
@media (min-width:640px){.tb-cs{grid-template-columns:1fr 1fr}}
.tb-c{display:grid;gap:2px;padding:12px 14px;text-align:start;border-radius:var(--r-m);border:1.5px solid var(--line);background:var(--solid);color:var(--fg);font:inherit}
.tb-c:hover:not(:disabled){border-color:var(--c4)}
.tb-c b{font-weight:700}
.tb-c small{color:var(--dim);font-size:.8125rem}
.tb-c.on{border-color:color-mix(in srgb,var(--ok) 50%,var(--line))}
.tb-ft{position:sticky;bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:5;display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end;padding:10px 0;background:var(--bg)}
@media (min-width:900px){.tb-ft{bottom:12px}}
.tb-ft[hidden]{display:none}
.tb-ft .inp{min-height:72px;resize:vertical}
.tb-res{justify-self:center;width:min(100%,520px);display:grid;gap:12px;justify-items:center;text-align:center;margin-top:16px;padding:20px;border-radius:var(--r-l);background:var(--solid);border:1.5px solid var(--line)}
.tb-sc{display:flex;align-items:baseline;gap:2px}
.tb-sc b{font:800 3.25rem/1 var(--f-d);color:var(--c4)}
.tb-sc small{font:600 1.125rem var(--f-d);color:var(--dim)}
.tb-res>b{font:700 1.125rem var(--f-d)}
.tb-l{justify-self:stretch;text-align:start;padding:10px 14px;border-radius:12px}
.tb-l span{display:flex;align-items:center;gap:6px;font:700 .875rem var(--f-d)}
.tb-l svg{width:16px;height:16px}
.tb-l ul{margin:6px 0 0;padding-inline-start:20px}
.tb-l.ok{background:color-mix(in srgb,var(--ok) 10%,var(--solid))}.tb-l.ok span{color:var(--ok)}
.tb-l.no{background:color-mix(in srgb,var(--bad) 9%,var(--solid))}.tb-l.no span{color:var(--bad)}
.tb-tip{margin:0;display:flex;gap:8px;align-items:flex-start;text-align:start;font-weight:600}
.tb-tip svg{width:18px;height:18px;flex:none;margin-top:4px;color:var(--gold)}
.tb-ref{justify-self:stretch;text-align:start;padding:10px 14px;border-radius:12px;background:var(--glass)}
.tb-ref summary{cursor:pointer;font-weight:700}
.tb-ref p{margin:6px 0 0}

/* ===== كلمات الدرجة ===== */
mark.kw{background:color-mix(in srgb,var(--gold) 20%,transparent);color:inherit;border-radius:4px;padding:0 2px;box-shadow:inset 0 -2px 0 color-mix(in srgb,var(--gold) 55%,transparent)}
mark.kw mark.kw{background:none;box-shadow:none;padding:0}
.kw-w{display:grid;gap:10px;margin:10px 0;padding:12px;border-radius:12px;background:var(--glass)}
.kw-lab{display:grid;gap:6px;font-weight:600;font-size:.9375rem}
.kw-in{min-height:84px;resize:vertical;background:var(--solid)}
.kw-mine p{margin:0;white-space:pre-wrap}
.kw-res{display:grid;gap:10px}
.kw-hd{display:flex;align-items:center;gap:12px}
.kw-hd b{font:800 1.75rem var(--f-d)}
.kw-hd b small{font-size:1rem;color:var(--dim)}
.kw-hd span{font-weight:600}
.kw-chips{display:flex;flex-wrap:wrap;gap:6px}
.kw-c{display:inline-flex;align-items:center;gap:4px;padding:2px 10px 2px 8px;border-radius:999px;font-size:.875rem;font-weight:600}
.kw-c svg{width:14px;height:14px}
.kw-c.ok{background:color-mix(in srgb,var(--ok) 14%,var(--solid));color:var(--ok)}
.kw-c.no{background:color-mix(in srgb,var(--bad) 12%,var(--solid));color:var(--bad)}
.kw-note{margin:0;font-size:.8125rem;color:var(--mut)}
.bq-f{gap:8px}
.mq .f [hidden],.bq-f [hidden]{display:none}

/* ===== ارسم وأنا أصحح ===== */
.dr-list{display:grid;gap:8px;margin-top:18px}
.dr-it{display:grid;grid-template-columns:40px 1fr 18px;gap:12px;align-items:center;padding:12px 14px;border-radius:var(--r-m);background:var(--solid);border:1.5px solid var(--line)}
.dr-it:hover{border-color:var(--ac)}
.dr-it b{display:block;font-weight:600;line-height:1.6}
.dr-it small{color:var(--dim);font-size:.8125rem}
.dr-it>svg{width:18px;height:18px;color:var(--mut)}
.dr-ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--ac) 13%,var(--solid));color:var(--ac)}
.dr-ic svg{width:20px;height:20px}
.dr-hint{margin-top:14px;padding:10px 14px;border-radius:12px;background:var(--glass)}
.dr-hint summary{cursor:pointer;font-weight:600;display:flex;align-items:center;gap:6px}
.dr-hint summary svg{width:16px;height:16px;color:var(--gold)}
.dr-hint .kw-chips{margin-top:10px}
.dr-hint .kw-c{background:var(--solid);color:var(--fg);border:1px solid var(--line)}
.dr-tools{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.dr-t{display:inline-flex;align-items:center;gap:5px;min-height:38px;padding:0 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--solid);color:var(--fg);font:600 .875rem var(--f-b);cursor:pointer}
.dr-t svg{width:16px;height:16px}
.dr-t.on{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 12%,var(--solid))}
.dr-tools.photo .dr-t:not(.dr-up){opacity:.55}
.dr-pad{position:relative;margin-top:10px;border-radius:var(--r-m);overflow:hidden;border:1.5px solid var(--line);background:#fff}
.dr-pad canvas{display:block;width:100%;aspect-ratio:1;touch-action:none;cursor:crosshair}
.dr-pad canvas[hidden],.dr-pad img[hidden],.dr-ti[hidden]{display:none}
.dr-pad img{display:block;width:100%}
.dr-ti{position:absolute;width:min(70%,260px);z-index:2;background:#fff;color:#1b1f3b}
.dr-res{margin-top:20px}

/* ===== بحياتك ===== */
.life{position:relative;display:grid;gap:6px;margin-top:28px;padding:16px 18px 16px 16px;border-radius:var(--r-m);background:color-mix(in srgb,var(--c3) 8%,var(--solid));border:1.5px solid color-mix(in srgb,var(--c3) 28%,var(--line));border-inline-start-width:5px;border-inline-start-color:var(--c3)}
.life-k{display:flex;align-items:center;gap:6px;font:700 .75rem var(--f-d);color:var(--c3)}
.life-k svg{width:15px;height:15px}
.life b{font:700 1.0625rem var(--f-d)}
.life p{margin:0;line-height:1.9}

/* ===== اشرحلي على كيفي ===== */
.ex-card-l{background:color-mix(in srgb,var(--gold) 9%,var(--solid));border-color:color-mix(in srgb,var(--gold) 32%,var(--line))}
.ex-av{background:var(--gold)}
.ex-modes{display:grid;gap:8px;margin-top:16px}
@media (min-width:640px){.ex-modes{grid-template-columns:repeat(3,1fr)}}
.ex-card{display:grid;gap:12px;margin-top:22px;padding:20px;border-radius:var(--r-l);background:var(--solid);border:1.5px solid var(--line)}
.ex-card h2{font-size:1.25rem}
.ex-card>p{margin:0;line-height:1.95}
.ex-pairs{display:grid;gap:6px}
.ex-pairs>div{display:grid;grid-template-columns:1fr 22px 1fr;gap:8px;align-items:center;padding:8px 12px;border-radius:10px;background:var(--glass)}
.ex-pairs>div>span:first-child{font-weight:700}
.ex-pairs i{display:grid;place-items:center;color:var(--dim)}
.ex-pairs svg{width:16px;height:16px}
.ex-steps{margin:0;padding-inline-start:22px;display:grid;gap:4px}
.ex-cau{margin:0;display:flex;gap:8px;align-items:flex-start;padding:10px 12px;border-radius:10px;background:color-mix(in srgb,var(--gold) 10%,var(--solid));font-size:.9375rem}
.ex-cau svg{width:16px;height:16px;flex:none;margin-top:5px;color:var(--gold)}
.ex-q{margin-top:6px}
.ex-why{margin:8px 0 0;font-weight:600}
.ex-why[hidden]{display:none}

.lx-sh{display:none}
@media (max-width:699px){
  .lx-cards{grid-template-columns:repeat(3,1fr);gap:8px}
  .lx-cards .ch-card{grid-template-columns:1fr;justify-items:center;text-align:center;gap:6px;padding:12px 6px}
  .lx-cards .ch-card>svg,.lx-cards .lx-ln{display:none}
  .lx-cards .lx-sh{display:block;font:700 .8125rem/1.4 var(--f-d);font-style:normal}
  .lx-cards .ch-gav{width:40px;height:40px}
}

/* ===== رتّبها ===== */
.ord-picked{list-style:none;margin:0;padding:0;display:grid;gap:8px;counter-reset:none}
.ord-i{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--solid);border:1.5px solid var(--line);cursor:pointer}
.ord-i .num{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:color-mix(in srgb,var(--ac) 14%,var(--solid));color:var(--ac);font-weight:800}
.ord-i small{grid-column:2;color:var(--bad);font-weight:600;font-size:.8125rem}
.ord-i.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,var(--solid));cursor:default}
.ord-i.ok .num{background:var(--ok);color:#fff}
.ord-i.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 8%,var(--solid));cursor:default}
.ord-i.no .num{background:var(--bad);color:#fff}
.ord-empty{padding:14px;border-radius:12px;border:1.5px dashed var(--line);color:var(--dim);text-align:center}
.ord-pool{display:grid;gap:8px}
.ord-b{padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--fg);font:500 .9375rem/1.7 var(--f-b);text-align:start;box-shadow:0 2px 0 var(--line)}
.ord-b:hover{border-color:var(--ac)}
.ord-res{margin-top:14px;font:700 1.0625rem var(--f-d)}
.ord-ban{display:grid;gap:8px;margin-top:24px}
.ord-l{display:grid;grid-template-columns:22px 1fr 18px;gap:10px;align-items:center;padding:12px 14px;border-radius:12px;background:color-mix(in srgb,var(--ac) 8%,var(--solid));border:1.5px dashed color-mix(in srgb,var(--ac) 40%,var(--line));font-weight:600}
.ord-l svg{width:18px;height:18px;color:var(--ac)}

/* ===== ستوري الدرس ===== */
.st-tag{border:0;cursor:pointer;display:inline-flex;align-items:center;gap:4px;background:var(--fg);color:var(--bg);font-weight:600}
.st-tag svg{width:12px;height:12px}
body.st-on{overflow:hidden}
.st{position:fixed;inset:0;z-index:95;display:grid;grid-template-rows:auto auto 1fr;color:#fff;background:radial-gradient(120% 80% at 80% 0%,color-mix(in srgb,var(--ac) 70%,#0b0e1a) 0%,#0b0e1a 70%);padding:calc(10px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));--ac:var(--c5)}
.st[data-c="1"]{--ac:#2f6fe0}.st[data-c="2"]{--ac:#c92b6b}.st[data-c="3"]{--ac:#16824a}.st[data-c="4"]{--ac:#b8500f}.st[data-c="5"]{--ac:#6540d9}
.st-bars{display:flex;gap:4px;max-width:520px;width:100%;margin:0 auto}
.st-bars i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.28);overflow:hidden}
.st-bars i b{display:block;height:100%;width:0;background:#fff}
.st-bars i.done b{width:100%!important;transition:none!important}
.st-top{display:flex;align-items:center;gap:10px;max-width:520px;width:100%;margin:12px auto 0}
.st-top span:nth-child(2){display:grid;line-height:1.35;flex:1}
.st-top b{font:700 .9375rem var(--f-d)} .st-top small{opacity:.7;font-size:.75rem}
.st-av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--ac);font:800 1rem var(--f-d);box-shadow:0 0 0 2px #fff}
.st-x{width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.12);color:#fff;display:grid;place-items:center;position:relative;z-index:3}
.st-x svg{width:20px;height:20px}
.st-body{position:relative;z-index:2;align-self:center;max-width:520px;width:100%;margin:0 auto;display:grid;gap:14px;pointer-events:none}
.st-body .st-q,.st-body .st-end{pointer-events:auto}
.st-k{margin:0;display:flex;align-items:center;gap:6px;font:700 .875rem var(--f-d);color:color-mix(in srgb,var(--ac) 40%,#fff);letter-spacing:0}
.st-k svg{width:16px;height:16px}
.st-h{font:800 clamp(1.75rem,7vw,2.5rem)/1.35 var(--f-d);color:#fff}
.st-h.sm{font-size:clamp(1.375rem,5.5vw,1.875rem)}
.st-x2{margin:0;font-size:clamp(1.0625rem,4.4vw,1.3125rem);line-height:1.9;color:rgba(255,255,255,.92)}
.st-x2 .gt,.st-x2 .lt{color:#fff}
.st-tip{margin:12px 0 0;font-size:.8125rem;opacity:.6}
.st-q{display:grid;gap:10px}
.st-o{min-height:52px;padding:10px 16px;border-radius:14px;border:1.5px solid rgba(255,255,255,.35);background:rgba(255,255,255,.1);color:#fff;font:600 1.0625rem var(--f-b);text-align:start}
.st-o.ok{background:#1f9d5c;border-color:#1f9d5c}.st-o.no{background:#c43a50;border-color:#c43a50}
.st-end{display:grid;gap:14px;justify-items:center;text-align:center}
.st-done{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:#1f9d5c}
.st-done svg{width:32px;height:32px}
.st-btns{display:grid;gap:10px;width:100%;max-width:320px}
.st-btns .btn{width:100%}
.st-nav{position:absolute;top:110px;bottom:0;width:50%;border:0;background:transparent;z-index:1;cursor:pointer}
.st-nav.next{left:0}.st-nav.prev{right:0}

/* ===== اكتشف الغلط + اسأل الأستاذ ===== */
.px-sec .ord-ban{margin-top:0}
.sp{display:grid;gap:8px;margin-top:16px}
.sp-s{display:grid;gap:6px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--solid);color:var(--fg);font:500 1rem/1.85 var(--f-b);text-align:start;cursor:pointer}
.sp-s.on{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 12%,var(--solid))}
.sp-s.hit{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,var(--solid))}
.sp-s.miss{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 8%,var(--solid))}
.sp-s.false{border-color:var(--bad);border-style:dashed}
.sp-s:disabled{cursor:default;opacity:1}
.sp-fix{display:flex;gap:6px;align-items:flex-start;font-weight:600;color:var(--ok);font-size:.9375rem}
.sp-fix svg{width:16px;height:16px;flex:none;margin-top:5px}
.aq-av{background:var(--c1)}
.aq-ft{grid-template-columns:1fr auto}
.aq-modes{grid-column:1/-1;display:flex;gap:6px}

/* ===== فيديو الأستاذ + توقّع ===== */
.reel{display:grid;grid-template-columns:44px 1fr 18px;gap:12px;align-items:center;margin-bottom:12px;padding:12px 14px;border-radius:var(--r-m);background:var(--fg);color:var(--bg)}
.reel b{display:block}.reel small{display:block;opacity:.75;font-size:.8125rem}
.reel>svg{width:18px;height:18px}
.reel-p{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#f58529,#dd2a7b 50%,#8134af)}
.reel-p svg{width:20px;height:20px;color:#fff}
.reel-adm{display:grid;gap:8px;margin-bottom:12px;padding:12px;border-radius:12px;border:1.5px dashed var(--line);font-size:.875rem}
.reel-adm label{display:grid;gap:6px;font-weight:600}
.reel-adm .btn{justify-self:start}
.poe{display:grid;gap:10px;padding:14px;border-radius:12px;background:rgba(255,255,255,.06);border:1.5px dashed color-mix(in srgb,var(--gold) 55%,transparent);color:var(--fg)}
.poe-x{margin-top:12px}
.poe-k{display:flex;align-items:center;gap:6px;font:700 .8125rem var(--f-d);color:var(--gold)}
.poe-k svg{width:16px;height:16px}
.poe .inp{background:var(--solid);color:var(--fg)}
/* ===== شبكة الكتاب ===== */
.wb{margin-top:16px;border-radius:var(--r-l);background:var(--solid);border:1.5px solid var(--line);overflow:auto;-webkit-overflow-scrolling:touch}
.wb svg{display:block;width:100%;min-width:760px;height:auto}
.wb-l{fill:none;stroke:var(--line);stroke-width:1.4;opacity:.8}
.wb-l.on{stroke:var(--gold);stroke-width:2.4;opacity:1}
.wb-s{stroke:var(--line);stroke-width:2}
.wb-s.on{stroke:var(--ac);stroke-width:3}
.wb-h circle{fill:var(--ac);opacity:.14;stroke:var(--ac);stroke-width:2}
.wb-h text{font:700 15px var(--f-d);fill:var(--ac);text-anchor:middle}
.wb-n circle{fill:var(--glass2);stroke:var(--line);stroke-width:2}
.wb-n text{font:700 13px var(--f-d);fill:var(--dim);text-anchor:middle;pointer-events:none}
.wb-n.on circle{fill:var(--ac);stroke:color-mix(in srgb,var(--ac) 60%,#fff)}
.wb-n.on text{fill:#fff}
.wb-n:hover circle,.wb-n:focus circle{stroke:var(--fg);stroke-width:3}
.wb-list{display:grid;gap:8px}
.wb-r{display:grid;grid-template-columns:1fr 24px 1fr;gap:8px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--solid);border:1.5px solid var(--line);font-size:.875rem;font-weight:600;line-height:1.6}
.wb-r small{display:block;color:var(--ac);font-weight:700;font-size:.75rem}
.wb-r span svg{width:18px;height:18px;color:var(--dim)}

/* ===== access gate: night stage with a turning helix ===== */
body.gated{overflow:hidden}
body.gated header.top,body.gated #dock,body.gated #app{visibility:hidden}
.gate{--g-ink:#EEF0FA;--g-mut:#A7ADC8;--g-dim:#6F7594;--g-line:rgba(201,184,255,.16);--g-glass:rgba(16,19,38,.62);
  position:fixed;inset:0;z-index:200;color:var(--g-ink);background:radial-gradient(120% 80% at 70% 0%,#1B1640 0%,rgba(27,22,64,0) 60%),radial-gradient(90% 70% at 10% 100%,#0E2A3A 0%,rgba(14,42,58,0) 55%),#080A14;
  display:grid;grid-template-rows:1fr auto;overflow-y:auto;overflow-x:hidden}
.gate[hidden],.gate [hidden]{display:none!important}
#g-cv{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
.g-veil{position:fixed;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(8,10,20,0) 0%,rgba(8,10,20,.35) 38%,rgba(8,10,20,.88) 62%,#080A14 100%)}
.g-main{position:relative;display:flex;align-items:flex-end;justify-content:center;padding:24px 16px 8px;min-height:100%}
.g-main.solo{align-items:center}
.g-by{position:relative;text-align:center;font-size:.8125rem;color:var(--g-dim);padding:10px 16px 18px}
.gate h1{font:800 clamp(1.75rem,7vw,2.125rem)/1.3 var(--f-d);color:var(--g-ink)}
.g-mark{width:56px;height:56px;color:var(--g-ink)}
.g-mark .nu{fill:#B79CFF;transform-origin:17px 12px;animation:g-nu 2.4s ease-in-out infinite}
@keyframes g-nu{50%{transform:scale(.8)}}
/* login */
.g-hero{width:100%;max-width:420px;display:grid;gap:18px;padding-bottom:4px}
.g-brand{display:flex;align-items:center;gap:14px}
.g-brand .g-mark{width:52px;height:52px;flex:none}
.g-brand h1{font-size:clamp(2.5rem,12vw,3.5rem);line-height:1.3;padding-bottom:.06em;letter-spacing:-.01em;background:linear-gradient(100deg,#FFFFFF 10%,#D9CCFF 55%,#9FD8FF 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.g-brand p{font:600 1rem var(--f-b);color:#B79CFF;margin-top:4px}
.g-lead{font-size:1.0625rem;line-height:1.85;color:var(--g-mut);max-width:36ch}
.g-q{margin:0;padding:14px 16px 12px;border:1px solid var(--g-line);border-radius:18px;background:var(--g-glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);display:grid;gap:6px;transition:opacity .38s,transform .38s}
.g-q.out{opacity:.0;transform:translateY(6px)}
.g-q figcaption{display:flex;align-items:center;gap:8px;font-size:.8125rem;color:var(--g-dim)}
.g-q .tg{padding:1px 10px;border-radius:999px;background:rgba(183,156,255,.16);color:#CDB9FF;font-weight:700}
.g-q blockquote{margin:0;font:700 1.1875rem/1.7 var(--f-d);color:var(--g-ink);min-height:3.4em}
.g-dots{display:flex;gap:5px}
.g-dots i{width:16px;height:3px;border-radius:2px;background:rgba(255,255,255,.14);transition:background .3s,width .3s}
.g-dots i.on{width:26px;background:#B79CFF}
.g-q.out .g-dots{opacity:1}
.g-cta{display:grid;gap:10px;justify-items:center}
.g-gbtn{width:100%;min-height:44px;display:flex;justify-content:center;color-scheme:light}
.g-note{font-size:.875rem;color:var(--g-dim);text-align:center}
.g-in{opacity:0;transform:translateY(14px);animation:g-in .7s cubic-bezier(.2,.8,.2,1) var(--d,0ms) forwards}
@keyframes g-in{to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.g-in{animation:none;opacity:1;transform:none}.g-mark .nu{animation:none}.g-q{transition:none}}
@media (min-width:900px){
  .g-veil{background:linear-gradient(90deg,rgba(8,10,20,0) 30%,rgba(8,10,20,.75) 58%,#080A14 85%)}
  .g-main{align-items:center;justify-content:flex-start;padding:48px max(6vw,48px)}
  .g-main.solo{justify-content:center}
  .g-main.solo .g-card{margin-inline-start:0}
  .g-hero{max-width:440px;gap:22px}
}
/* other gate screens */
.g-card{width:100%;max-width:400px;display:grid;gap:14px;justify-items:center;text-align:center;padding:28px 20px;border:1px solid var(--g-line);border-radius:24px;background:var(--g-glass);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.g-card.center{padding:32px 20px}
.g-sub{color:var(--g-mut);max-width:34ch;line-height:1.8}
.g-wait{color:var(--g-mut);font-weight:600}
.g-btn{width:100%;min-height:52px;display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:0 18px;border-radius:999px;font:600 1rem var(--f-b);background:rgba(255,255,255,.06);color:var(--g-ink);border:1px solid var(--g-line);text-decoration:none;cursor:pointer;transition:transform .08s,background .15s}
.g-btn:active:not(:disabled){transform:scale(.98)}
.g-btn.pri{background:#EEF0FA;color:#0B0D1A;border-color:transparent}
.g-btn.google{background:#fff;color:#1f1f1f;border-color:#dadce0;max-width:360px}
.g-btn:disabled{opacity:.55}
.g-err{color:#FF9DB4;font-weight:600;font-size:.9375rem;text-align:center}
.g-steps{text-align:start;display:grid;gap:6px;padding-inline-start:20px;color:var(--g-mut)}
.g-lock{width:46px;height:46px;color:#FFB36B}
.g-acc{width:100%;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;text-align:start;padding:14px 16px;border:1px solid var(--g-line);border-radius:16px;background:rgba(255,255,255,.04)}
.g-acc span{display:block;font-size:.75rem;color:var(--g-dim)}
.g-acc b{display:block;font-weight:700;line-height:1.5}
.g-acc small{display:block;color:var(--g-mut);font-size:.8125rem;overflow-wrap:anywhere}
.g-code{text-align:center;padding-inline-start:12px;border-inline-start:1px dashed var(--g-line)}
.g-code b{font:700 1.25rem var(--f-m);letter-spacing:.08em}
.g-row{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;margin-top:2px}
.g-link{background:none;border:0;color:var(--g-mut);font:600 .9375rem var(--f-b);text-decoration:underline;text-underline-offset:3px;min-height:40px;cursor:pointer}
.g-toast{position:fixed;inset-inline:16px;bottom:88px;margin:auto;max-width:360px;padding:12px 16px;border-radius:12px;background:var(--c0);color:var(--bg);font-weight:600;text-align:center;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none;z-index:300}
.g-toast.on{opacity:1;transform:none}
/* header chip */
.pill.acc{padding:3px 10px;border-radius:999px;border:1.5px solid var(--line);font-size:.8125rem;color:var(--fg);text-decoration:none;white-space:nowrap}
@media (max-width:420px){.pill.acc{font-size:.75rem;padding:2px 8px}}
/* account block in ملفي */
.acc-row{display:flex;gap:12px;align-items:center}
.acc-row img{width:48px;height:48px;border-radius:50%}
.acc-row b{display:block}
.acc-row small{display:block;color:var(--mut);overflow-wrap:anywhere}
.st{display:inline-block;margin-top:4px;padding:2px 9px;border-radius:999px;font-size:.75rem;font-weight:700;background:var(--glass2);color:var(--mut)}
.st.trial{background:color-mix(in srgb,var(--c1) 14%,var(--solid));color:var(--c1)}
.st.paid,.st.admin{background:color-mix(in srgb,var(--c3) 16%,var(--solid));color:var(--c3)}
.st.wait{background:color-mix(in srgb,var(--c4) 16%,var(--solid));color:var(--c4)}
.st.blocked{background:color-mix(in srgb,var(--bad) 16%,var(--solid));color:var(--bad)}
/* admin */
.adm-bar{display:grid;gap:10px;margin:18px 0 14px}
.adm-bar .chips{display:flex;gap:8px;flex-wrap:wrap}
.adm-list{display:grid;gap:10px}
.adm-u{border:1.5px solid var(--line);border-radius:var(--r-m);background:var(--solid);padding:12px 14px;display:grid;gap:10px}
.adm-h{display:grid;grid-template-columns:40px 1fr;gap:4px 12px;align-items:start}
.adm-h img,.adm-h .ph{width:40px;height:40px;border-radius:50%;background:var(--glass2);grid-row:span 2}
.adm-id{display:grid;min-width:0}
.adm-id b{line-height:1.5}
.adm-id small{color:var(--mut);font-size:.8125rem;overflow-wrap:anywhere}
.adm-h .st{grid-column:2;justify-self:start}
.adm-warn{font-size:.8125rem;color:var(--c4);background:color-mix(in srgb,var(--c4) 10%,var(--solid));padding:6px 10px;border-radius:8px}
.adm-a{display:flex;gap:8px;flex-wrap:wrap}
.btn.warn{color:var(--bad)}
.g-price{width:100%;display:flex;align-items:baseline;justify-content:space-between;padding:12px 16px;border-radius:16px;background:linear-gradient(100deg,rgba(183,156,255,.18),rgba(111,210,255,.12));border:1px solid rgba(183,156,255,.35)}
.g-price span{color:var(--g-mut);font-weight:600}
.g-price b{font:800 1.375rem var(--f-d);color:#fff}
.acc-note{margin-top:10px;font-size:.875rem;color:var(--mut)}
.ig-card{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1.5px solid var(--line);border-radius:var(--r-m);background:var(--solid);color:var(--fg);text-decoration:none}
.ig-card .ig-ic{width:42px;height:42px;flex:none;display:grid;place-items:center;border-radius:12px;background:var(--glass2);color:var(--fg)}
.ig-card .ig-ic svg{width:24px;height:24px}
.ig-card small{display:block;color:var(--mut);font-size:.8125rem}
.ig-card b{display:block;font-size:1.0625rem;text-align:start}
/* public certificate check */
.vf{gap:10px}
.vf-ok{width:54px;height:54px;color:#7FE0A8}
.vf-k{font-weight:700;color:#7FE0A8}
.vf h1{font-size:clamp(1.5rem,6vw,2rem)}
.vf-sc{display:flex;align-items:baseline;gap:8px;justify-content:center;padding:10px 18px;border-radius:16px;background:rgba(255,255,255,.05);border:1px solid var(--g-line)}
.vf-sc b{font:800 2.25rem var(--f-d);color:#fff}
.vf-sc span{color:var(--g-mut)}
