<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta property="og:title" content="بايوڤيرس: أحياء السادس العلمي">
<meta property="og:description" content="الكتاب كله درس درس، مختبرات تفاعلية، وأسئلة الوزاري 2021–2025 مع أجوبتها.">
<title>بايوڤيرس BioVerse</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="منصة دراسة تفاعلية لكتاب علم الأحياء للصف السادس العلمي — إعداد: مؤمن العبيدي">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;700;800&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">

<style>
/* BioVerse design system
   Layout: reading is paper (light, quiet, start-aligned, one column); experimenting is an instrument screen (.dk dark panels).
   Colour is information: every chapter owns one microscope-stain hue (--c1..--c5) and --ac always means "the chapter you are in".
   Global screens use ink (--c0). Signature element: chapter cards built as labelled microscope slides.
   Radius by role: 8 controls-in-controls, 14 cards and buttons, 20 panels. No decorative shadows; buttons have a pressed edge. */
:root{
  --bg:#F4F5F9; --bg2:#ECEEF4; --solid:#FFFFFF; --glass:#F0F1F6; --glass2:#E5E7F0; --line:#D9DCE8;
  --fg:#161A33; --mut:#50556E; --dim:#8086A0;
  --c0:#161A33; --c1:#1D62D8; --c2:#C92B6B; --c3:#16824A; --c4:#B8500F; --c5:#6540D9;
  --ac:var(--c0); --ink:#FFFFFF;
  --ok:#14804A; --bad:#D22F4A; --gold:#946500; --silver:#5F6884; --bronze:#A0582A;
  --panel:#12152A; --stage:#0A0C16;
  --f-d:'Alexandria','IBM Plex Sans Arabic',system-ui,sans-serif;
  --f-b:'IBM Plex Sans Arabic','Segoe UI',Tahoma,system-ui,sans-serif;
  --f-m:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --r-s:8px; --r-m:14px; --r-l:20px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]):not(.t-light){
    --bg:#0E1018; --bg2:#090B11; --solid:#171A26; --glass:#1C2030; --glass2:#262B3F; --line:#2F354B;
    --fg:#ECEEF6; --mut:#A7ADC4; --dim:#727993;
    --c0:#ECEEF6; --c1:#6CA6FF; --c2:#FF7AA8; --c3:#4FD494; --c4:#FFA05C; --c5:#A990FF;
    --ink:#0E1018; --ok:#4FD494; --bad:#FF7088; --gold:#F2C14E; --silver:#C4CBE0; --bronze:#E3A06D;
    --panel:#171A26; color-scheme:dark;
  }
}
:root[data-theme="dark"]:not(.t-light), :root.t-dark, .dk{
  --bg:#0E1018; --bg2:#090B11; --solid:#171A26; --glass:#1C2030; --glass2:#262B3F; --line:#2F354B;
  --fg:#ECEEF6; --mut:#A7ADC4; --dim:#727993;
  --c0:#ECEEF6; --c1:#6CA6FF; --c2:#FF7AA8; --c3:#4FD494; --c4:#FFA05C; --c5:#A990FF;
  --ink:#0E1018; --ok:#4FD494; --bad:#FF7088; --gold:#F2C14E; --silver:#C4CBE0; --bronze:#E3A06D;
  color-scheme:dark;
}
:root[data-theme="dark"]:not(.t-light), :root.t-dark{--panel:#171A26}
.dk{--ac:var(--c0);color:var(--fg)}
[data-c="1"],:root[data-ch="1"],:root[data-ch="1"] .dk{--ac:var(--c1)}
[data-c="2"],:root[data-ch="2"],:root[data-ch="2"] .dk{--ac:var(--c2)}
[data-c="3"],:root[data-ch="3"],:root[data-ch="3"] .dk{--ac:var(--c3)}
[data-c="4"],:root[data-ch="4"],:root[data-ch="4"] .dk{--ac:var(--c4)}
[data-c="5"],:root[data-ch="5"],:root[data-ch="5"] .dk{--ac:var(--c5)}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:400 1rem/1.8 var(--f-b);direction:rtl;min-height:100%;overflow-x:hidden;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--solid)}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2.5px solid var(--ac);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--f-d);font-weight:700;line-height:1.4;margin:0;text-wrap:balance}
p{margin:0}
.wrap{max-width:1080px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 112px}
.narrow{max-width:720px}
.mut{color:var(--mut)} .dim{color:var(--dim)} .ac{color:var(--ac)}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
svg.i{width:1.25em;height:1.25em;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.24em}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

/* ---- app chrome ---- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--solid);border-bottom:1px solid var(--line)}
.top .in{max-width:1080px;margin-inline:auto;height:56px;display:flex;align-items:center;gap:14px;padding-inline:max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-left,0px))}
.logo{display:flex;align-items:center;gap:9px;font:800 1.1875rem var(--f-d)}
.logo svg{width:28px;height:28px}
.nav{display:none;gap:2px;margin-inline-start:14px}
.nav a{padding:6px 14px;border-radius:10px;color:var(--mut);font-weight:500;font-size:.9375rem}
.nav a:hover{color:var(--fg)}
.nav a.on{background:var(--glass2);color:var(--fg);font-weight:600}
.top .sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:5px;font-weight:600;font-size:.875rem;color:var(--mut)}
.pill.hot{color:var(--c4)}
.icb{width:40px;height:40px;border-radius:12px;border:0;background:transparent;display:grid;place-items:center;color:var(--mut)}
.icb:hover{background:var(--glass)}
.rp{position:fixed;inset:calc(57px + env(safe-area-inset-top,0px)) 0 auto;z-index:51;height:3px;pointer-events:none}
.nu{fill:var(--ac)}
:root[data-ch="0"] .nu,.cert .nu{fill:var(--c2)}
.rp i{display:block;height:100%;width:0;background:var(--ac)}
.dock{position:fixed;inset:auto 0 0;z-index:55;display:flex;padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px));background:var(--solid);border-top:1px solid var(--line)}
.dock a{flex:1;display:grid;justify-items:center;gap:2px;font-size:.6875rem;font-weight:500;color:var(--dim);line-height:1.5}
.dock a span.ic{width:52px;height:30px;border-radius:15px;display:grid;place-items:center}
.dock a svg{width:22px;height:22px}
.dock a.on{color:var(--fg);font-weight:700}
.dock a.on span.ic{background:var(--glass2)}
@media (min-width:900px){.nav{display:flex}.dock{display:none}.wrap{padding-bottom:64px}}

/* ---- primitives ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;border-radius:var(--r-m);font:600 1rem var(--f-b);background:var(--solid);color:var(--fg);border:1.5px solid var(--line);box-shadow:0 2px 0 var(--line);transition:transform .08s,box-shadow .08s}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:none}
.btn.pri{background:var(--ac);color:var(--ink);border-color:transparent;box-shadow:0 3px 0 color-mix(in srgb,var(--ac) 68%,#000)}
.btn.pri:active:not(:disabled){transform:translateY(3px);box-shadow:none}
.btn.sm{min-height:36px;padding:0 13px;font-size:.875rem;border-radius:10px}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.sec{margin-top:36px}
.sec>h2{font-size:1.25rem;margin-bottom:14px}
.sec>h2 small{font:400 .875rem var(--f-b);color:var(--dim);margin-inline-start:8px}
.tag{display:inline-block;font-size:.75rem;font-weight:500;line-height:1.7;padding:0 8px;border-radius:6px;background:var(--glass2);color:var(--mut);white-space:nowrap}
.tag.a{background:color-mix(in srgb,var(--ac) 13%,var(--solid));color:color-mix(in srgb,var(--ac) 82%,var(--fg))}
.tag.g{background:color-mix(in srgb,var(--gold) 16%,var(--solid));color:var(--gold);font-weight:600}
.tag.k{background:color-mix(in srgb,var(--ok) 14%,var(--solid));color:var(--ok)}
.bar{height:6px;border-radius:3px;background:var(--glass2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ac);border-radius:3px;transition:width .5s}
.glass{background:var(--solid);border:1.5px solid var(--line);border-radius:var(--r-m)}
.toast{position:fixed;inset:auto 0 calc(86px + env(safe-area-inset-bottom,0px));margin:auto;width:max-content;max-width:90vw;z-index:90;padding:10px 18px;border-radius:12px;background:var(--fg);color:var(--bg);font-weight:600;box-shadow:0 8px 28px rgba(10,12,30,.28);animation:pop .22s}
@keyframes pop{from{transform:translateY(10px);opacity:0}}
.phead{display:grid;gap:6px;margin-bottom:8px}
.phead h1{font-size:clamp(1.625rem,5.4vw,2.125rem);font-weight:800}
.phead p{color:var(--mut);max-width:62ch}
.back{display:inline-flex;align-items:center;gap:4px;font-weight:600;font-size:.9375rem;color:var(--ac)}

/* ---- specimen (chapter illustration + progress ring) ---- */
.spec{width:60px;height:60px;flex:none}
.spec.big{width:84px;height:84px}
.spec .tr{fill:none;stroke:var(--glass2);stroke-width:3.5}
.spec .pr{fill:none;stroke:var(--ac);stroke-width:3.5;stroke-linecap:round;transition:stroke-dasharray .6s}
.a-f{fill:var(--ac)} .a-w{fill:var(--solid)} .a-t{fill:color-mix(in srgb,var(--ac) 16%,var(--solid))}
.a-s{fill:none;stroke:var(--ac);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.a-s.th{stroke-width:2.2;opacity:.6}

/* ---- home ---- */
.home{display:grid;gap:28px}
@media (min-width:900px){.home{grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);align-items:start}.home>.resume{grid-column:1/-1}}
.col{display:grid;gap:28px;min-width:0}
.col>section>h2{font-size:1.125rem;margin-bottom:12px}
.resume{position:relative;overflow:hidden;border-radius:var(--r-l);background:var(--panel);padding:24px 20px;min-height:236px;display:grid;align-content:end}
.resume canvas{position:absolute;inset:0;width:100%;height:100%}
.resume::after{content:"";position:absolute;inset:0;background:linear-gradient(to left,var(--panel) 30%,color-mix(in srgb,var(--panel) 50%,transparent) 62%,transparent 92%)}
.resume .tx{position:relative;z-index:1;max-width:34rem;display:grid;gap:10px;justify-items:start}
.resume .k{font-size:.875rem;color:var(--mut)}
.resume h1{font-size:clamp(1.5rem,5.8vw,2.25rem);font-weight:800;line-height:1.4}
.resume .sub{color:var(--mut);max-width:42ch}
.resume .bar{width:min(100%,280px);background:var(--glass2)}
.resume .by{font-size:.8125rem;color:var(--dim)}
@media (min-width:900px){.resume{padding:36px 36px;min-height:280px}}
.slides{display:grid;gap:10px}
.slide{display:grid;grid-template-columns:58px minmax(0,1fr) auto;background:var(--solid);border:1.5px solid var(--line);border-radius:var(--r-m);overflow:hidden;box-shadow:0 2px 0 var(--line);transition:transform .08s,box-shadow .08s}
.slide:hover{border-color:var(--ac)}
.slide:active{transform:translateY(2px);box-shadow:none}
.slide .lab{background:var(--ac);color:var(--ink);display:grid;place-content:center;justify-items:center;font-family:var(--f-d);line-height:1.2}
.slide .lab small{font-size:.6875rem;font-weight:500;opacity:.9}
.slide .lab b{font-size:1.75rem;font-weight:800}
.slide .tx{padding:12px 14px;display:grid;align-content:center;gap:1px}
.slide h3{font-size:1.1875rem}
.slide .q{font-size:.875rem;color:var(--mut);line-height:1.65}
.slide .m{font-size:.75rem;color:var(--dim);margin-top:2px}
.slide .spec{align-self:center;margin-inline-end:12px}
.status{display:grid;grid-template-columns:repeat(3,1fr);background:var(--solid);border:1.5px solid var(--line);border-radius:var(--r-m)}
.status>div{padding:12px 14px;display:grid;gap:0;min-width:0}
.status>div+div{border-inline-start:1.5px solid var(--line)}
.status span{font-size:.75rem;color:var(--dim)}
.status b{font:700 1.125rem var(--f-d);white-space:nowrap}
.status b small{font-size:.75rem;font-weight:500;color:var(--dim)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{display:grid;gap:8px;padding:14px;background:var(--solid);border:1.5px solid var(--line);border-radius:var(--r-m);font-weight:600;line-height:1.5}
.tile:hover{border-color:var(--fg)}
.tile .ib{width:38px;height:38px;border-radius:11px;background:var(--glass2);display:grid;place-items:center}
.tile .ib svg{width:21px;height:21px}
.tile small{display:block;font-weight:400;color:var(--mut);font-size:.8125rem}
.credit{margin-top:36px;padding-top:16px;border-top:1px solid var(--line);font-size:.875rem;color:var(--dim);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.credit b{color:var(--fg)}

/* ---- chapter ---- */
.chead{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center}
.chead .k{font-size:.875rem;color:var(--mut)}
.chead h1{font-size:clamp(1.875rem,7vw,2.5rem);font-weight:800;line-height:1.25}
.chead .story{grid-column:1/-1;color:var(--mut);max-width:60ch}
.chead .prog{grid-column:1/-1;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;font-size:.8125rem;color:var(--mut)}
.path{display:grid;gap:8px}
.ln{display:grid;grid-template-columns:40px minmax(0,1fr) 20px;gap:12px;align-items:center;padding:11px 14px;background:var(--solid);border:1.5px solid var(--line);border-radius:var(--r-m)}
.ln:hover{border-color:var(--ac)}
.ln .d{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font:700 .9375rem var(--f-d);background:var(--glass);color:var(--mut)}
.ln.done .d{background:var(--ac);color:var(--ink)}
.ln.next{border-color:var(--ac);box-shadow:0 2px 0 var(--ac)}
.ln.next .d{background:color-mix(in srgb,var(--ac) 14%,var(--solid));color:var(--ac)}
.ln .t{display:block;font-weight:600;line-height:1.6}
.ln .m{display:flex;gap:12px;flex-wrap:wrap;font-size:.75rem;color:var(--dim)}
.ln .m .x{color:var(--gold);font-weight:600}
.ln>svg{color:var(--dim)}
.boss{display:grid;gap:10px;padding:18px;border-radius:var(--r-m);background:var(--solid);border:1.5px solid var(--line);justify-items:start}
.boss b{font:700 1.0625rem var(--f-d)}

/* ---- lesson ---- */
.lhead{display:grid;gap:8px;margin-bottom:22px}
.lhead .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.lhead h1{font-size:clamp(1.5rem,5.6vw,2rem);font-weight:800;line-height:1.45}
.lesson{display:grid;gap:16px;font-size:1.0625rem;line-height:1.95}
.lesson h3{font-size:1.1875rem;margin-top:14px}
.lesson h4{font:700 1.0625rem var(--f-d);margin:6px 0 0}
.lesson ul,.lesson ol{margin:0;padding-inline-start:1.35em;display:grid;gap:6px}
.lesson li::marker{color:var(--ac);font-weight:700}
.lesson b{font-weight:700}
.hook{font-size:1.1875rem;font-weight:500;line-height:1.85;color:var(--fg);padding-bottom:16px;border-bottom:1.5px solid var(--line)}
.box{padding:13px 16px;border-radius:var(--r-m);background:var(--glass);display:grid;gap:2px;font-size:1rem;line-height:1.85}
.box .lb{font:700 .8125rem var(--f-d);color:var(--bc,var(--mut));display:flex;align-items:center;gap:6px}
.box .lb svg{width:16px;height:16px}
.box.key{background:color-mix(in srgb,var(--ac) 9%,var(--solid));--bc:color-mix(in srgb,var(--ac) 85%,var(--fg))}
.box.tip{background:color-mix(in srgb,var(--ok) 9%,var(--solid));--bc:var(--ok)}
.box.warn{background:color-mix(in srgb,var(--bad) 9%,var(--solid));--bc:var(--bad)}
.box.exam{background:transparent;border:1.5px dashed color-mix(in srgb,var(--gold) 55%,var(--line));--bc:var(--gold)}
.box.iq{background:var(--glass2);border-radius:var(--r-l) 4px var(--r-l) var(--r-l);margin-inline-end:8%;--bc:var(--fg)}
.defc,.whyc,.idc{background:var(--solid);border:1.5px solid var(--line);border-radius:var(--r-m);padding:14px 16px;display:grid;gap:6px;font-size:1rem;line-height:1.85}
.defc .lb,.whyc .lb,.idc .hd{display:flex;gap:6px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.defc .nm,.whyc .nm,.idc .hd b{font:700 1.0625rem/1.6 var(--f-d)}
.whyc .an{padding-top:8px;border-top:1.5px solid var(--glass2)}
.idc{padding:0;gap:0;border-color:color-mix(in srgb,var(--ac) 45%,var(--line))}
.idc .hd{padding:11px 16px;background:color-mix(in srgb,var(--ac) 9%,var(--solid));border-radius:calc(var(--r-m) - 2px) calc(var(--r-m) - 2px) 0 0}
.idc dl{margin:0;padding:12px 16px;display:grid;gap:10px}
.idc dt{font:700 .8125rem var(--f-d);color:color-mix(in srgb,var(--ac) 85%,var(--fg))}
.idc dd{margin:0}
.tblw{overflow-x:auto;border-radius:var(--r-m);border:1.5px solid var(--line);background:var(--solid)}
.tblw table{border-collapse:collapse;width:100%;min-width:440px;font-size:.9375rem;line-height:1.75}
.tblw th{background:var(--glass);font:700 .875rem var(--f-d);text-align:start;padding:10px 13px;white-space:nowrap}
.tblw td{padding:10px 13px;border-top:1px solid var(--line);vertical-align:top}
.tblw td:first-child{font-weight:600}
.cross{border-radius:var(--r-m);border:1.5px solid var(--line);background:var(--solid);overflow:hidden;font-size:.9375rem}
.cross .ct{padding:9px 14px;font:700 .9375rem var(--f-d);background:var(--glass)}
.cross .cr{display:grid;grid-template-columns:40px 1fr 1fr;gap:8px;padding:9px 12px;border-top:1px solid var(--line);align-items:center;text-align:center}
.cross .cr .k{font:600 .875rem var(--f-m);color:var(--ac);direction:ltr}
.cross .cr .w{grid-column:2/4}
.gt{font:600 .9em var(--f-m);padding:1px .35em;border-radius:5px;background:var(--glass2);color:var(--fg);white-space:nowrap}
.gt sup{font-size:.68em}
.prob{border-radius:var(--r-m);border:1.5px solid var(--line);background:var(--solid);padding:14px 16px;display:grid;gap:10px;font-size:1rem;line-height:1.85}
.prob .q{font-weight:600}
.prob ol{counter-reset:s;list-style:none;padding:0;display:grid;gap:8px}
.prob ol li{counter-increment:s;display:grid;grid-template-columns:26px minmax(0,1fr);gap:10px;padding:9px 11px;border-radius:10px;background:var(--glass)}
.prob ol li::before{content:counter(s);width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--ac);color:var(--ink);font:700 .8125rem var(--f-d)}
.quiz{border-radius:var(--r-m);background:var(--glass);padding:14px 16px;display:grid;gap:10px;font-size:1rem;line-height:1.8}
.quiz .q{font-weight:600}
.quiz .os{display:grid;gap:8px}
.quiz .o{text-align:start;padding:10px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--solid);min-height:46px;box-shadow:0 2px 0 var(--line)}
.quiz .o:hover:not(:disabled){border-color:var(--ac)}
.quiz .o:disabled{box-shadow:none;cursor:default}
.quiz .o.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,var(--solid))}
.quiz .o.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 11%,var(--solid))}
.lbl{font:700 .8125rem var(--f-d);color:var(--mut)}
.labbox{border-radius:var(--r-l);background:var(--panel);overflow:hidden;font-size:1rem;line-height:1.8}
.labbox>.lt{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line);font:700 .9375rem var(--f-d)}
.labbox>.lt small{font:500 .75rem var(--f-b);color:var(--ac)}
.labbox>.lb{padding:16px}
.fin{margin-top:32px;padding:20px;display:grid;gap:12px;justify-items:start;background:var(--solid);border:1.5px solid var(--line);border-radius:var(--r-m)}
.fin b{font:700 1.0625rem var(--f-d)}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.pager a{display:grid;gap:0;padding:12px 14px;border:1.5px solid var(--line);border-radius:var(--r-m);background:var(--solid);min-width:0}
.pager a:hover{border-color:var(--ac)}
.pager a small{font-size:.75rem;color:var(--dim)}
.pager a span{font-weight:600;line-height:1.6;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pager a.nx{text-align:end}

/* ---- ministerial question ---- */
.mq{background:var(--solid);border:1.5px solid var(--line);border-radius:var(--r-m);padding:13px 15px;display:grid;gap:8px;line-height:1.8}
.mq .h{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.mq .h .y{font-size:.75rem;color:var(--dim);margin-inline-start:auto}
.mq .x{font-weight:600}
.mq>.a{padding:11px 13px;border-radius:10px;background:color-mix(in srgb,var(--ok) 8%,var(--solid))}
.mq>.a .none{color:var(--mut)}
.mq .f{display:flex;gap:8px;flex-wrap:wrap}
.list{display:grid;gap:10px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{white-space:nowrap;padding:7px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--solid);color:var(--mut);font-weight:500;font-size:.9375rem}
.tabs button.on{background:var(--fg);color:var(--bg);border-color:var(--fg);font-weight:600}
.inp{width:100%;padding:10px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--solid);min-height:46px}
.inp:focus{border-color:var(--ac);outline:none}
.paper{display:grid;gap:8px}
.paper .br{font:700 .9375rem var(--f-d);margin-top:14px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}

/* ---- album ---- */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px}
.card{--rc:var(--line);aspect-ratio:5/6;border-radius:var(--r-m);border:1.5px solid var(--rc);background:var(--solid);padding:11px;display:flex;flex-direction:column;justify-content:space-between;text-align:start;overflow:hidden;box-shadow:0 2px 0 var(--rc)}
.card.gold{--rc:var(--gold)} .card.silver{--rc:var(--silver)} .card.bronze{--rc:var(--bronze)}
.card .r{font:700 .6875rem var(--f-d);color:var(--rc);display:flex;align-items:center;gap:5px}
.card:not(.gold):not(.silver):not(.bronze) .r{color:var(--dim)}
.card .r::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.card .nm{font:700 .9375rem/1.55 var(--f-d)}
.card .fc{font-size:.6875rem;color:var(--dim);line-height:1.5}
.card.locked{background:var(--glass);box-shadow:none;--rc:var(--line)}
.card.locked .nm{color:transparent;background:var(--glass2);border-radius:6px}
.modal{position:fixed;inset:0;z-index:80;background:rgba(8,10,22,.6);display:grid;place-items:center;padding:16px}
.modal .mc{width:min(540px,100%);max-height:86vh;overflow:auto;border-radius:var(--r-l);background:var(--solid);padding:20px;display:grid;gap:12px;box-shadow:0 20px 60px rgba(8,10,22,.35)}
.modal h2{font-size:1.25rem}

/* ---- labs ---- */
.labs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:10px}
.labc{padding:14px;display:grid;grid-template-columns:38px minmax(0,1fr);gap:4px 12px;align-items:start;border-radius:var(--r-m);border:1.5px solid var(--line);background:var(--solid)}
.labc:hover{border-color:var(--ac)}
.labc .ib{grid-row:1/3;width:38px;height:38px;border-radius:11px;background:var(--ac);color:var(--ink);display:grid;place-items:center}
.labc .ib svg{width:20px;height:20px}
.labc b{font:700 1rem/1.5 var(--f-d)} .labc small{color:var(--mut);line-height:1.6;font-size:.8125rem;grid-column:2}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.ctl label{font-size:.875rem;color:var(--mut);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ctl select,.ctl input[type=text]{padding:7px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--solid);min-height:40px;max-width:100%}
input[type=range]{accent-color:var(--ac);width:100%}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:11px;overflow:hidden;background:var(--solid)}
.seg button{padding:6px 13px;background:transparent;border:0;color:var(--mut);min-height:38px;font-weight:500}
.seg button.on{background:var(--ac);color:var(--ink);font-weight:700}
.pn{display:grid;gap:5px;direction:ltr;overflow-x:auto;padding-bottom:4px}
.pn .c{min-width:54px;min-height:50px;border-radius:10px;display:grid;place-items:center;padding:4px 6px;background:var(--glass2);font:600 .9rem var(--f-m);text-align:center;line-height:1.3;border:1.5px solid transparent}
.pn .c small{display:block;font:500 .6875rem var(--f-b);direction:rtl}
.pn .c.g{background:transparent;border-color:var(--ac);border-radius:50px}
.pn .c.hd{background:transparent;color:var(--dim);font-size:.8rem}
.pn .c.dead{opacity:.45;text-decoration:line-through}
.res{display:grid;gap:6px;margin-top:14px}
.res .rw{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:7px 12px;border-radius:10px;background:var(--glass)}
.res .rw i{font-style:normal;width:13px;height:13px;border-radius:50%;display:inline-block;margin-inline-end:8px;vertical-align:-1px;border:1px solid var(--line)}
.stage{position:relative;width:100%;border-radius:var(--r-m);overflow:hidden;background:var(--stage);border:1px solid var(--line)}
.stage canvas{display:block;width:100%;height:auto;touch-action:none}
.stage .hint{position:absolute;inset:auto 8px 8px auto;font-size:.6875rem;color:#C3C9E0;background:rgba(10,12,22,.72);padding:1px 9px;border-radius:6px}
.info{margin-top:10px;padding:12px 14px;border-radius:12px;background:var(--glass);min-height:64px;line-height:1.85}
.info b{font-weight:700;color:var(--fg)}
.legend{font-size:.75rem;color:var(--dim);margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chipb{padding:5px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--solid);font-size:.875rem;min-height:36px}
.chipb.on{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 16%,var(--solid))}
.chipb.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,var(--solid))} .chipb.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--solid))}
.seq{font:600 1rem var(--f-m);direction:ltr;text-align:left;letter-spacing:.08em;word-break:break-all;line-height:2}
.seq span{display:inline-block;padding:0 .12em;border-radius:5px}
.seq .A{color:var(--c3)} .seq .T,.seq .U{color:var(--c2)} .seq .C{color:var(--c1)} .seq .G{color:var(--c4)}
.seq .ch{background:color-mix(in srgb,var(--bad) 30%,transparent)}
.sl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;align-items:center;padding:9px 12px;border-radius:12px;background:var(--glass);margin-top:8px}
.sl .k{font:600 .8125rem var(--f-b);color:var(--mut)}

/* ---- profile + certificate ---- */
.form{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.form label{display:grid;gap:4px;font-size:.875rem;color:var(--mut)}
.cert{position:relative;padding:30px 22px;text-align:center;background:var(--solid);border:2px solid var(--fg);border-radius:6px;outline:1px solid var(--fg);outline-offset:-8px;display:grid;gap:4px;justify-items:center}
.cert .wm{font:800 1.0625rem var(--f-d);display:flex;gap:8px;align-items:center}
.cert .wm svg{width:24px;height:24px}
.cert .nm{font:800 1.625rem/1.5 var(--f-d)}
.cert .sc{font:800 3.25rem/1.1 var(--f-d);color:var(--ac)}
.cert .sc small{font-size:.35em;color:var(--dim)}
.cert .ln2{width:120px;height:1.5px;background:var(--fg);margin:6px 0}
.cert .seal{margin-top:10px;width:76px;height:76px;color:var(--gold)}

/* timeline strip (ch4 lab) */
.tl{display:flex;gap:8px;overflow-x:auto;max-width:100%;padding:2px 2px 10px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
.tl-i{flex:0 0 auto;display:grid;gap:1px;justify-items:start;padding:8px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--solid);color:var(--fg);min-width:88px;text-align:start;scroll-snap-align:start}
.tl-i .num{font-size:.72rem;color:var(--dim)}
.tl-i.on{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 18%,var(--solid))}
.lt{white-space:nowrap;font-size:.86em;font-weight:500;opacity:.8}
.nw{white-space:nowrap}

/* ===== access gate: night stage with a turning helix ===== */
body.gated{overflow:hidden}
body.gated header.top,body.gated #dock,body.gated #app{visibility:hidden}
.gate{--g-ink:#EEF0FA;--g-mut:#A7ADC8;--g-dim:#6F7594;--g-line:rgba(201,184,255,.16);--g-glass:rgba(16,19,38,.62);
  position:fixed;inset:0;z-index:200;color:var(--g-ink);background:radial-gradient(120% 80% at 70% 0%,#1B1640 0%,rgba(27,22,64,0) 60%),radial-gradient(90% 70% at 10% 100%,#0E2A3A 0%,rgba(14,42,58,0) 55%),#080A14;
  display:grid;grid-template-rows:1fr auto;overflow-y:auto;overflow-x:hidden}
.gate[hidden],.gate [hidden]{display:none!important}
#g-cv{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
.g-veil{position:fixed;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(8,10,20,0) 0%,rgba(8,10,20,.35) 38%,rgba(8,10,20,.88) 62%,#080A14 100%)}
.g-main{position:relative;display:flex;align-items:flex-end;justify-content:center;padding:24px 16px 8px;min-height:100%}
.g-main.solo{align-items:center}
.g-by{position:relative;text-align:center;font-size:.8125rem;color:var(--g-dim);padding:10px 16px 18px}
.gate h1{font:800 clamp(1.75rem,7vw,2.125rem)/1.3 var(--f-d);color:var(--g-ink)}
.g-mark{width:56px;height:56px;color:var(--g-ink)}
.g-mark .nu{fill:#B79CFF;transform-origin:17px 12px;animation:g-nu 2.4s ease-in-out infinite}
@keyframes g-nu{50%{transform:scale(.8)}}
/* login */
.g-hero{width:100%;max-width:420px;display:grid;gap:18px;padding-bottom:4px}
.g-brand{display:flex;align-items:center;gap:14px}
.g-brand .g-mark{width:52px;height:52px;flex:none}
.g-brand h1{font-size:clamp(2.5rem,12vw,3.5rem);line-height:1.3;padding-bottom:.06em;letter-spacing:-.01em;background:linear-gradient(100deg,#FFFFFF 10%,#D9CCFF 55%,#9FD8FF 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.g-brand p{font:600 1rem var(--f-b);color:#B79CFF;margin-top:4px}
.g-lead{font-size:1.0625rem;line-height:1.85;color:var(--g-mut);max-width:36ch}
.g-q{margin:0;padding:14px 16px 12px;border:1px solid var(--g-line);border-radius:18px;background:var(--g-glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);display:grid;gap:6px;transition:opacity .38s,transform .38s}
.g-q.out{opacity:.0;transform:translateY(6px)}
.g-q figcaption{display:flex;align-items:center;gap:8px;font-size:.8125rem;color:var(--g-dim)}
.g-q .tg{padding:1px 10px;border-radius:999px;background:rgba(183,156,255,.16);color:#CDB9FF;font-weight:700}
.g-q blockquote{margin:0;font:700 1.1875rem/1.7 var(--f-d);color:var(--g-ink);min-height:3.4em}
.g-dots{display:flex;gap:5px}
.g-dots i{width:16px;height:3px;border-radius:2px;background:rgba(255,255,255,.14);transition:background .3s,width .3s}
.g-dots i.on{width:26px;background:#B79CFF}
.g-q.out .g-dots{opacity:1}
.g-cta{display:grid;gap:10px;justify-items:center}
.g-gbtn{width:100%;min-height:44px;display:flex;justify-content:center;color-scheme:light}
.g-note{font-size:.875rem;color:var(--g-dim);text-align:center}
.g-in{opacity:0;transform:translateY(14px);animation:g-in .7s cubic-bezier(.2,.8,.2,1) var(--d,0ms) forwards}
@keyframes g-in{to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.g-in{animation:none;opacity:1;transform:none}.g-mark .nu{animation:none}.g-q{transition:none}}
@media (min-width:900px){
  .g-veil{background:linear-gradient(90deg,rgba(8,10,20,0) 30%,rgba(8,10,20,.75) 58%,#080A14 85%)}
  .g-main{align-items:center;justify-content:flex-start;padding:48px max(6vw,48px)}
  .g-main.solo{justify-content:center}
  .g-main.solo .g-card{margin-inline-start:0}
  .g-hero{max-width:440px;gap:22px}
}
/* other gate screens */
.g-card{width:100%;max-width:400px;display:grid;gap:14px;justify-items:center;text-align:center;padding:28px 20px;border:1px solid var(--g-line);border-radius:24px;background:var(--g-glass);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.g-card.center{padding:32px 20px}
.g-sub{color:var(--g-mut);max-width:34ch;line-height:1.8}
.g-wait{color:var(--g-mut);font-weight:600}
.g-btn{width:100%;min-height:52px;display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:0 18px;border-radius:999px;font:600 1rem var(--f-b);background:rgba(255,255,255,.06);color:var(--g-ink);border:1px solid var(--g-line);text-decoration:none;cursor:pointer;transition:transform .08s,background .15s}
.g-btn:active:not(:disabled){transform:scale(.98)}
.g-btn.pri{background:#EEF0FA;color:#0B0D1A;border-color:transparent}
.g-btn.google{background:#fff;color:#1f1f1f;border-color:#dadce0;max-width:360px}
.g-btn:disabled{opacity:.55}
.g-err{color:#FF9DB4;font-weight:600;font-size:.9375rem;text-align:center}
.g-steps{text-align:start;display:grid;gap:6px;padding-inline-start:20px;color:var(--g-mut)}
.g-lock{width:46px;height:46px;color:#FFB36B}
.g-acc{width:100%;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;text-align:start;padding:14px 16px;border:1px solid var(--g-line);border-radius:16px;background:rgba(255,255,255,.04)}
.g-acc span{display:block;font-size:.75rem;color:var(--g-dim)}
.g-acc b{display:block;font-weight:700;line-height:1.5}
.g-acc small{display:block;color:var(--g-mut);font-size:.8125rem;overflow-wrap:anywhere}
.g-code{text-align:center;padding-inline-start:12px;border-inline-start:1px dashed var(--g-line)}
.g-code b{font:700 1.25rem var(--f-m);letter-spacing:.08em}
.g-row{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;margin-top:2px}
.g-link{background:none;border:0;color:var(--g-mut);font:600 .9375rem var(--f-b);text-decoration:underline;text-underline-offset:3px;min-height:40px;cursor:pointer}
.g-toast{position:fixed;inset-inline:16px;bottom:88px;margin:auto;max-width:360px;padding:12px 16px;border-radius:12px;background:var(--c0);color:var(--bg);font-weight:600;text-align:center;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none;z-index:300}
.g-toast.on{opacity:1;transform:none}
/* header chip */
.pill.acc{padding:3px 10px;border-radius:999px;border:1.5px solid var(--line);font-size:.8125rem;color:var(--fg);text-decoration:none;white-space:nowrap}
@media (max-width:420px){.pill.acc{font-size:.75rem;padding:2px 8px}}
/* account block in ملفي */
.acc-row{display:flex;gap:12px;align-items:center}
.acc-row img{width:48px;height:48px;border-radius:50%}
.acc-row b{display:block}
.acc-row small{display:block;color:var(--mut);overflow-wrap:anywhere}
.st{display:inline-block;margin-top:4px;padding:2px 9px;border-radius:999px;font-size:.75rem;font-weight:700;background:var(--glass2);color:var(--mut)}
.st.trial{background:color-mix(in srgb,var(--c1) 14%,var(--solid));color:var(--c1)}
.st.paid,.st.admin{background:color-mix(in srgb,var(--c3) 16%,var(--solid));color:var(--c3)}
.st.wait{background:color-mix(in srgb,var(--c4) 16%,var(--solid));color:var(--c4)}
.st.blocked{background:color-mix(in srgb,var(--bad) 16%,var(--solid));color:var(--bad)}
/* admin */
.adm-bar{display:grid;gap:10px;margin:18px 0 14px}
.adm-bar .chips{display:flex;gap:8px;flex-wrap:wrap}
.adm-list{display:grid;gap:10px}
.adm-u{border:1.5px solid var(--line);border-radius:var(--r-m);background:var(--solid);padding:12px 14px;display:grid;gap:10px}
.adm-h{display:grid;grid-template-columns:40px 1fr;gap:4px 12px;align-items:start}
.adm-h img,.adm-h .ph{width:40px;height:40px;border-radius:50%;background:var(--glass2);grid-row:span 2}
.adm-id{display:grid;min-width:0}
.adm-id b{line-height:1.5}
.adm-id small{color:var(--mut);font-size:.8125rem;overflow-wrap:anywhere}
.adm-h .st{grid-column:2;justify-self:start}
.adm-warn{font-size:.8125rem;color:var(--c4);background:color-mix(in srgb,var(--c4) 10%,var(--solid));padding:6px 10px;border-radius:8px}
.adm-a{display:flex;gap:8px;flex-wrap:wrap}
.btn.warn{color:var(--bad)}
</style>
</head>

const srcText=id=>{const n=document.getElementById('src-'+id);return n?n.textContent:''};
const cells=s=>s.split('|').map(x=>x.trim());
const split2=s=>{const i=s.indexOf('::');return i<0?[s.trim(),'']:[s.slice(0,i).trim(),s.slice(i+2).trim()]};

function parseContent(txt,ch){
  const L=[];let cur=null,blk=null;const push=b=>{cur.blocks.push(b);blk=b;return b};
  for(const raw of txt.split('\n')){
    const ln=raw.replace(/\s+$/,'');if(!ln.trim()){blk=null;continue}
    if(ln.startsWith('## ')){const p=cells(ln.slice(3));cur={id:p[0],ch,title:p[1],pages:p[2]||'',mins:+p[3]||5,blocks:[],ans:[]};L.push(cur);blk=null;continue}
    if(!cur)continue;
    if(ln.startsWith('#### ')){push({t:'h4',x:ln.slice(5)});blk=null;continue}
    if(ln.startsWith('### ')){push({t:'h',x:ln.slice(4)});blk=null;continue}
    if(ln[0]===':'){
      const sp=ln.indexOf(' '),k=sp<0?ln.slice(1):ln.slice(1,sp),rest=sp<0?'':ln.slice(sp+1).trim();
      if(k==='def'||k==='why'){const[a,b]=split2(rest);push({t:k,a,b});blk=null}
      else if(k==='quiz'){const p=rest.split('::').map(s=>s.trim());push({t:'quiz',q:p[0],o:p.slice(1)});blk=null}
      else if(k==='tbl')push({t:'tbl',head:cells(rest),rows:[]});
      else if(k==='cross')push({t:'cross',title:rest,rows:[]});
      else if(k==='id')push({t:'id',name:rest,rows:[]});
      else if(k==='prob'||k==='case')push({t:k,q:rest,steps:[]});
      else if(k==='lab'){const p=cells(rest);push({t:'lab',name:p[0],arg:p[1]||''});blk=null}
      else if(k==='ans'){const i=rest.indexOf('|');const[a,b]=split2(rest.slice(i+1));cur.ans.push({ty:rest.slice(0,i).trim(),a,b});blk=null}
      else{push({t:k,x:rest});blk=null}
      continue;
    }
    if(ln[0]==='|'&&blk&&blk.rows){blk.rows.push(cells(ln.slice(1)));continue}
    if(ln.startsWith('> ')&&blk&&blk.steps){blk.steps.push(ln.slice(2));continue}
    if(ln.startsWith('- ')){if(!(blk&&blk.t==='ul'))push({t:'ul',items:[]});blk.items.push(ln.slice(2));continue}
    if(/^\d+\. /.test(ln)){if(!(blk&&blk.t==='ol'))push({t:'ol',items:[]});blk.items.push(ln.replace(/^\d+\. /,''));continue}
    push({t:'p',x:ln});blk=null;
  }
  return L;
}

function addCard(L,name,kind,facets){
  const al=kind==='why'?[norm(name)]:aliases(name);const id=kind[0]+'-'+al[0];
  let c=CARDS.get(id);if(!c){c={id,ch:L.ch,lid:L.id,name:name.replace(/\s*\([^)]*[A-Za-z][^)]*\)/g,'').trim(),kind,al,facets:[],freq:0};CARDS.set(id,c)}
  facets.forEach(f=>{if(f[1])c.facets.push(f)});
  c.freq=Math.max(c.freq,...al.map(a=>TOPIC.get(a)||0));
  return c;
}

const LABS={};
const REDUCED=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
const BASEC={A:'#4be08a',T:'#ff6fb5',U:'#ff6fb5',C:'#38c6f8',G:'#ffc24a'},COMP={A:'T',T:'A',C:'G',G:'C'};
function fitCanvas(cv,ratio){const d=Math.min(window.devicePixelRatio||1,2),w=cv.clientWidth||cv.parentElement.clientWidth||320,h=ratio?w*ratio:(cv.clientHeight||200);
  cv.width=Math.round(w*d);cv.height=Math.round(h*d);if(ratio)cv.style.aspectRatio=(1/ratio);const c=cv.getContext('2d');c.setTransform(d,0,0,d,0,0);return{c,w,h}}

/* pseudo-3D double helix on a 2D canvas: hero backdrop + lab (drag to rotate, slider to replicate) */
function helixScene(cv,o){
  o=o||{};let g,raf=0,rot=.6,rep=o.rep||0,dragX=null,alive=true;const N=o.hero?30:20,SEQ='ATGCCGTAACGTTAGCATGCAAGTCCATGA';
  const size=()=>{g=fitCanvas(cv,o.hero?0:.78)};size();
  function draw(){
    const{c,w,h}=g;c.clearRect(0,0,w,h);
    const tilt=o.hero?-.42:0,L=o.hero?Math.hypot(w,h)*.95:h*.86,R=o.hero?Math.min(w,h)*.2:Math.min(w*.2,h*.2),ox=o.hero?Math.min(w*.26,260):w/2,oy=h/2;
    const ct=Math.cos(tilt),st=Math.sin(tilt),P=(x,y)=>[ox+x*ct-y*st,oy+x*st+y*ct],it=[];
    for(let i=0;i<N;i++){
      const u=i/(N-1),y=(u-.5)*L,a=i*.52+rot,op=Math.max(0,Math.min(1,(rep*1.3-u)*3.5)),b=SEQ[i%SEQ.length],r=R*(1-.42*op),cx=op*R*1.55,co=Math.cos(a),z=Math.sin(a);
      if(op<.02)it.push({z:0,k:'rung',p1:P(r*co,y),p2:P(-r*co,y),z1:z,z2:-z,b1:b,b2:COMP[b],al:1});
      else{
        const na=Math.max(0,(op-.45)*1.8);
        it.push({z:0,k:'rung',p1:P(cx+r*co,y),p2:P(cx-r*co,y),z1:z,z2:-z,b1:b,b2:COMP[b],al:na,nw:2});
        it.push({z:0,k:'rung',p1:P(-cx+r*co,y),p2:P(-cx-r*co,y),z1:z,z2:-z,b1:b,b2:COMP[b],al:na,nw:1});
      }
    }
    const dot=(p,z,col,al,nw)=>{const s=(o.hero?5.5:6)*(1+z*.38);c.globalAlpha=(o.hero?.5:.95)*(nw?al:1)*(.55+.45*(z+1)/2);c.beginPath();c.arc(p[0],p[1],Math.max(1.5,s),0,7);c.fillStyle=nw?'#eef2ff':col;c.fill()};
    it.forEach(r=>{const m=[(r.p1[0]+r.p2[0])/2,(r.p1[1]+r.p2[1])/2];c.lineWidth=o.hero?2:3;
      const half=(p,col,dim)=>{c.globalAlpha=(o.hero?.32:.8)*dim;c.strokeStyle=col;c.beginPath();c.moveTo(p[0],p[1]);c.lineTo(m[0],m[1]);c.stroke()};
      half(r.p1,BASEC[r.b1],r.nw===1?r.al:1);half(r.p2,BASEC[r.b2],r.nw===2?r.al:1);
      const back=r.z1<r.z2?1:2;
      if(back===1){dot(r.p1,r.z1,'#8ea2ff',r.al,r.nw===1);dot(r.p2,r.z2,'#b08cff',r.al,r.nw===2)}else{dot(r.p2,r.z2,'#b08cff',r.al,r.nw===2);dot(r.p1,r.z1,'#8ea2ff',r.al,r.nw===1)}
    });c.globalAlpha=1;
  }
  function loop(){if(!alive)return;if(dragX===null&&!REDUCED)rot+=o.hero?.006:.012;draw();if(!REDUCED||dragX!==null)raf=requestAnimationFrame(loop)}
  const dn=e=>{dragX=e.clientX;cv.setPointerCapture&&cv.setPointerCapture(e.pointerId);if(REDUCED){cancelAnimationFrame(raf);loop()}},mv=e=>{if(dragX!==null){rot+=(e.clientX-dragX)*.012;dragX=e.clientX;if(REDUCED)draw()}},up=()=>{dragX=null};
  if(!o.hero){cv.addEventListener('pointerdown',dn);cv.addEventListener('pointermove',mv);cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up)}
  const rs=()=>{size();draw()};window.addEventListener('resize',rs);loop();
  const stop=()=>{alive=false;cancelAnimationFrame(raf);window.removeEventListener('resize',rs)};
  stop.setRep=v=>{rep=v;if(REDUCED)draw()};return stop;
}

/* ---------- genetics engine ---------- */
const GM={
 tall:{name:'طول الساق في البزاليا',loci:[['T','t']],p:[['Tt'],['Tt']],ph:g=>g[0][0]==='T'?['طويل الساق','#4be08a']:['قصير الساق','#ffc24a']},
 flower:{name:'لون الأزهار في البزاليا',loci:[['R','r']],p:[['Rr'],['rr']],ph:g=>g[0][0]==='R'?['أحمر الأزهار','#ff5c7a']:['أبيض الأزهار','#f1f5ff']},
 seeds:{name:'لون البذور وشكلها (تهجين ثنائي)',loci:[['G','g'],['W','w']],p:[['Gg','Ww'],['Gg','Ww']],ph:g=>[(g[0][0]==='G'?'صفراء':'خضراء')+' '+(g[1][0]==='W'?'مستديرة':'مجعدة'),g[0][0]==='G'?(g[1][0]==='W'?'#ffd54a':'#c9a227'):(g[1][0]==='W'?'#4be08a':'#2f9d5d')]},
 fly:{name:'ذبابة الفاكهة: الجناح واللون',loci:[['L','l'],['E','e']],p:[['Ll','Ee'],['Ll','Ee']],ph:g=>[(g[1][0]==='E'?'رمادية':'ابنوسية')+' '+(g[0][0]==='L'?'طويلة الجناح':'أثرية الجناح'),g[1][0]==='E'?(g[0][0]==='L'?'#cbd5ee':'#8fa0c8'):(g[0][0]==='L'?'#5a4a3a':'#3a2f25')]},
 snap:{name:'حنك السبع: سيادة غير تامة',loci:[['R','R′']],p:[['RR′'],['RR′']],ph:g=>g[0].join('')==='RR'?['أحمر','#ff4d6d']:g[0].join('')==='RR′'?['وردي','#ff9ec2']:['أبيض','#f1f5ff']},
 roan:{name:'الماشية قصيرة القرون: سيادة مشتركة',loci:[['C^R','C^W']],p:[['C^RC^W'],['C^RC^W']],ph:g=>{const k=g[0].join('');return k==='C^RC^R'?['أحمر الشعر','#c0392b']:k==='C^RC^W'?['غباري','#d99a8a']:['أبيض الشعر','#f1f5ff']}},
 creeper:{name:'الدجاج الزاحف: أليل مميت سائد',loci:[['C','c']],p:[['Cc'],['Cc']],ph:g=>{const k=g[0].join('');return k==='CC'?['ميت','#555',1]:k==='Cc'?['زاحف','#ffc24a']:['اعتيادي','#4be08a']}},
 mouse:{name:'الفئران الصفراء: أليل مميت',loci:[['Y','y']],p:[['Yy'],['Yy']],ph:g=>{const k=g[0].join('');return k==='YY'?['يموت','#555',1]:k==='Yy'?['أصفر','#ffd54a']:['رمادي','#9aa6cc']}},
 sickle:{name:'فقر الدم المنجلي',loci:[['Hb^A','Hb^s']],p:[['Hb^AHb^s'],['Hb^AHb^s']],ph:g=>{const k=g[0].join('');return k==='Hb^AHb^A'?['سليم','#4be08a']:k==='Hb^AHb^s'?['حامل للأليل','#ffc24a']:['يموت بعد عمر المراهقة','#ff6b81']}},
 squash:{name:'لون ثمار القرع: التفوق',loci:[['W','w'],['Y','y']],p:[['Ww','Yy'],['Ww','Yy']],ph:g=>g[0][0]==='W'?['بيضاء','#f1f5ff']:g[1][0]==='Y'?['صفراء','#ffd54a']:['خضراء','#4be08a']},
 comb:{name:'شكل العرف في الدجاج',loci:[['R','r'],['P','p']],p:[['Rr','Pp'],['Rr','Pp']],ph:g=>{const r=g[0][0]==='R',p=g[1][0]==='P';return r&&p?['جوزي','#b08cff']:r?['وردي','#ff6fb5']:p?['بازلائي','#4be08a']:['مفرد','#ffc24a']}},
 abo:{name:'مجاميع الدم ABO',loci:[['I^A','I^B','i']],p:[['I^Ai'],['I^Bi']],ph:g=>{const k=g[0].join('');return k==='ii'?['O','#cbd5ee']:k==='I^AI^B'?['AB','#b08cff']:k[2]==='A'?['A','#ff6b81']:['B','#38c6f8']}},
 rh:{name:'العامل الريسي Rh',loci:[['Rh','rh']],p:[['Rhrh'],['Rhrh']],ph:g=>g[0][0]==='Rh'?['Rh⁺','#ff6b81']:['Rh⁻','#38c6f8']},
 rabbit:{name:'لون الفراء في الأرنب: أليلات متعددة',loci:[['C','c^(ch)','c^h','c^a']],p:[['Cc^a'],['c^(ch)c^a']],ph:g=>({'C':['رمادي','#9a8c7a'],'c^(ch)':['فضي','#cbd5ee'],'c^h':['هيمالايا','#f3e9dc'],'c^a':['أمهق','#ffffff']})[g[0][0]]}
};
GM.test=Object.assign({},GM.tall,{name:'التضريب الاختباري: طويل مجهول × قصير',p:[['Tt'],['tt']]});
GM.free=GM.tall;
/* split a parent string like 'I^Ai' or 'c^(ch)c^a' into its two allele tokens for a locus */
function splitPair(s,al){for(const a of al)if(s.startsWith(a)){const r=s.slice(a.length);if(al.includes(r))return[a,r]}return[al[0],al[0]]}
const sortPair=(p,al)=>p.slice().sort((x,y)=>al.indexOf(x)-al.indexOf(y));
function gametes(par){let out=[[]];par.forEach(pair=>{const n=[];out.forEach(g=>pair.forEach(a=>n.push(g.concat([a]))));out=n});const m=new Map();out.forEach(g=>{const k=g.join('|');m.set(k,{g,w:(m.get(k)||{w:0}).w+1})});return[...m.values()]}
const gcd=(a,b)=>b?gcd(b,a%b):a;
function crossCalc(M,pf,pm){
  const gf=gametes(pf),gm=gametes(pm),grid=[],GA=new Map(),PA=new Map();let tot=0;
  gm.forEach(m=>{const row=[];gf.forEach(f=>{const geno=M.loci.map((al,i)=>sortPair([f.g[i],m.g[i]],al)),key=geno.map(x=>x.join('')).join(''),ph=M.ph(geno),w=f.w*m.w;tot+=w;
    row.push({key,ph});const a=GA.get(key)||{key,w:0,ph};a.w+=w;GA.set(key,a);const p=PA.get(ph[0])||{l:ph[0],c:ph[1],dead:ph[2],w:0};p.w+=w;PA.set(ph[0],p)});grid.push(row)});
  return{gf,gm,grid,GA:[...GA.values()],PA:[...PA.values()],tot};
}
const ratio=(arr)=>{const d=arr.reduce((a,b)=>gcd(a,b));return arr.map(x=>x/d)};
function punnettUI(root,key,lock){
  let M=GM[key]||GM.tall,par=M.p.map(p=>p.map((s,i)=>splitPair(s,M.loci[i])));
  const opts=Object.keys(GM).filter(k=>k!=='free'&&k!=='test');
  function draw(){
    const R=crossCalc(M,par[0],par[1]),gl=g=>gtHtml(g.join(''));
    const cols=R.gf.length+1;
    const parentUI=(pi,lab)=>`<div style="display:grid;gap:6px;justify-items:start"><span class="mut" style="font-size:.82rem">${lab}</span><div class="chips">${par[pi].map((pair,li)=>pair.map((a,ai)=>`<button class="chipb on" data-p="${pi}" data-l="${li}" data-a="${ai}" title="اضغط لتغيير الأليل">${gtHtml(a)}</button>`).join('')).join('<span class="dim">·</span>')}</div><span class="dim" style="font-size:.78rem">${M.ph(par[pi].map((p,i)=>sortPair(p,M.loci[i])))[0]}</span></div>`;
    const alive=R.PA.filter(p=>!p.dead),hasDead=alive.length<R.PA.length,rt=ratio(R.PA.map(p=>p.w)),ra=hasDead&&alive.length?ratio(alive.map(p=>p.w)):null;
    root.innerHTML=`${lock?'':`<div class="ctl"><label>الصفة <select id="pn-m">${opts.map(k=>`<option value="${k}"${GM[k]===M?' selected':''}>${GM[k].name}</option>`).join('')}</select></label></div>`}
    <div class="row" style="justify-content:space-around;margin-bottom:12px;align-items:start">${parentUI(0,'الأب ♂ (اضغط على الأليل لتغييره)')}<span style="font:800 1.4rem var(--f-d);align-self:center">×</span>${parentUI(1,'الأم ♀')}</div>
    <div class="pn" style="grid-template-columns:repeat(${cols},minmax(54px,1fr))"><div class="c hd">♀ \\ ♂</div>${R.gf.map(g=>`<div class="c g">${gl(g.g)}</div>`).join('')}
      ${R.grid.map((row,ri)=>`<div class="c g">${gl(R.gm[ri].g)}</div>`+row.map(c=>`<div class="c${c.ph[2]?' dead':''}" style="background:color-mix(in srgb,${c.ph[1]} 30%,transparent);border-color:${c.ph[1]}">${gtHtml(c.key)}<small>${c.ph[0]}</small></div>`).join('')).join('')}</div>
    <div class="res"><b style="font-family:var(--f-d)">النسبة المظهرية: <span class="num">${rt.join(' : ')}</span></b>${R.PA.map(p=>`<div class="rw"><span><i style="background:${p.c}"></i>${p.l}</span><span class="num">${p.w}/${R.tot} · ${Math.round(p.w/R.tot*100)}%</span></div>`).join('')}
      ${ra?`<div class="rw" style="border:1px dashed var(--bad)"><span>بين الأحياء فقط: ${alive.map(p=>p.l).join(' : ')}</span><span class="num">${ra.join(' : ')}</span></div>`:''}
      <b style="font-family:var(--f-d);margin-top:6px">النسبة الوراثية: <span class="num">${ratio(R.GA.map(g=>g.w)).join(' : ')}</span></b><div class="chips">${R.GA.map(g=>`<span class="tag">${gtHtml(g.key)} ×${g.w}</span>`).join('')}</div></div>`;
  }
  root.addEventListener('click',e=>{const b=e.target.closest('[data-p]');if(!b)return;const pi=+b.dataset.p,li=+b.dataset.l,ai=+b.dataset.a,al=M.loci[li];par[pi][li][ai]=al[(al.indexOf(par[pi][li][ai])+1)%al.length];par[pi][li]=sortPair(par[pi][li],al);draw()});
  root.addEventListener('change',e=>{if(e.target.id==='pn-m'){M=GM[e.target.value];par=M.p.map(p=>p.map((s,i)=>splitPair(s,M.loci[i])));draw()}});
  draw();
}

/* ---------- Mendel's garden: probability with real random seeds ---------- */
const PEA=[['لون البذرة','أصفر','أخضر','#ffd54a','#4be08a'],['ملمس البذرة','أملس','مجعد','#ffe9a8','#b9a36a'],['طول النبات','طويل','قصير','#4be08a','#ffc24a'],['لون الزهرة','أحمر','أبيض','#ff5c7a','#f1f5ff'],['لون القرن','أخضر','أصفر','#4be08a','#ffd54a'],['شكل القرن','منتفخ','متخصر','#38c6f8','#b08cff'],['موقع الزهرة','محوري','طرفي','#ff6fb5','#cbd5ee']];
LABS.peas={title:'حديقة مندل',ch:5,desc:'ازرع بذور هجينين وعدّ بنفسك. كلما كثرت البذور اقتربت النسبة من 3 : 1.',mount(root){
  let tr=0,d=0,r=0,last=[];
  const draw=()=>{const T=PEA[tr],n=d+r;
    root.innerHTML=`<div class="ctl"><label>الصفة <select id="pe-t">${PEA.map((p,i)=>`<option value="${i}"${i===tr?' selected':''}>${p[0]}</option>`).join('')}</select></label><span class="tag">التهجين: هجين × هجين ${gtHtml('Aa × Aa')}</span></div>
    <div class="row"><button class="btn sm pri" data-n="20">ازرع 20 بذرة</button><button class="btn sm" data-n="200">ازرع 200</button><button class="btn sm" data-n="2000">ازرع 2000</button><button class="btn sm" data-n="0">صفّر</button></div>
    <div style="display:flex;flex-wrap:wrap;gap:4px;margin:12px 0;min-height:44px">${last.map(x=>`<i style="width:14px;height:14px;border-radius:50%;background:${x?T[3]:T[4]};border:1px solid var(--line)"></i>`).join('')||'<span class="mut">اضغط «ازرع» وشوف شنو يطلع.</span>'}</div>
    <div class="res"><div class="rw"><span><i style="background:${T[3]}"></i>${T[1]} (سائد)</span><span class="num">${d}</span></div><div class="rw"><span><i style="background:${T[4]}"></i>${T[2]} (متنحي)</span><span class="num">${r}</span></div>
    <div class="rw" style="border:1px solid var(--ac)"><span>النسبة الحقيقية عندك</span><span class="num">${r?(d/r).toFixed(2)+' : 1':'—'}</span></div><div class="rw"><span>النسبة المتوقعة</span><span class="num">3 : 1</span></div></div>
    <p class="mut" style="margin-top:8px;font-size:.9rem">${n===0?'مندل عدّ 8023 بذرة بلون البذور: 6022 صفراء و2001 خضراء، يعني 3.01 : 1.':n<100?'العدد قليل، فالنسبة ممكن تبتعد عن 3 : 1. هذا دور الصدفة.':n<1000?'بدأت تقترب. زيد البذور.':'شفت؟ مع الأعداد الكبيرة تثبت النسبة قريب 3 : 1، مثل ما صار ويه مندل.'}</p>`};
  root.addEventListener('click',e=>{const b=e.target.closest('[data-n]');if(!b)return;const n=+b.dataset.n;if(!n){d=r=0;last=[]}else{last=[];for(let i=0;i<n;i++){const dom=Math.random()<.75;dom?d++:r++;if(i<120)last.push(dom)}}draw()});
  root.addEventListener('change',e=>{if(e.target.id==='pe-t'){tr=+e.target.value;d=r=0;last=[];draw()}});draw();
}};

LABS.blood={title:'مختبر الدم: الفصائل والعامل الريسي',ch:5,desc:'اختر طراز الأب والأم وشوف فصائل الأطفال المحتملة، وتأكد من توافق نقل الدم.',mount(root,arg){
  const AB=[['I^AI^A','A نقي'],['I^Ai','A هجين'],['I^BI^B','B نقي'],['I^Bi','B هجين'],['I^AI^B','AB'],['ii','O']],RH=[['RhRh','Rh⁺ نقي'],['Rhrh','Rh⁺ هجين'],['rhrh','Rh⁻']];
  let st=arg==='rh'?{fa:'ii',fr:'Rhrh',ma:'ii',mr:'rhrh'}:{fa:'I^Ai',fr:'Rhrh',ma:'I^Bi',mr:'Rhrh'},dn='O',rc='AB';

  function draw(){
    const pf=[splitPair(st.fa,M.loci[0]),splitPair(st.fr,M.loci[1])],pm=[splitPair(st.ma,M.loci[0]),splitPair(st.mr,M.loci[1])],R=crossCalc(M,pf,pm);

    const bad=ANTI[dn].filter(a=>SER[rc].includes(a.toLowerCase()));

    <div class="res"><b style="font-family:var(--f-d)">الأطفال المحتملون</b>${R.PA.sort((a,b)=>b.w-a.w).map(p=>`<div class="rw"><span><i style="background:var(--bad)"></i>فصيلة ${p.l}</span><span class="num">${p.w}/${R.tot} · ${Math.round(p.w/R.tot*100)}%</span></div>`).join('')}
    <div class="chips">${R.GA.map(g=>`<span class="tag">${gtHtml(g.key.replace(/(Rh|rh)(Rh|rh)$/,' $1$2'))}</span>`).join('')}</div></div>

    ${bad.length?`<br>الجسم المضاد ${bad.map(x=>x.toLowerCase()).join(' و ')} في مصل المستلم يهاجم المستضد ${bad.join(' و ')} على كريات الواهب.`:''}</div>`;
  }

}};

/* ---------- DNA -> mRNA -> tRNA -> protein, with point mutations ---------- */
const AA={UUU:'فينيل ألانين',UUC:'فينيل ألانين',UUA:'ليوسين',UUG:'ليوسين',CUU:'ليوسين',CUC:'ليوسين',CUA:'ليوسين',CUG:'ليوسين',AUU:'آيزوليوسين',AUC:'آيزوليوسين',AUA:'آيزوليوسين',AUG:'مثيونين (بدء)',GUU:'فالين',GUC:'فالين',GUA:'فالين',GUG:'فالين',UCU:'سيرين',UCC:'سيرين',UCA:'سيرين',UCG:'سيرين',CCU:'برولين',CCC:'برولين',CCA:'برولين',CCG:'برولين',ACU:'ثريونين',ACC:'ثريونين',ACA:'ثريونين',ACG:'ثريونين',GCU:'ألانين',GCC:'ألانين',GCA:'ألانين',GCG:'ألانين',UAU:'تايروسين',UAC:'تايروسين',UAA:'إيقاف',UAG:'إيقاف',CAU:'هستدين',CAC:'هستدين',CAA:'كلوتامين',CAG:'كلوتامين',AAU:'أسباراجين',AAC:'أسباراجين',AAA:'لايسين',AAG:'لايسين',GAU:'حامض الأسبارتيك',GAC:'حامض الأسبارتيك',GAA:'حامض الكلوتاميك',GAG:'حامض الكلوتاميك',UGU:'سستين',UGC:'سستين',UGA:'إيقاف',UGG:'تربتوفان',CGU:'أرجنين',CGC:'أرجنين',CGA:'أرجنين',CGG:'أرجنين',AGU:'سيرين',AGC:'سيرين',AGA:'أرجنين',AGG:'أرجنين',GGU:'كلايسين',GGC:'كلايسين',GGA:'كلايسين',GGG:'كلايسين'};
const toRNA=d=>[...d].map(b=>({A:'U',T:'A',C:'G',G:'C'})[b]).join(''),rcomp=r=>[...r].map(b=>({A:'U',U:'A',C:'G',G:'C'})[b]).join(''),dcomp=d=>[...d].map(b=>COMP[b]).join('');
const trip=s=>(s.match(/.{1,3}/g)||[]);
const seqHtml=(s,ref)=>trip(s).map((t,i)=>`<span${ref&&trip(ref)[i]!==t?' class="ch"':''}>${[...t].map(b=>`<span class="${b}">${b}</span>`).join('')}</span>`).join(' ');
LABS.dna={title:'من DNA إلى بروتين',ch:5,desc:'اكتب تتابع DNA وشوف السلسلة المتممة، نسخة mRNA، الكودونات المضادة في tRNA، والأحماض الأمينية. وجرّب الطفرات.',mount(root,arg){
  let base='TACGGTCTCAGC',cur=base,pos=4,note='';
  function draw(){

const svgEl=(w,h,inner)=>`<svg viewBox="0 0 ${w} ${h}" style="display:block;width:100%;height:auto" role="img">${inner}</svg>`;

/* generic matching game: prompt -> pick the right chip */
function quizGame(root,pairs,ask){
  const opts=[...new Set(pairs.map(p=>p[1]))],pick=()=>shuffle(pairs).slice(0,12);let order=pick(),i=0,ok=0,lock=false;
  function draw(){
    if(i>=order.length){root.innerHTML=`<div style="text-align:center;display:grid;gap:8px;justify-items:center;padding:14px"><div style="font:800 2rem var(--f-d)" class="num">${ok} / ${order.length}</div><div class="mut">${ok===order.length?'علامة كاملة.':'عيد المحاولة حتى تثبت.'}</div><button class="btn pri">${ic('play')} من جديد</button></div>`;
      $('button',root).onclick=()=>{order=pick();i=0;ok=0;draw()};if(ok===order.length&&!quizGame.done){quizGame.done=1;gain(15,'تحدي المختبر')}return}
    root.innerHTML=`<div class="mut" style="font-size:.84rem">${ask} · <span class="num">${i+1}/${order.length}</span></div><div style="font:700 1.15rem/1.7 var(--f-b);margin:8px 0 12px">${fmt(order[i][0])}</div><div class="chips">${(opts.length>7?shuffle([order[i][1],...shuffle(opts.filter(o=>o!==order[i][1])).slice(0,5)]):shuffle(opts)).map(o=>`<button class="chipb" data-o="${esc(o)}">${fmt(o)}</button>`).join('')}</div>`;lock=false}
  root.addEventListener('click',e=>{const b=e.target.closest('[data-o]');if(!b||lock)return;lock=true;const good=b.dataset.o===order[i][1];b.classList.add(good?'ok':'no');if(good)ok++;else $$('[data-o]',root).forEach(x=>{if(x.dataset.o===order[i][1])x.classList.add('ok')});setTimeout(()=>{i++;draw()},good?650:1500)});
  draw();
}

LABS.mitosis={title:'فيلم انقسام الخلية',ch:1,desc:'اسحب شريط الزمن أو شغّل الفيلم وتابع الكروموسومات طور بعد طور، بالانقسام الخيطي والاختزالي.',mount(root,arg){
  let mode=arg==='meiosis'?'meiosis':'mitosis',i=0,timer=0;
  const tr='transition:transform .9s ease,opacity .9s ease';
  function build(){
    const cells=[0,1,2,3].map(k=>`<g class="cb" style="${tr}"><circle r="1" fill="none" stroke="#7fd8fb" stroke-width="3" vector-effect="non-scaling-stroke"/></g>`).join('')+[0,1,2,3].map(k=>`<g class="cf" style="${tr}"><circle r="1" fill="#0d1a44"/></g>`).join('');
    const nuc=[0,1,2,3].map(k=>`<g class="nu" style="${tr}"><circle r="1" fill="#b08cff" fill-opacity=".14" stroke="#c9b8ff" stroke-width="2" stroke-dasharray="5 4" vector-effect="non-scaling-stroke"/></g>`).join('');
    const sp=`<g class="sph" style="${tr}">${[-70,-35,0,35,70].map(k=>`<path d="M92,130 Q200,${130+k} 308,130" fill="none" stroke="#ffd98a" stroke-width="1.3"/>`).join('')}<circle cx="92" cy="130" r="5" fill="#ffd54a"/><circle cx="308" cy="130" r="5" fill="#ffd54a"/></g>
      <g class="spv" style="${tr}">${[108,292].map(cx=>[-40,-20,0,20,40].map(k=>`<path d="M${cx},58 Q${cx+k},130 ${cx},202" fill="none" stroke="#ffd98a" stroke-width="1.3"/>`).join('')+`<circle cx="${cx}" cy="58" r="4" fill="#ffd54a"/><circle cx="${cx}" cy="202" r="4" fill="#ffd54a"/>`).join('')}</g>`;
    const ch=CHR.map(c=>[0,1].map(s=>`<g class="cd" style="${tr}"><line x1="${-c[1]/2}" x2="${c[1]/2}" stroke="${c[2]}" stroke-width="7" stroke-linecap="round"/><circle r="3" fill="#fff"/></g>`).join('')).join('');
    root.innerHTML=`<div class="row" style="justify-content:space-between;margin-bottom:8px"><span class="seg"><button data-md="mitosis"${mode==='mitosis'?' class="on"':''}>خيطي</button><button data-md="meiosis"${mode==='meiosis'?' class="on"':''}>اختزالي</button></span><b id="fm-n" style="font-family:var(--f-d);color:var(--ac)"></b></div>
    <div class="stage">${svgEl(400,260,cells+nuc+sp+ch)}<span class="hint">الوردي من الأم · الأزرق من الأب</span></div>
    <div class="sl"><span class="k">الزمن</span><input type="range" id="fm-s" min="0" max="${FILM[mode].length-1}" value="${i}" aria-label="الطور"></div>
    <div class="row" style="margin-top:8px"><button class="btn sm pri" data-pl="1">${ic('play')} شغّل الفيلم</button><button class="btn sm" data-st="-1">${ic('right')} السابق</button><button class="btn sm" data-st="1">التالي ${ic('left')}</button></div><div class="info" id="fm-t"></div>`;
    requestAnimationFrame(apply);
  }
  function apply(){const F=FILM[mode][i];if(!root.isConnected)return;
    const cs=[0,1,2,3].map(k=>F.c[Math.min(k,F.c.length-1)]);if(F.c.length===2){cs[1]=F.c[0];cs[2]=F.c[1];cs[3]=F.c[1]}
    $$('.cb',root).forEach((g,k)=>g.style.transform=`translate(${cs[k][0]}px,${cs[k][1]}px) scale(${cs[k][2]})`);$$('.cf',root).forEach((g,k)=>g.style.transform=`translate(${cs[k][0]}px,${cs[k][1]}px) scale(${cs[k][2]-2})`);
    $$('.nu',root).forEach((g,k)=>{const n=(F.nuc||[])[Math.min(k,(F.nuc||[]).length-1)];g.style.opacity=n?F.env:0;if(n)g.style.transform=`translate(${n[0]}px,${n[1]}px) scale(${n[2]})`});
    $('.sph',root).style.opacity=F.sp==='h'?F.so:0;$('.spv',root).style.opacity=F.sp==='v'?F.so:0;
    $$('.cd',root).forEach((g,k)=>{const p=F.k[k>>1][k&1];g.style.transform=`translate(${p[0]}px,${p[1]}px) rotate(${p[2]+90}deg)`;g.style.opacity=F.op});
    $('#fm-n',root).textContent=F.n;$('#fm-t',root).innerHTML=F.t;$('#fm-s',root).value=i}
  const stop=()=>{clearInterval(timer);timer=0};
  root.addEventListener('input',e=>{if(e.target.id==='fm-s'){stop();i=+e.target.value;apply()}});
  root.addEventListener('click',e=>{const m=e.target.closest('[data-md]');if(m){stop();mode=m.dataset.md;i=0;build();return}
    const s=e.target.closest('[data-st]');if(s){stop();i=Math.max(0,Math.min(FILM[mode].length-1,i+ +s.dataset.st));apply();return}
    if(e.target.closest('[data-pl]')){stop();i=0;apply();timer=setInterval(()=>{if(i>=FILM[mode].length-1||!root.isConnected){stop();return}i++;apply()},2600)}});
  build();return stop;
}};

    if(drag){const dx=e.clientX-drag.x,dy=e.clientY-drag.y;moved+=Math.abs(dx)+Math.abs(dy);G.rotation.y+=dx*.01;G.rotation.x=Math.max(-1.3,Math.min(1.3,G.rotation.x+dy*.01));drag={x:e.clientX,y:e.clientY}}});
  const up=e=>{ptr.delete(e.pointerId);pinch=0;if(drag&&moved<6){const r=cv.getBoundingClientRect();v2.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);ray.setFromCamera(v2,cam);const h=ray.intersectObjects(picks,false);pick(h.length?h[0].object.userData.k:(plant?'wall':'membrane'))}drag=null};
  cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',e=>{ptr.delete(e.pointerId);drag=null;pinch=0});
  cv.addEventListener('wheel',e=>{e.preventDefault();cam.position.z=Math.max(5,Math.min(14,cam.position.z+e.deltaY*.006))},{passive:false});
  root.addEventListener('click',e=>{const p=e.target.closest('[data-p]');if(p){plant=p.dataset.p==='1';$$('[data-p]',root).forEach(b=>b.classList.toggle('on',b===p));build();return}const c=e.target.closest('[data-k]');if(c)pick(c.dataset.k)});
  const loop=()=>{if(!alive)return;if(!drag&&!REDUCED)G.rotation.y+=.004;rd.render(sc,cam);raf=requestAnimationFrame(loop)};loop();
  const rs=()=>size();window.addEventListener('resize',rs);
  return()=>{alive=false;cancelAnimationFrame(raf);window.removeEventListener('resize',rs);rd.dispose()};
}};

  if(k==='ps'){for(let i=0;i<14;i++){const x=i*30,tall=1,ny=i%2?128:150;
      s+=`<polygon points="${x+10},${B} ${x+20},${B} ${x+30},96 ${x},96" fill="#ff8fc4" fill-opacity=".45" stroke="#ffc4de" stroke-width="1.5"/>${nuc(x+15,ny,22,60,'o')}`;
      s+=`<polygon points="${x+20},${B} ${x+40},${B} ${x+33},${B-48} ${x+27},${B-48}" fill="#ff6fb5" fill-opacity=".6" stroke="#ffc4de" stroke-width="1.5"/>${nuc(x+30,B-16,18,30,'r')}`;
      for(let c=0;c<5;c++)s+=`<path d="M${x+3+c*6},96 q2,-8 -1,-14" stroke="#7fd8fb" stroke-width="1.6" fill="none"/>`}return s}
  let y=B;EPI[k][1].forEach((r,ri)=>{const off=ri%2?-r.w/2:0;for(let x=off;x<420;x+=r.w){const cy=y-r.h*(r.np?1-r.np:.5);
      s+=r.dome?`<path d="M${x+2},${y} v${-r.h*.5} q${r.w/2-2},${-r.h*.75} ${r.w-4},0 v${r.h*.5}z" fill="#ff8fc4" fill-opacity=".5" stroke="#ffc4de" stroke-width="1.5"/>${nuc(x+r.w*.36,cy,24,24,'r')}${nuc(x+r.w*.66,cy,24,24,'r')}`
        :`<rect x="${x+1}" y="${y-r.h}" width="${r.w-2}" height="${r.h}" rx="${Math.min(6,r.h/3)}" fill="#ff8fc4" fill-opacity="${.3+ri*.07}" stroke="#ffc4de" stroke-width="1.5"/>${nuc(x+r.w/2,cy,r.w,r.h,r.nu)}`}y-=r.h});
  return s;
}

const stx=(x,y,s,c,sz)=>`<text x="${x}" y="${y}" text-anchor="middle" font-size="${sz||12}" font-weight="600" font-family="IBM Plex Sans Arabic,sans-serif" fill="${c||'#dfe4f7'}">${s}</text>`;
/* generic step-through film: [{n,t,art}] */
function stepLab(root,steps,o){
  o=o||{};let i=0,timer=0;
  const draw=()=>{const s=steps[i];root.innerHTML=`<div class="row" style="justify-content:space-between;margin-bottom:8px"><b style="font-family:var(--f-d);color:var(--ac)">${s.n}</b><span class="tag num">${i+1} / ${steps.length}</span></div>
    <div class="stage">${svgEl(o.w||400,o.h||240,s.art)}</div>
    <div class="sl"><span class="k">${o.k||'المرحلة'}</span><input type="range" min="0" max="${steps.length-1}" value="${i}" data-sl aria-label="${o.k||'المرحلة'}"></div>
    <div class="row" style="margin-top:10px"><button class="btn sm pri" data-pl>${ic('play')} شغّل من البداية</button><button class="btn sm" data-st="-1">السابق</button><button class="btn sm" data-st="1">التالي</button></div><div class="info">${s.t}</div>`};
  const stop=()=>{clearInterval(timer);timer=0};
  root.addEventListener('input',e=>{if(e.target.matches('[data-sl]')){stop();i=+e.target.value;draw();const n=$('[data-sl]',root);if(n)n.focus()}});
  root.addEventListener('click',e=>{const s=e.target.closest('[data-st]');if(s){stop();i=Math.max(0,Math.min(steps.length-1,i+ +s.dataset.st));draw();return}
    if(e.target.closest('[data-pl]')){stop();i=0;draw();timer=setInterval(()=>{if(i>=steps.length-1||!root.isConnected){stop();return}i++;draw()},2800)}});
  draw();return stop;
}

const fisArt=k=>{const cy=120,H=84,cx=200,chr=(x,sc)=>`<path transform="translate(${x} ${cy}) scale(${sc||1})" d="M-22 0c4-18 16-14 18-2s10 16 18 4 10-18 14-4-8 20-20 14-12 4-20 2-14-4-10-14z" fill="none" stroke="#ff6fb5" stroke-width="3"/>`,
  cell=(x,w)=>`<rect x="${x-w/2}" y="${cy-H/2}" width="${w}" height="${H}" rx="${H/2}" fill="#38c6f8" fill-opacity=".14" stroke="#7fd8fb" stroke-width="3"/>`;
  if(k===4)return cell(112,128)+chr(112)+cell(288,128)+chr(288);
  const W=[150,196,236,270][k],d=k===2?12:k===3?30:0,top=cy-H/2,bot=cy+H/2;
  const notch=d?`<polygon points="${cx-d*.8},${top-5} ${cx},${top+d} ${cx+d*.8},${top-5}" fill="#0A0C16"/><polygon points="${cx-d*.8},${bot+5} ${cx},${bot-d} ${cx+d*.8},${bot+5}" fill="#0A0C16"/><polyline points="${cx-d*.8},${top} ${cx},${top+d} ${cx+d*.8},${top}" fill="none" stroke="#7fd8fb" stroke-width="3" stroke-linejoin="round"/><polyline points="${cx-d*.8},${bot} ${cx},${bot-d} ${cx+d*.8},${bot}" fill="none" stroke="#7fd8fb" stroke-width="3" stroke-linejoin="round"/>`:'';
  return cell(cx,W)+notch+(k<2?chr(cx,k?1.1:1):chr(cx-(k===2?40:70),.85)+chr(cx+(k===2?40:70),.85));
};

   {n:'2. توسع الخلية',art:fisArt(1),t:'تتهيأ الخلية للانشطار الثنائي <b>بتوسع جدار الخلية وغشائها</b> وبالتالي الخلية بأكملها.'},

   {n:'4. انسحاب الكروموسومين',art:fisArt(3),t:'كنتيجة لاستطالة الخلية <b>ينسحب الكروموسومان في اتجاهين متعاكسين</b>، ويتوزع السايتوبلازم ويزداد تخصر الخلية.'},
   {n:'5. خليتان متماثلتان',art:fisArt(4),t:'تنقسم الخلية لتنتج <b>خليتين متماثلتين</b>.'}

}};

LABS.dfert={title:'فيلم الإخصاب المزدوج',ch:3,desc:'تابع حبة اللقاح من سقوطها على الميسم لحد ما تتكون الزيجة ونواة السويداء. تحكم بسرعة الفيلم أو اسحب شريط الزمن.',mount(root){
  const F=[
   {n:'حبة اللقاح على الميسم',tb:0,g:[0,1],a:[0,0],b:[0,0],t:'تسقط حبة اللقاح على <b>الميسم</b>. بداخلها <b>خلية أنبوبية</b> و<b>خلية مولدة</b>، وهي تمثل الطور المشيجي الذكري غير الناضج.'},
   {n:'ينمو أنبوب اللقاح',tb:.36,g:[.33,1],a:[.33,0],b:[.33,0],t:'تكوّن حبة اللقاح <b>أنبوب اللقاح</b>، وهو أنبوب ذو قطر ضيق ينمو ويخترق الميسم و<b>القلم</b> باتجاه المبيض.'},
   {n:'تنقسم الخلية المولدة',tb:.62,g:[.58,0],a:[.6,1],b:[.55,1],t:'تخضع <b>الخلية المولدة</b> إلى انقسام اعتيادي واحد فتنتج <b>خليتين ذكريتين</b>. الأنبوب الآن فيه خلية أنبوبية وخليتان ذكريتان: الطور المشيجي الذكري الناضج.'},
   {n:'يدخل من النقير',tb:1,g:[1,0],a:[.995,1],b:[.955,1],t:'يصل الأنبوب إلى البويض و<b>يخترق فتحة النقير</b>، ويدخل إلى الجويزاء ثم إلى <b>الكيس الجنيني</b> ويفرغ محتوياته فيه.'},
   {n:'الإخصاب المزدوج',tb:1,g:[1,0],a:'egg',b:'pol',fz:1,t:'تتحد <b>إحدى الخليتين الذكريتين مع خلية البيضة</b> فتتكون الزيجة (2س). وتتحد <b>الثانية مع النواتين القطبيتين</b> فتتكون نواة السويداء (3س). اتحادان بنفس الوقت: هذا هو الإخصاب المزدوج.'},
   {n:'بعد الإخصاب',tb:1,g:[1,0],a:'egg',b:'pol',fz:2,t:'تنحل <b>الخلايا السمتية الثلاث والخليتان المساعدتان والخلية الأنبوبية</b>. الزيجة تنقسم لتكوّن الجنين، ونواة السويداء تنقسم لتكوّن نسيج السويداء الخازن للغذاء.'}];
  let i=0,timer=0,sp=1;const SPD=[['بطيء',3800],['عادي',2600],['سريع',1500]];
  root.innerHTML=`<div class="row" style="justify-content:space-between;margin-bottom:8px"><b id="df-n" style="font-family:var(--f-d);color:var(--ac)"></b><span class="seg" role="group" aria-label="سرعة الفيلم">${SPD.map((s,k)=>`<button data-sp="${k}"${k===sp?' class="on"':''}>${s[0]}</button>`).join('')}</span></div>
  <div class="stage">${svgEl(400,300,`
    <ellipse cx="200" cy="208" rx="112" ry="80" fill="#2fbf71" fill-opacity=".14" stroke="#7be3a4" stroke-width="3"/><rect x="190" y="48" width="20" height="86" fill="#2fbf71" fill-opacity=".18" stroke="#7be3a4" stroke-width="2"/><ellipse cx="200" cy="42" rx="30" ry="11" fill="#2fbf71" fill-opacity=".35" stroke="#b9f5cf" stroke-width="2"/>
    <path d="M186 262A62 56 0 1 1 214 262" fill="#ffd98a" fill-opacity=".1" stroke="#ffd98a" stroke-width="3" stroke-linecap="round"/><ellipse cx="200" cy="206" rx="38" ry="44" fill="#b08cff" fill-opacity=".14" stroke="#c9b8ff" stroke-width="2"/>
    <path id="df-tb" d="M200 44V132C200 146 280 146 280 206 280 262 220 278 200 268V252" fill="none" stroke="#ffd98a" stroke-width="6" stroke-linecap="round"/>
    <g class="df-o">${[[184,172],[200,168],[216,172]].map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="5.5" fill="#8ea2ff"/>`).join('')}<circle cx="184" cy="236" r="6" fill="#ffc24a"/><circle cx="216" cy="236" r="6" fill="#ffc24a"/></g>
    <circle class="df-p" cx="0" cy="0" r="6.5" fill="#4be08a" style="transform:translate(191px,204px)"/><circle class="df-p" cx="0" cy="0" r="6.5" fill="#4be08a" style="transform:translate(209px,204px)"/>
    <circle id="df-egg" cx="200" cy="238" r="8.5" fill="#ff6fb5"/>
    <circle id="df-pg" cx="200" cy="30" r="13" fill="#ffc24a" stroke="#ffe2a3" stroke-width="2"/>
    <circle id="df-g" cx="0" cy="0" r="5.5" fill="#38c6f8"/><circle id="df-a" cx="0" cy="0" r="4.6" fill="#38c6f8" stroke="#fff" stroke-width="1"/><circle id="df-b" cx="0" cy="0" r="4.6" fill="#38c6f8" stroke="#fff" stroke-width="1"/>
    ${stx(262,46,'الميسم','#b9f5cf',11)}${stx(236,96,'القلم','#b9f5cf',11)}${stx(112,138,'المبيض','#b9f5cf',11)}${stx(200,292,'النقير','#ffd98a',11)}
    <g id="df-l1" opacity="0"><path d="M76 254L186 241" stroke="#e6d9ff" stroke-width="1.2"/><circle cx="76" cy="254" r="2" fill="#e6d9ff"/>${stx(42,258,'زيجة 2س','#e6d9ff',11)}</g><g id="df-l2" opacity="0"><path d="M84 202L190 204" stroke="#b9f5cf" stroke-width="1.2"/><circle cx="84" cy="202" r="2" fill="#b9f5cf"/>${stx(44,199,'نواة السويداء','#b9f5cf',11)}${stx(44,214,'3س','#b9f5cf',11)}</g>`)}</div><p class="legend">الأزرق خلايا ذكرية، الوردي البيضة، الأخضر النواتان القطبيتان، والبنفسجي بعد الإخصاب هو الزيجة.</p>
  <div class="sl"><span class="k">الزمن</span><input type="range" id="df-s" min="0" max="${F.length-1}" value="0" aria-label="مرحلة الفيلم"></div>
  <div class="row" style="margin-top:10px"><button class="btn sm pri" data-pl>${ic('play')} شغّل الفيلم</button><button class="btn sm" data-st="-1">السابق</button><button class="btn sm" data-st="1">التالي</button></div><div class="info" id="df-t"></div>`;
  const tb=$('#df-tb',root),len=tb.getTotalLength(),pt=f=>{const p=tb.getPointAtLength(Math.max(0,Math.min(1,f))*len);return[p.x,p.y]};
  tb.style.strokeDasharray=len;const els=['#df-g','#df-a','#df-b'].map(s=>$(s,root));
  const apply=first=>{const S=F[i],td=(REDUCED||first===true?0:SPD[sp][1]*.7)+'ms';
    $$('#df-tb,#df-g,#df-a,#df-b,.df-p,.df-o,#df-egg,#df-pg,#df-l1,#df-l2',root).forEach(e=>e.style.transition=`transform ${td} ease-in-out,opacity ${td},stroke-dashoffset ${td} linear,fill ${td},r ${td}`);
    tb.style.strokeDashoffset=len*(1-S.tb);
    const pos=v=>v==='egg'?[200,238]:v==='pol'?[200,204]:pt(v[0]);
    [S.g,S.a,S.b].forEach((v,k)=>{const p=pos(v);els[k].style.transform=`translate(${p[0]}px,${p[1]}px)`;els[k].style.opacity=typeof v==='string'?(S.fz===2?0:1):v[1]});
    $$('.df-p',root).forEach((e,k)=>e.style.transform=`translate(${S.fz?200:(k?209:191)}px,204px)`);
    $('#df-egg',root).style.fill=S.fz?'#b08cff':'#ff6fb5';$('#df-egg',root).setAttribute('r',S.fz?11:8.5);
    $('.df-o',root).style.opacity=S.fz===2?0:1;$('#df-pg',root).style.opacity=S.fz===2?.25:1;
    $('#df-l1',root).style.opacity=S.fz?1:0;$('#df-l2',root).style.opacity=S.fz?1:0;
    $('#df-n',root).textContent=S.n;$('#df-t',root).innerHTML=S.t;$('#df-s',root).value=i};
  const stop=()=>{clearInterval(timer);timer=0},play=()=>{stop();timer=setInterval(()=>{if(i>=F.length-1||!root.isConnected){stop();return}i++;apply()},SPD[sp][1])};
  root.addEventListener('input',e=>{if(e.target.id==='df-s'){stop();i=+e.target.value;apply()}});
  root.addEventListener('click',e=>{const s=e.target.closest('[data-sp]');if(s){sp=+s.dataset.sp;$$('[data-sp]',root).forEach(b=>b.classList.toggle('on',b===s));if(timer)play();return}
    const st=e.target.closest('[data-st]');if(st){stop();i=Math.max(0,Math.min(F.length-1,i+ +st.dataset.st));apply();return}
    if(e.target.closest('[data-pl]')){i=0;apply();play()}});
  apply(true);return stop;
}};

/* ---------- menstrual cycle, day by day ---------- */
LABS.cycle={title:'الدورة يوم بيوم',ch:3,desc:'اسحب اليوم من 1 إلى 28 وشوف شيصير بالمبيض، وبجدار الرحم، وبالهورمونات بنفس اللحظة.',mount(root){
  let d=1;const X=k=>24+(k-1)*13.04,
   th=k=>k<=5?40-(k-1)*8:k<=13?8+(k-5)*2:k===14?25:25+(k-14)*1.1,
   es=k=>k<=5?5:k<=13?5+(k-5)*5.2:k===14?30:Math.max(12,24-(k-14)*.9),
   pr=k=>k<=14?3:k<=22?3+(k-14)*5.6:Math.max(5,48-(k-22)*7.2),
   line=(f,y0)=>[...Array(28)].map((_,k)=>(k?'L':'M')+X(k+1).toFixed(1)+' '+(y0-f(k+1)).toFixed(1)).join(' ');
  const ph=k=>k<=5?['طور الدورة الحيضية','مستوى الهورمونات الجنسية <b>واطئ</b>، فيتمزق جدار الرحم والأوعية الدموية فيه، ويخرج الدم عن طريق المهبل خلال الحيض.','الطور الحوصلي: يبدأ إنضاج حوصلة جديدة بتأثير الهورمون المحفز للحويصلات FSH.']
    :k<=13?['طور النشوء (التكاثر)','يزداد إنتاج <b>الإيستروجين</b> بوساطة الحوصلة المبيضية، فيتثخن جدار الرحم الداخلي ويصبح وعائياً وغدياً.','الطور الحوصلي: الحوصلة تكبر وتنضج (أولية، ثم ثانوية، ثم ناضجة).']
    :k===14?['الإباضة','يتمزق جدار الحوصلة الناضجة وتتحرر <b>الخلية البيضية الثانوية</b> والجسم القطبي الأول.','طور التبويض: يحصل بتأثير الهورمون المحفز للجسم الأصفر LH.']
    :['طور الإفراز','يزداد إنتاج <b>البروجسترون</b> بوساطة الجسم الأصفر، فيتضاعف سمك جدار الرحم وتزداد الغدد الرحمية التي تنتج إفرازات مخاطية. الجدار الآن مهيأ لاستقبال الجنين.',k>=25?'طور الجسم الأصفر: إذا لم يحصل حمل يضمحل الجسم الأصفر وتنخفض الهورمونات.':'طور الجسم الأصفر: بقايا الحوصلة الممزقة تحولت إلى الجسم الأصفر الذي يفرز البروجسترون.'];
  const ovary=k=>{const cx=200,cy=30;if(k<=13){const r=5+k*1.15;return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="#ff6fb5" fill-opacity=".2" stroke="#ff9ec2" stroke-width="2"/><circle cx="${cx}" cy="${cy}" r="${Math.min(5,2+k*.25)}" fill="#ff6fb5"/>`}
    if(k===14)return `<path d="M${cx-20} ${cy+12}a20 20 0 1 1 40 0" fill="#ff6fb5" fill-opacity=".2" stroke="#ff9ec2" stroke-width="2"/><circle cx="${cx}" cy="${cy+22}" r="5.5" fill="#ff6fb5"/>`;
    const r=Math.max(7,18-(k>23?(k-23)*2.2:0));return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="#ffd54a" fill-opacity="${k>24?.45:.9}" stroke="#ffe9a3" stroke-width="2"/>`};
  const draw=()=>{const p=ph(d),x=X(d);
    root.innerHTML=`<div class="row" style="justify-content:space-between;margin-bottom:8px"><b style="font-family:var(--f-d);color:var(--ac)">اليوم <span class="num">${d}</span>: ${p[0]}</b><span class="tag">${d<=13?'حوصلة تنضج':d===14?'إباضة':'جسم أصفر'}</span></div>
    <div class="stage">${svgEl(400,262,`${stx(200,74,d<=13?'الحوصلة المبيضية':d===14?'تحرر البيضة':'الجسم الأصفر','#dfe4f7',11)}${ovary(d)}
      <path d="${line(es,150)}" fill="none" stroke="#ff6fb5" stroke-width="2.5"/><path d="${line(pr,150)}" fill="none" stroke="#ffc24a" stroke-width="2.5"/>${stx(64,96,'إيستروجين','#ff9ec2',11)}${stx(332,96,'بروجسترون','#ffd98a',11)}
      <path d="${line(th,222)} L${X(28)} 222 L${X(1)} 222z" fill="#ff5c7a" fill-opacity=".45" stroke="#ff8fa3" stroke-width="2"/>${stx(64,176,'جدار الرحم','#ffb3c0',11)}
      ${[[1,5,'#ff5c7a','الحيض'],[6,13,'#ff9ec2','النشوء'],[14,14,'#fff',''],[15,28,'#ffc24a','الإفراز']].map(b=>`<rect x="${X(b[0])-6}" y="230" width="${X(b[1])-X(b[0])+12}" height="7" rx="3.5" fill="${b[2]}" opacity=".85"/>${b[3]?stx((X(b[0])+X(b[1]))/2,254,b[3],'#c3c9e0',11):''}`).join('')}
      <line x1="${x}" x2="${x}" y1="86" y2="240" stroke="#fff" stroke-width="1.5" stroke-dasharray="4 4"/><circle cx="${x}" cy="${150-es(d)}" r="4" fill="#ff6fb5"/><circle cx="${x}" cy="${150-pr(d)}" r="4" fill="#ffc24a"/>`)}</div><p class="legend">المنحنيات تقريبية للتوضيح. الوردي إيستروجين، الأصفر بروجسترون، والأحمر سمك جدار الرحم.</p>
    <div class="sl"><span class="k">اليوم</span><input type="range" id="cy-d" min="1" max="28" value="${d}" aria-label="يوم الدورة"></div>
    <div class="info"><b>بالرحم:</b> ${p[1]}<br><b>بالمبيض:</b> ${p[2]}</div>`};
  root.addEventListener('input',e=>{if(e.target.id==='cy-d'){d=+e.target.value;draw();$('#cy-d',root).focus()}});draw();
}};

 ['الزيجة (البيضة المخصبة)','2س'],['نواة السويداء','3س'],['البوغ الفعّال (الكيس الجنيني)','س'],['الأبواغ الكبيرة','س'],['الخلية الأنبوبية','س'],['الخلية الأم للأبواغ الصغيرة','2س'],['الأبواغ الصغيرة','س'],
 ['الطور البوغي في النبات','2س'],['الطور المشيجي في النبات','س'],['الثالوس الأولي','س'],['الكلاميدوموناس','س'],['البوغ الزيجي للكلاميدوموناس','2س'],['النواة المندمجة في البراميسيوم','2س'],['النواة الأولية الذكرية في البراميسيوم','س'],['ذكر نحل العسل','س'],['كروموسومات السحلية السوطية قبل الانقسام الاختزالي مباشرة','4س']],'ما المجموعة الكروموسومية لـ')}};

/* ===== ch4 labs: embryology ===== */
const C4={pink:'#ff9ec2',egg:'#ff6fb5',blue:'#7fd8fb',yel:'#ffd54a',red:'#ff7a7a',grn:'#7be3a4',vio:'#c9b8ff',mut:'#9aa3c7'};
const cel=(x,y,r,c,nu)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${c}" fill-opacity=".2" stroke="${c}" stroke-width="${r>20?2.2:1.6}"/>${nu===0?'':`<circle cx="${x}" cy="${y}" r="${Math.max(2,r*.24)}" fill="${c}"/>`}`;
const memb=r=>`<circle cx="200" cy="118" r="${r||70}" fill="none" stroke="${C4.vio}" stroke-width="1.6" stroke-dasharray="5 6"/>`;
/* horseshoe of cells, opening at top */
const shoe=(R,n,r,c,cx,cy)=>{cx=cx||200;cy=cy||122;let s='';for(let k=0;k<n;k++){const a=(-150+300*k/(n-1))*Math.PI/180;s+=cel((cx+R*Math.sin(a)).toFixed(1),(cy+R*Math.cos(a)).toFixed(1),r,c,0)}return s};
const ring=(R,n,r,c)=>{let s='';for(let k=0;k<n;k++){const a=k/n*Math.PI*2;s+=cel((200+R*Math.sin(a)).toFixed(1),(118+R*Math.cos(a)).toFixed(1),r,c)}return s};

LABS.cleave={title:'من زيجة إلى أعضاء',ch:4,desc:'فيلم مراحل التكوين الجنيني: الإخصاب، التفلج، الأريمة، التمعد، والتعضي. اسحب الشريط وشوف شلون تتحول خلية وحدة إلى طبقات جرثومية.',mount(root){

   {n:'التفلج: أربع فلجات',art:memb(74)+[[172,90],[228,90],[172,146],[228,146]].map(p=>cel(p[0],p[1],27,C4.egg)).join(''),t:'ثم تنقسم إلى <b>أربع فلجات</b>. كل خلية من هذي تسمى <b>فلجة (Blastomere)</b>.'},
   {n:'التفلج: ثمان فلجات',art:memb(74)+ring(40,8,19,C4.egg),t:'ثم إلى <b>ثمان فلجات</b>، وبتكرار الانقسامات تتحول البيضة المخصبة إلى كرة من الخلايا.'},
   {n:'الأريمة (Blastula)',art:memb(78)+ring(62,24,8.5,C4.pink)+stx(200,122,'كرة جوفاء','#ffd0e6',14)+stx(200,226,'أريمة الرميح: سمكها خلية واحدة','#ffd0e6',14),t:'كرة من الخلايا تدعى <b>الأريمة</b>. في <b>الرميح</b> تكون جوفاء سمكها خلية واحدة، وفي <b>الضفدع</b> نصف جوفاء سمكها عدة خلايا، وفي <b>الزواحف والطيور</b> قرص جرثومي على أحد أقطاب البيضة.'},
   {n:'التمعد: معيدة بطبقتين',art:shoe(72,24,8,C4.blue)+shoe(48,16,7.5,C4.yel)+stx(330,60,'الأديم الظاهر',C4.blue,14)+stx(200,210,'الأديم المتوسط الباطن',C4.yel,14)+'<path d="M300 66L262 82" stroke="#7fd8fb" stroke-width="1.2"/>',t:'بالحركات المكونة للشكل تنطوي الخلايا فيصير الجنين <b>معيدة (Gastrula)</b>. في <b>اللافقريات والحبليات الأولية</b> تتكون من طبقتين: <b>الأديم الظاهر</b> و<b>الأديم المتوسط الباطن</b>.'},
   {n:'التمعد: ثلاث طبقات جرثومية',art:shoe(76,26,7.5,C4.blue)+shoe(58,20,7,C4.red)+shoe(40,14,6.5,C4.yel)+stx(338,56,'الأديم الظاهر',C4.blue,14)+stx(64,70,'الأديم المتوسط',C4.red,14)+stx(200,222,'الأديم الباطن',C4.yel,14)+'<path d="M306 62L268 80M96 76L150 96" stroke="#9aa3c7" stroke-width="1.2"/>',t:'في أجنة <b>الحبليات الأخرى</b> تتكون المعيدة من <b>ثلاث طبقات</b>: الأديم الظاهر (Ectoderm)، والأديم المتوسط (Mesoderm)، والأديم الباطن (Endoderm).'},
   {n:'التمايز والتعضي',art:[['الأديم الظاهر',C4.blue,70],['الأديم المتوسط',C4.red,118],['الأديم الباطن',C4.yel,166]].map(l=>`<rect x="268" y="${l[2]-16}" width="112" height="32" rx="9" fill="${l[1]}" fill-opacity=".2" stroke="${l[1]}" stroke-width="1.6"/>`+stx(324,l[2]+5,l[0],l[1],14)).join('')+'<path d="M258 70Q232 70 232 118T258 166M232 118H196" stroke="#9aa3c7" stroke-width="1.6" fill="none"/><path d="M196 118l9-5v10z" fill="#9aa3c7"/>'+[['ظهاري',48],['ضام',90],['عضلي',132],['عصبي',174]].map(l=>`<rect x="40" y="${l[1]-15}" width="132" height="30" rx="9" fill="#dfe4f7" fill-opacity=".08" stroke="#dfe4f7" stroke-opacity=".5"/>`+stx(106,l[1]+5,'نسيج '+l[0],'#dfe4f7',14)).join(''),t:'<b>التمايز:</b> يتحدد مصير الخلايا، مثلاً الخلية العصبية تمتلك محوراً وتشجرات (تمايز نسجي). <b>التعضي:</b> تتمايز الطبقات الجرثومية الثلاث إلى <b>أربعة أنواع رئيسة من الأنسجة</b>: الظهارية والضامة والعضلية والعصبية، والأنسجة تنتظم أعضاء.'}
